<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Tower Pro</title>
    <style>
        :root {
            --bg-main: #060b19;
            --bg-card: rgba(15, 23, 42, 0.6);
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        .game-container {
            width: 100%;
            max-width: 430px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px;
            box-shadow: var(--glow-shadow);
            z-index: 10;
        }

        /* Header Navigation Widget */
        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .wallet-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            font-weight: 800;
            color: var(--accent-gold);
        }

        /* Tower Vertical Board Theater */
        .tower-theater {
            background: rgba(10, 15, 30, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column-reverse; /* Game climbs from bottom to top */
            gap: 8px;
            width: 100%;
            height: 340px;
            overflow-y: hidden;
            position: relative;
        }

        .tower-row {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 1fr;
            gap: 6px;
            padding: 4px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid transparent;
            transition: all 0.2s ease;
            opacity: 0.4;
        }

        .tower-row.active-row {
            opacity: 1;
            background: rgba(59, 130, 246, 0.05);
            border-color: rgba(59, 130, 246, 0.2);
        }

        .tower-row.completed-row {
            opacity: 0.8;
        }

        .mult-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent-gold);
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            border: 1px solid var(--border-glass);
        }

        .block-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease, background 0.15s ease;
        }

        .block-btn:disabled {
            cursor: not-allowed;
        }

        /* Block Status Styles */
        .block-egg {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(4, 120, 87, 0.25)) !important;
            border-color: #10b981 !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .block-skull {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(153, 27, 27, 0.4)) !important;
            border-color: #ef4444 !important;
        }

        /* Control Input Deck */
        .control-deck {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(10, 15, 30, 0.4);
            padding: 12px;
            border-radius: 18px;
            border: 1px solid var(--border-glass);
        }

        .label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .input-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
            height: 42px;
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 12px;
            font-weight: 700;
            font-size: 1rem;
            outline: none;
        }

        .scale-btn {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: white;
            padding: 0 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-left: 1px solid var(--border-glass);
        }

        .action-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            color: white;
            transition: all 0.15s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-cashout {
            background: linear-gradient(135deg, #10b981, #047857);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .action-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Header -->
    <div class="header-widget">
        <div class="user-tag">👤 <span id="userName">Guest</span></div>
        <div class="wallet-display">🪙 <span id="userBalance">Loading...</span></div>
    </div>

    <!-- Tower Field Grid (Climbs Bottom-to-Top) -->
    <div class="tower-theater" id="towerArena"></div>

    <!-- Operating System Control Units -->
    <div class="control-deck">
        <div>
            <div class="label">Bet Amount</div>
            <div class="input-container">
                <input type="number" id="betValue" value="10" min="1">
                <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
            </div>
        </div>

        <button class="action-btn btn-start" id="mainActionBtn" onclick="toggleTowerEngineState()" disabled>Syncing Wallet...</button>
    </div>
</div>

<script>
    // CENTRAL BACKEND APPS SCRIPT PATH ENDPOINT
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

    let balance = 0;
    let betAmount = 0;
    let gameActive = false;
    let currentRowIndex = 0;
    let currentMultiplier = 1.00;

    // Game Layout Setup configuration metrics
    const totalRowsCount = 6;
    const rowMultipliers = [1.42, 2.05, 2.95, 4.25, 6.15, 8.90];
    let towersDataMatrix = []; // holds pre-calculated values for each row layout

    // Filter dynamic clean local user identification details handles
    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();
    document.getElementById("userName").innerText = cleanUser;

    // Generate Visual Matrix Layout Elements
    const towerArena = document.getElementById("towerArena");
    for (let r = 0; r < totalRowsCount; r++) {
        const rowDiv = document.createElement("div");
        rowDiv.className = "tower-row";
        rowDiv.id = `row-${r}`;

        const badge = document.createElement("div");
        badge.className = "mult-badge";
        badge.innerText = `${rowMultipliers[r]}x`;
        rowDiv.appendChild(badge);

        for (let b = 0; b < 3; b++) {
            const btn = document.createElement("button");
            btn.className = "block-btn";
            btn.dataset.blockIndex = b;
            btn.disabled = true;
            btn.addEventListener("click", () => handleBlockSelection(r, b));
            rowDiv.appendChild(btn);
        }
        towerArena.appendChild(rowDiv);
    }

    // 1. LIVE REFRESH SYNC FROM SHEET DATA DIRECT
    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                
                if (!gameActive) {
                    const actionBtn = document.getElementById("mainActionBtn");
                    actionBtn.disabled = false;
                    actionBtn.innerText = "Bet & Start Climb";
                    actionBtn.className = "action-btn btn-start";
                }
            }
        }).catch(err => {
            console.error("Database sync connection failure:", err);
            document.getElementById('userBalance').innerText = "Offline";
        });
    }

    // 2. BACKEND TRANSACTION DISPATCH PIPE PACKET
    function syncTxToDatabase(amountChange, updateScreenUI = true) {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&amount=${amountChange}`)
        .then(r => r.json())
        .then(data => {
            if (updateScreenUI && data && data.balance !== undefined) {
                balance = parseFloat(data.balance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
        }).catch(e => console.error("Database link drop tracking loss:", e));
    }

    function adjustStakeScale(type) {
        if (gameActive) return;
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function toggleTowerEngineState() {
        const actionBtn = document.getElementById("mainActionBtn");

        if (!gameActive) {
            const betInput = document.getElementById("betValue");
            const desiredBet = parseInt(betInput.value) || 0;

            if (desiredBet < 1 || desiredBet > balance) {
                alert("Stake bounds error! Balance metrics mismatched.");
                return;
            }

            // BALANCE BUG RESOLUTION: Subtract local variable values and display layout views instantly
            betAmount = desiredBet;
            balance -= betAmount;
            document.getElementById('userBalance').innerText = balance.toFixed(2);

            // Transmit background write command to server spreadsheet structure quietly
            syncTxToDatabase(-betAmount, false);

            // Initialize Game Mechanics Data structures
            gameActive = true;
            currentRowIndex = 0;
            currentMultiplier = 1.00;
            buildRandomTowerHiddenMatrix();

            betInput.disabled = true;
            actionBtn.innerText = "Select Active Row Box";
            actionBtn.disabled = true;
            actionBtn.className = "action-btn btn-cashout";

            clearVisualSkinsArena();
            activateRowHighlights(0);
        } else {
            executeCashoutSequence();
        }
    }

    function buildRandomTowerHiddenMatrix() {
        towersDataMatrix = [];
        for (let r = 0; r < totalRowsCount; r++) {
            // 3 blocks per row: 2 contain safe assets (eggs), 1 contains danger (skull)
            let rowConfiguration = ['egg', 'egg', 'egg'];
            let killerSkullIndex = Math.floor(Math.random() * 3);
            rowConfiguration[killerSkullIndex] = 'skull';
            towersDataMatrix.push(rowConfiguration);
        }
    }

    function clearVisualSkinsArena() {
        for (let r = 0; r < totalRowsCount; r++) {
            const rowEl = document.getElementById(`row-${r}`);
            rowEl.className = "tower-row";
            const buttons = rowEl.getElementsByClassName("block-btn");
            for (let b = 0; b < buttons.length; b++) {
                buttons[b].className = "block-btn";
                buttons[b].innerText = "";
                buttons[b].disabled = true;
            }
        }
    }

    function activateRowHighlights(rowIndex) {
        for (let r = 0; r < totalRowsCount; r++) {
            const rowEl = document.getElementById(`row-${r}`);
            const buttons = rowEl.getElementsByClassName("block-btn");
            
            if (r === rowIndex) {
                rowEl.className = "tower-row active-row";
                for (let b = 0; b < buttons.length; b++) {
                    buttons[b].disabled = false;
                }
            } else {
                if (r < rowIndex) rowEl.className = "tower-row completed-row";
                for (let b = 0; b < buttons.length; b++) {
                    buttons[b].disabled = true;
                }
            }
        }
    }

    function handleBlockSelection(rowIndex, blockIndex) {
        if (!gameActive || rowIndex !== currentRowIndex) return;

        const rowEl = document.getElementById(`row-${rowIndex}`);
        const selectedButton = rowEl.getElementsByClassName("block-btn")[blockIndex];
        const outcomeResult = towersDataMatrix[rowIndex][blockIndex];

        if (outcomeResult === 'skull') {
            // STEPPED ON SKULL: Handle failure game cycle end parameters
            selectedButton.className = "block-btn block-skull";
            selectedButton.innerText = "💥";
            triggerTowerLossSequence();
        } else {
            // STEPPED ON SAFE EGG: Advance level parameters models mapping paths
            selectedButton.className = "block-btn block-egg";
            selectedButton.innerText = "🐉";

            currentMultiplier = rowMultipliers[rowIndex];
            const activeWinningsEstimate = betAmount * currentMultiplier;

            const actionBtn = document.getElementById("mainActionBtn");
            actionBtn.disabled = false;
            actionBtn.innerText = `Cash Out 🪙${activeWinningsEstimate.toFixed(2)} (x${currentMultiplier})`;

            if (currentRowIndex + 1 < totalRowsCount) {
                currentRowIndex++;
                activateRowHighlights(currentRowIndex);
            } else {
                // Reached top level completely out structure
                executeCashoutSequence();
            }
        }
    }

    function executeCashoutSequence() {
        if (!gameActive) return;
        gameActive = false;

        const totalClimbWinnings = betAmount * currentMultiplier;
        balance += totalClimbWinnings;
        document.getElementById('userBalance').innerText = balance.toFixed(2);

        // WIN SEQUENCE: Dispatch transaction update directly to server sheet architecture safely
        syncTxToDatabase(totalClimbWinnings, true);

        revealEntireTowerTruthMap();

        const actionBtn = document.getElementById("mainActionBtn");
        actionBtn.disabled = true;
        actionBtn.innerText = `CLIMB SUCCESS! +🪙${totalClimbWinnings.toFixed(2)}`;

        resetEnvironmentDelayed();
    }

    function triggerTowerLossSequence() {
        gameActive = false;
        revealEntireTowerTruthMap();

        const actionBtn = document.getElementById("mainActionBtn");
        actionBtn.disabled = true;
        actionBtn.innerText = "DRAGON CAUGHT YOU! GAME OVER";

        // LOSS SEQUENCE: Local variable balances dropped out permanently. No writing call triggered.
        resetEnvironmentDelayed();
    }

    function revealEntireTowerTruthMap() {
        for (let r = 0; r < totalRowsCount; r++) {
            const rowEl = document.getElementById(`row-${r}`);
            const buttons = rowEl.getElementsByClassName("block-btn");
            for (let b = 0; b < buttons.length; b++) {
                buttons[b].disabled = true;
                const truth = towersDataMatrix[r][b];
                if (truth === 'skull') {
                    if (buttons[b].innerText !== "💥") {
                        buttons[b].className = "block-btn block-skull";
                        buttons[b].innerText = "💀";
                        buttons[b].style.opacity = "0.4";
                    }
                } else {
                    if (buttons[b].innerText !== "🐉") {
                        buttons[b].innerText = "🥚";
                        buttons[b].style.opacity = "0.3";
                    }
                }
            }
        }
    }

    function resetEnvironmentDelayed() {
        setTimeout(() => {
            document.getElementById("betValue").disabled = false;
            
            const actionBtn = document.getElementById("mainActionBtn");
            actionBtn.innerText = "Bet & Start Climb";
            actionBtn.className = "action-btn btn-start";
            actionBtn.disabled = false;

            clearVisualSkinsArena();
        }, 4000);
    }

    // Direct immediate launch sequences initialization passes
    fetchLiveWallet();
</script>

</body>
</html>
