<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plinko Premium Pro</title>
    <style>
        :root {
            --bg-main: #060b19;
            --bg-card: rgba(15, 23, 42, 0.6);
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        .game-container {
            width: 100%;
            max-width: 430px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px;
            box-shadow: var(--glow-shadow);
            z-index: 10;
        }

        /* Header Navigation Widget */
        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .wallet-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            font-weight: 800;
            color: var(--accent-gold);
        }

        /* Physics Pyramid Theatre Stage Canvas */
        .pyramid-theater {
            background: rgba(10, 15, 30, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            width: 100%;
            aspect-ratio: 4 / 4.3;
            position: relative;
            overflow: hidden;
        }

        #plinkoCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Operating Control Deck Panel Console */
        .control-deck {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(10, 15, 30, 0.4);
            padding: 12px;
            border-radius: 18px;
            border: 1px solid var(--border-glass);
        }

        .label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .input-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
            height: 44px;
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 12px;
            font-weight: 700;
            font-size: 1rem;
            outline: none;
        }

        .scale-btn {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: white;
            padding: 0 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-left: 1px solid var(--border-glass);
        }

        .drop-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            transition: all 0.1s ease;
        }

        .drop-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .drop-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Header -->
    <div class="header-widget">
        <div class="user-tag">👤 <span id="userName">Guest</span></div>
        <div class="wallet-display">🪙 <span id="userBalance">Loading...</span></div>
    </div>

    <!-- Live Physics Arena Frame Stage -->
    <div class="pyramid-theater">
        <canvas id="plinkoCanvas"></canvas>
    </div>

    <!-- Operating System Control Deck Configurations -->
    <div class="control-deck">
        <div>
            <div class="label">Bet Amount</div>
            <div class="input-container">
                <input type="number" id="betValue" value="10" min="1">
                <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
            </div>
        </div>

        <button class="drop-btn" id="mainDropBtn" onclick="executeBallDropCycle()" disabled>Syncing Wallet...</button>
    </div>
</div>

<script>
    // CENTRAL BACKEND APPS SCRIPT PATH ENDPOINT
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

    let balance = 0;
    let initialSyncComplete = false;

    // Physics Engine Environment Variables Parameters
    const canvas = document.getElementById("plinkoCanvas");
    const ctx = canvas.getContext("2d");
    
    let w = 0, h = 0;
    const rows = 8; // standard 8 rows peg configuration pyramid
    let pegs = [];
    let buckets = [];
    let balls = [];

    // Bucket Multipliers Distributions Config Array
    const bucketMultipliers = [5.5, 2.0, 1.3, 0.7, 0.4, 0.7, 1.3, 2.0, 5.5];
    const bucketColors = ["#ef4444", "#f97316", "#f59e0b", "#3b82f6", "#10b981", "#3b82f6", "#f59e0b", "#f97316", "#ef4444"];

    // Filter dynamic clean local user identification details handles
    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();
    document.getElementById("userName").innerText = cleanUser;

    function resizeEngineStageLayout() {
        w = canvas.offsetWidth;
        h = canvas.offsetHeight;
        canvas.width = w * window.devicePixelRatio;
        canvas.height = h * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        generatePegMatrixPyramidCoords();
    }

    function generatePegMatrixPyramidCoords() {
        pegs = [];
        const startY = 45;
        const spacingY = (h - 90) / (rows + 1);

        for (let r = 0; r < rows; r++) {
            const rowPegCount = r + 3; // start row with 3 pegs, expanding downwards
            const rowWidth = (rowPegCount - 1) * (w * 0.085);
            const startX = (w - rowWidth) / 2;

            for (let p = 0; p < rowPegCount; p++) {
                pegs.push({
                    x: startX + p * (w * 0.085),
                    y: startY + r * spacingY
                });
            }
        }

        // Generate Bottom Target Payout Landing Buckets Boxes Area Configurations
        buckets = [];
        const lastRowPegCount = rows + 2;
        const lastRowWidth = (lastRowPegCount - 1) * (w * 0.085);
        const startBucketX = (w - lastRowWidth) / 2;
        const bucketWidth = w * 0.085;
        const bucketY = h - 35;

        for (let b = 0; b < bucketMultipliers.length; b++) {
            buckets.push({
                x: startBucketX + b * bucketWidth,
                y: bucketY,
                w: bucketWidth - 4,
                h: 24,
                mult: bucketMultipliers[b],
                color: bucketColors[b]
            });
        }
    }

    // 1. LIVE REFRESH SYNC FROM SHEET DATA DIRECT
    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                
                if (!initialSyncComplete) {
                    initialSyncComplete = true;
                    document.getElementById("mainDropBtn").disabled = false;
                    document.getElementById("mainDropBtn").innerText = "Drop Ball";
                }
            }
        }).catch(err => {
            console.error("Database tracking pipe link loss:", err);
            document.getElementById('userBalance').innerText = "Offline";
        });
    }

    // 2. BACKEND TRANSACTION DISPATCH PIPE PACKET
    function syncTxToDatabase(amountChange, updateScreenUI = true) {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&amount=${amountChange}`)
        .then(r => r.json())
        .then(data => {
            if (updateScreenUI && data && data.balance !== undefined) {
                balance = parseFloat(data.balance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
        }).catch(e => console.error("Database network link synchronization hazard:", e));
    }

    function adjustStakeScale(type) {
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function executeBallDropCycle() {
        const betInput = document.getElementById("betValue");
        const desiredBet = parseInt(betInput.value) || 0;

        if (desiredBet < 1 || desiredBet > balance) {
            alert("Stake bounds error! Balance metrics mismatched.");
            return;
        }

        // BALANCE BUG RESOLUTION: Subtract local variable values and display layout views instantly
        balance -= desiredBet;
        document.getElementById('userBalance').innerText = balance.toFixed(2);

        // Transmit background write command to server spreadsheet structure quietly
        syncTxToDatabase(-desiredBet, false);

        // Instantiate new physics node particle into live memory space loop array
        // Slight randomization on entry node to allow varying bounce path trees
        const entryPointX = (w / 2) + (Math.random() * 8 - 4);
        balls.push({
            x: entryPointX,
            y: 15,
            vx: 0,
            vy: 0,
            radius: 5.5,
            bet: desiredBet,
            gravity: 0.16,
            bounce: -0.45,
            friction: 0.98
        });
    }

    function tickPhysicsLoopEngine() {
        ctx.clearRect(0, 0, w, h);

        // Draw Matrix Pins Structure
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        for (let i = 0; i < pegs.length; i++) {
            ctx.beginPath();
            ctx.arc(pegs[i].x, pegs[i].y, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw Bottom Mult Boxes
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 9px sans-serif";
        for (let b = 0; b < buckets.length; b++) {
            ctx.fillStyle = buckets[b].color;
            // Draw smooth rounded rectangular base boxes profiles
            ctx.beginPath();
            ctx.roundRect(buckets[b].x - buckets[b].w/2, buckets[b].y, buckets[b].w, buckets[b].h, 4);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.fillText(`${buckets[b].mult}x`, buckets[b].x, buckets[b].y + buckets[b].h/2);
        }

        // Cycle Trace Particle Coordinates Loops Engine
        for (let k = balls.length - 1; k >= 0; k--) {
            let ball = balls[k];

            ball.vy += ball.gravity;
            ball.vx *= ball.friction;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Handle Wall Collisions bounds checks
            if (ball.x - ball.radius < 5) { ball.x = 5 + ball.radius; ball.vx *= -0.5; }
            if (ball.x + ball.radius > w - 5) { ball.x = w - 5 - ball.radius; ball.vx *= -0.5; }

            // Handle Peg Collision Arrays Vectors Distances
            for (let p = 0; p < pegs.length; p++) {
                let dx = ball.x - pegs[p].x;
                let dy = ball.y - pegs[p].y;
                let distance = Math.hypot(dx, dy);

                if (distance < ball.radius + 3) {
                    // Resolve overlap boundaries forces vector 
                    let angle = Math.atan2(dy, dx);
                    ball.x = pegs[p].x + (ball.radius + 3.1) * Math.cos(angle);
                    ball.y = pegs[p].y + (ball.radius + 3.1) * Math.sin(angle);

                    // Map vector bounce changes allocations
                    let speed = Math.hypot(ball.vx, ball.vy);
                    ball.vx = Math.cos(angle) * speed * Math.abs(ball.bounce) + (Math.random() * 0.4 - 0.2);
                    ball.vy = Math.sin(angle) * speed * Math.abs(ball.bounce);
                }
            }

            // Check Bucket Settlement Bounds Outcomes
            if (ball.y >= h - 40) {
                let resolvedIndex = Math.floor((ball.x - buckets[0].x + buckets[0].w/2) / (w * 0.085));
                resolvedIndex = Math.max(0, Math.min(resolvedIndex, buckets.length - 1));

                // Process specific bucket calculation payout outcome 
                const finalMatchedMultiplier = buckets[resolvedIndex].mult;
                const winningsPayoutAmount = ball.bet * finalMatchedMultiplier;

                balance += winningsPayoutAmount;
                document.getElementById('userBalance').innerText = balance.toFixed(2);

                // Dispatch transaction update packet directly to server sheet architecture safely
                syncTxToDatabase(winningsPayoutAmount, true);

                // Delete processing node particle object from active arrays stack loops memory allocation
                balls.splice(k, 1);
                continue;
            }

            // Draw Physics Active Glowing Ball Particle Handle
            ctx.fillStyle = "#ef4444";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ef4444";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // reset shaders overrides
        }

        requestAnimationFrame(tickPhysicsLoopEngine);
    }

    // Direct immediate launch sequences initialization passes
    window.addEventListener('resize', resizeEngineStageLayout);
    resizeEngineStageLayout();
    tickPhysicsLoopEngine();
    fetchLiveWallet();
</script>

</body>
</html>
