<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plinko Mobile</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --primary-blue: #3b82f6;
            --primary-hover: #2563eb;
            --accent-gold: #f59e0b;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            overflow: hidden;
        }

        .game-wrapper {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* Balance & Stats Header */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid var(--border-glass);
        }

        .wallet-pill {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 0.95rem;
        }

        /* Canvas Pyramid Container */
        .board-viewport {
            position: relative;
            width: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
        }

        /* Mobile Cockpit Terminal Controls */
        .control-deck {
            padding: 16px;
            background: rgba(15, 23, 42, 0.7);
            border-top: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .bet-input-row {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
        }

        .bet-input-row input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 12px;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }

        .step-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: white;
            width: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .step-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .btn-drop {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--primary-blue);
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: all 0.15s ease;
        }
        .btn-drop:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-drop:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            color: #94a3b8;
        }

        /* Recent Multipliers Log Ribbon */
        .history-ribbon {
            display: flex;
            gap: 6px;
            padding: 4px 16px 12px 16px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .history-ribbon::-webkit-scrollbar { display: none; }

        .hist-pill {
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            background: #334155;
            color: #f8fafc;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header-bar">
        <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Plinko System</span>
        <div class="wallet-pill">🪙 <span id="balanceDisplay">Loading...</span></div>
    </div>

    <div class="board-viewport">
        <canvas id="plinkoCanvas"></canvas>
    </div>

    <div class="history-ribbon" id="historyLog"></div>

    <div class="control-deck">
        <div>
            <div class="input-label">Bet Size</div>
            <div class="bet-input-row">
                <button class="step-btn" onclick="adjustBet(-5)">-</button>
                <input type="number" id="betAmount" value="10" min="1" step="1" readonly>
                <button class="step-btn" onclick="adjustBet(5)">+</button>
            </div>
        </div>

        <button class="btn-drop" id="dropBtn" onclick="executeBallDrop()" disabled>Syncing Balance...</button>
    </div>
</div>

<script>
    // CORE DATABASE CONNECTION URL
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

    // Setup Canvas Resolution Matrix Properties
    const canvas = document.getElementById('plinkoCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 400;
    canvas.height = 430;

    // Plinko Grid Parameters Setup
    const ROWS = 12; 
    const pins = [];
    const balls = [];
    const buckets = [];
    
    // Payout Multiplier Array Map Configuration Rules (13 values for 12 rows)
    const MULTIPLIERS = [10, 4, 1.5, 1.1, 0.6, 0.3, 0.2, 0.3, 0.6, 1.1, 1.5, 4, 10];
    const BUCKET_COLORS = ['#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', '#10b981', '#06b6d4', '#10b981', '#84cc16', '#eab308', '#f59e0b', '#f97316', '#ef4444'];

    let walletBalance = 0;
    let activeBallCount = 0;

    // Parse profile handles cleanly from central storage space parameters
    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const userHandle = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();

    // Generate fixed coordinate vectors for pyramid system array pins
    function buildPyramidMatrix() {
        const startY = 40;
        const spacingY = 26;
        
        for (let r = 0; r < ROWS; r++) {
            const rowPins = r + 3; 
            const startX = canvas.width / 2 - ((rowPins - 1) * 18) / 2;
            const y = startY + (r * spacingY);
            
            for (let p = 0; p < rowPins; p++) {
                const x = startX + (p * 18);
                pins.push({ x: x, y: y, radius: 2.5 });
            }
        }

        // Populate bottom score buckets references coordinates parameters
        const totalBuckets = ROWS + 1;
        const bucketW = 24;
        const startBX = canvas.width / 2 - (totalBuckets * bucketW) / 2;
        const bucketY = canvas.height - 25;

        for (let b = 0; b < totalBuckets; b++) {
            buckets.push({
                x: startBX + (b * bucketW),
                y: bucketY,
                w: bucketW - 2,
                h: 18,
                mult: MULTIPLIERS[b],
                color: BUCKET_COLORS[b]
            });
        }
    }

    // 1. DATABASE FETCH SYNC VALUE COMMAND
    function fetchRemoteBalance() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(userHandle)}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                walletBalance = parseFloat(data.balance) || 0;
                document.getElementById('balanceDisplay').innerText = walletBalance.toFixed(2);
                
                const btn = document.getElementById('dropBtn');
                if (activeBallCount === 0) {
                    btn.disabled = false;
                    btn.innerText = "Drop Ball";
                }
            }
        }).catch(err => {
            console.error("handshake matrix error:", err);
            document.getElementById('balanceDisplay').innerText = "Offline";
        });
    }

    // 2. TRANSACTION PIPELINE CONNECTOR TO CENTRAL SHEETS LOGIC MANAGER
    function pushTxToDatabase(deltaVal, updateInterface = true) {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(userHandle)}&amount=${deltaVal}`)
        .then(r => r.json())
        .then(data => {
            if (updateInterface && data && data.balance !== undefined) {
                walletBalance = parseFloat(data.balance);
                document.getElementById('balanceDisplay').innerText = walletBalance.toFixed(2);
            }
        }).catch(e => console.error("Database connection failure:", e));
    }

    function adjustBet(amt) {
        let el = document.getElementById('betAmount');
        let nextVal = parseInt(el.value) + amt;
        if (nextVal >= 1 && nextVal <= walletBalance) el.value = nextVal;
    }

    function executeBallDrop() {
        const betInput = document.getElementById('betAmount');
        const betAmount = parseInt(betInput.value) || 0;

        if (betAmount < 1 || betAmount > walletBalance) {
            alert("Insufficient balance metrics! Please crosscheck assets.");
            return;
        }

        // Immediately take bet amount out of local screen container view layout space assets
        walletBalance -= betAmount;
        document.getElementById('balanceDisplay').innerText = walletBalance.toFixed(2);

        // Send subtraction to server without updating the UI instantly
        pushTxToDatabase(-betAmount, false);

        activeBallCount++;
        
        // Push payload specifications variables onto runtime execution thread engine tracking properties
        balls.push({
            x: canvas.width / 2 + (Math.random() * 4 - 2), // Small randomization variance at apex drop point
            y: 15,
            vx: 0,
            vy: 1.5,
            radius: 4,
            bet: betAmount
        });
    }

    // Main Physics Engine & Animation Loop
    function updatePhysicsLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw static field pins arrays structures loops
        ctx.fillStyle = '#94a3b8';
        pins.forEach(pin => {
            ctx.beginPath();
            ctx.arc(pin.x, pin.y, pin.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        // Draw Bottom Mult boxes text metrics mappings layout spaces frames
        buckets.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(b.x, b.y, b.w, b.h, 4);
                ctx.fill();
            } else {
                ctx.fillRect(b.x, b.y, b.w, b.h);
            }
            
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(b.mult + 'x', b.x + b.w/2, b.y + 12);
        });

        // Loop execution vector paths updates for active ball properties tracking frames
        for (let i = balls.length - 1; i >= 0; i--) {
            const ball = balls[i];

            // Apply gravity metrics acceleration formulas parameters constants
            ball.vy += 0.16; 
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Introduce dampening collision border bounce attributes
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.vx *= -0.5;
                ball.x = ball.x - ball.radius < 0 ? ball.radius : canvas.width - ball.radius;
            }

            // Pin Collision Detection Mechanics
            pins.forEach(pin => {
                const dx = ball.x - pin.x;
                const dy = ball.y - pin.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < ball.radius + pin.radius) {
                    // Normalize collision physics vector paths directions coordinates
                    const nx = dx / distance;
                    const ny = dy / distance;

                    // Deflect ball with bounce velocity dampening allocation
                    const bounce = 0.55;
                    const dotProduct = ball.vx * nx + ball.vy * ny;
                    
                    ball.vx = (ball.vx - 2 * dotProduct * nx) * bounce;
                    ball.vy = (ball.vy - 2 * dotProduct * ny) * bounce;

                    // Displace position coordinates to break intersecting geometries binds overlapping loops
                    ball.x = pin.x + (ball.radius + pin.radius) * nx;
                    ball.y = pin.y + (ball.radius + pin.radius) * ny;
                    
                    // Inject minor horizontal noise variation drift parameters to assist distribution paths layout arrays
                    ball.vx += (Math.random() - 0.5) * 0.2;
                }
            });

            // Target landing zone evaluation conditions parameters validation triggers
            if (ball.y >= canvas.height - 35) {
                // Pinpoint targeted bucket indexing values
                let landedBucket = buckets.find(b => ball.x >= b.x && ball.x <= b.x + b.w);
                
                // Fallback catch to nearest index properties boundary alignments handles
                if (!landedBucket) {
                    landedBucket = ball.x < canvas.width / 2 ? buckets[0] : buckets[buckets.length - 1];
                }

                const winPayoutValue = ball.bet * landedBucket.mult;
                
                // Process added winnings locally onto the UI screen tracking assets immediately
                walletBalance += winPayoutValue;
                document.getElementById('balanceDisplay').innerText = walletBalance.toFixed(2);
                
                // Push database request transaction updates parameters frames synchronously
                pushTxToDatabase(winPayoutValue, true);

                logHistoryRibbon(landedBucket.mult);
                
                // Clean references out of live tracking arrays frames
                balls.splice(i, 1);
                activeBallCount--;
                continue;
            }

            // Draw active bouncing ball
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        requestAnimationFrame(updatePhysicsLoop);
    }

    function logHistoryRibbon(mult) {
        const container = document.getElementById('historyLog');
        const pill = document.createElement('span');
        pill.className = 'hist-pill';
        pill.innerText = mult + 'x';
        
        container.insertBefore(pill, container.firstChild);
        if (container.children.length > 8) container.removeChild(container.lastChild);
    }

    // Trigger initialization on startup configuration sequence passes
    buildPyramidMatrix();
    fetchRemoteBalance();
    updatePhysicsLoop();
</script>

</body>
</html>
