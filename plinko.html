<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plinko</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #0b0f19;
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .back-nav-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .btn-back {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-glass);
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--primary-blue);
            border-color: transparent;
        }

        .game-wrapper {
            width: 100%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .sidebar-controls {
            width: 320px;
            background: var(--bg-sidebar);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border-glass);
        }

        .board-theater {
            flex: 1;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 16px;
            max-width: 900px;
            padding: 0 8px;
        }

        .user-tag {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .wallet-display {
            background: var(--bg-sidebar);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            font-weight: bold;
            color: var(--accent-gold);
        }

        .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-container {
            display: flex;
            background: var(--bg-main);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            height: 44px;
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 14px;
            font-weight: 700;
            font-size: 0.95rem;
            outline: none;
        }

        .scale-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-light);
            padding: 0 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .scale-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .action-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: all 0.15s ease;
            background: #10b981;
            box-shadow: 0 4px 0 #059669;
        }
        .action-btn:hover:not(:disabled) { background: #059669; }
        .action-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none !important;
        }
        .action-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        canvas {
            background: #070b12;
            border-radius: 12px;
            max-width: 100%;
            height: auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        @media (max-width: 768px) {
            .game-wrapper { flex-direction: column-reverse; }
            .sidebar-controls { width: 100%; border-right: none; border-top: 1px solid var(--border-glass); }
            .board-theater { padding: 10px; }
        }
    </style>
</head>
<body>

<div class="back-nav-container">
    <a href="game.html" class="btn-back">← Back to Games</a>
</div>

<div class="header-widget">
    <div class="user-tag">👤 User: <span id="userName">Guest</span></div>
    <div class="wallet-display">🪙 <span id="userBalance">0.00</span></div>
</div>

<div class="game-wrapper">
    <div class="sidebar-controls">
        <div>
            <div class="label">Bet Amount</div>
            <div class="input-container">
                <input type="number" id="betValue" value="10" min="1">
                <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
            </div>
        </div>

        <button class="action-btn" id="dropBallBtn" onclick="initiateBallDrop()" disabled>Syncing Balance...</button>
    </div>

    <div class="board-theater">
        <canvas id="plinkoCanvas" width="500" height="550"></canvas>
    </div>
</div>

<script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbzWEe-nOLyOZlwk8t76jgULfhPfXZdtDPqtaWi4dJuEIP5HMJW8GQJM7N7HPK5x63NzfQ/exec";

    let balance = 0;
    const canvas = document.getElementById("plinkoCanvas");
    const ctx = canvas.getContext("2d");

    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();
    document.getElementById("userName").innerText = cleanUser;

    // Plinko Grid Setup Configurations
    const rows = 8;
    const pegs = [];
    const activeBalls = [];
    
    // Multipliers array from left to right for 8 rows (9 buckets)
    const multipliers = [5.0, 2.0, 1.4, 0.6, 0.4, 0.6, 1.4, 2.0, 5.0];
    const bucketColors = ["#ef4444", "#f97316", "#f59e0b", "#84cc16", "#10b981", "#84cc16", "#f59e0b", "#f97316", "#ef4444"];

    // Build Peg Grid Coordinates System
    const startY = 70;
    const spacingY = 45;
    for (let r = 0; r < rows; r++) {
        const pegCount = r + 3; 
        const spacingX = 40;
        const startX = (canvas.width / 2) - ((pegCount - 1) * spacingX / 2);
        for (let p = 0; p < pegCount; p++) {
            pegs.push({
                x: startX + (p * spacingX),
                y: startY + (r * spacingY),
                radius: 4
            });
        }
    }

    // Determine bottom bucket layout coordinates
    const totalBuckets = rows + 1; 
    const bucketWidth = 42;
    const bucketHeight = 30;
    const bucketStartY = canvas.height - 45;
    const bucketStartX = (canvas.width / 2) - ((totalBuckets * bucketWidth) / 2);

    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`, {
            method: "GET",
            mode: "cors",
            redirect: "follow"
        })
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                document.getElementById("dropBallBtn").disabled = false;
                document.getElementById("dropBallBtn").innerText = "Drop Ball";
            }
        }).catch(err => console.error("Wallet lookup error:", err));
    }

    function syncTxToDatabase(amountChange) {
        let url = `${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&bet_amount=${amountChange}`;
        fetch(url, { method: "GET", mode: "cors", redirect: "follow" })
        .then(r => r.json())
        .then(data => {
            if (data && data.newBalance !== undefined) {
                balance = parseFloat(data.newBalance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
        }).catch(err => console.error("Database sync failed:", err));
    }

    function adjustStakeScale(type) {
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function initiateBallDrop() {
        const betInput = document.getElementById("betValue");
        const betAmount = parseInt(betInput.value) || 0;

        if (betAmount < 1 || betAmount > balance) {
            alert("Invalid bet amount selected!");
            return;
        }

        // Deduct upfront bet value instantly
        balance -= betAmount;
        document.getElementById('userBalance').innerText = balance.toFixed(2);
        syncTxToDatabase(-betAmount);

        // Spawn a new physics ball at the top entry channel
        activeBalls.push({
            x: canvas.width / 2 + (Math.random() * 6 - 3), // slight offset random variance
            y: 20,
            vx: 0,
            vy: 1.5, // Initial downward plunge speed triggers drop
            radius: 7,
            bet: betAmount
        });
    }

    function enginePhysicsUpdate() {
        const gravity = 0.16;
        const friction = 0.5;

        for (let b = activeBalls.length - 1; b >= 0; b--) {
            let ball = activeBalls[b];

            // Apply downward acceleration physics
            ball.vy += gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Side wall collision safety cushions
            if (ball.x - ball.radius < 10) {
                ball.x = 10 + ball.radius;
                ball.vx *= -0.4;
            }
            if (ball.x + ball.radius > canvas.width - 10) {
                ball.x = canvas.width - 10 - ball.radius;
                ball.vx *= -0.4;
            }

            // Peg collision checks
            for (let p = 0; p < pegs.length; p++) {
                let peg = pegs[p];
                let dx = ball.x - peg.x;
                let dy = ball.y - peg.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < ball.radius + peg.radius) {
                    // Push out of collision state to prevent sticky peg trapping
                    let angle = Math.atan2(dy, dx);
                    ball.x = peg.x + Math.cos(angle) * (ball.radius + peg.radius);
                    ball.y = peg.y + Math.sin(angle) * (ball.radius + peg.radius);

                    // Bounce velocity diversion calculations
                    let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                    ball.vx = Math.cos(angle) * speed * friction;
                    ball.vy = Math.sin(angle) * speed * friction;
                    
                    // Add slight random path diversion element to break perfect vertical states
                    ball.vx += (Math.random() * 0.4 - 0.2);
                }
            }

            // Landed inside bucket matrix check
            if (ball.y >= bucketStartY) {
                let landingIndex = Math.floor((ball.x - bucketStartX) / bucketWidth);
                if (landingIndex < 0) landingIndex = 0;
                if (landingIndex >= totalBuckets) landingIndex = totalBuckets - 1;

                let payoutMult = multipliers[landingIndex];
                let roundWinnings = ball.bet * payoutMult;

                balance += roundWinnings;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                syncTxToDatabase(roundWinnings);

                // Delete processing instance index from array
                activeBalls.splice(b, 1);
            }
        }
    }

    function renderFrameLoop() {
        enginePhysicsUpdate();

        // Canvas clearing refresh layout
        ctx.fillStyle = "#070b12";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Render Peg elements
        ctx.fillStyle = "#ffffff";
        for (let p = 0; p < pegs.length; p++) {
            ctx.beginPath();
            ctx.arc(pegs[p].x, pegs[p].y, pegs[p].radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // Render Multiplier Buckets
        for (let i = 0; i < totalBuckets; i++) {
            let x = bucketStartX + (i * bucketWidth);
            ctx.fillStyle = bucketColors[i];
            ctx.fillRect(x + 2, bucketStartY, bucketWidth - 4, bucketHeight);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 10px Arial";
            ctx.textAlign = "center";
            ctx.fillText(multipliers[i] + "x", x + (bucketWidth / 2), bucketStartY + 18);
        }

        // Render Active Falling Balls
        ctx.fillStyle = "#ff3b30";
        for (let b = 0; b < activeBalls.length; b++) {
            let ball = activeBalls[b];
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        requestAnimationFrame(renderFrameLoop);
    }

    // Initialize environment sequences
    fetchLiveWallet();
    requestAnimationFrame(renderFrameLoop);
</script>
</body>
</html>
