<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plinko</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #0b0f19;
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #00e676;
            --accent-red: #ff3333;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .back-nav-container {
            width: 100%;
            max-width: 940px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .btn-back {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-glass);
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--primary-blue);
            border-color: transparent;
        }

        .game-wrapper {
            width: 100%;
            max-width: 940px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .sidebar-controls {
            width: 340px;
            background: var(--bg-sidebar);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border-glass);
        }

        .grid-theater {
            flex: 1;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: relative;
            min-height: 500px;
            align-items: center;
            justify-content: center;
        }

        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 16px;
            max-width: 940px;
            padding: 0 8px;
        }

        .user-tag {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .wallet-display {
            background: var(--bg-sidebar);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            font-weight: bold;
            color: var(--accent-gold);
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-container {
            display: flex;
            background: var(--bg-main);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            height: 44px;
            align-items: center;
        }

        .input-container input, .input-container select {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 14px;
            font-weight: 700;
            font-size: 0.95rem;
            outline: none;
        }

        .input-container select option {
            background: var(--bg-sidebar);
            color: white;
        }

        .scale-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-light);
            padding: 0 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-left: 1px solid rgba(255,255,255,0.1);
            height: 100%;
        }

        .scale-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .action-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: #020617;
            background: var(--accent-green);
            box-shadow: 0 4px 0 #047857;
            transition: all 0.15s ease;
            text-transform: uppercase;
        }

        .action-btn:hover:not(:disabled) { background: #34d399; }

        .action-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none !important;
        }

        .action-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .game-wrapper { flex-direction: column-reverse; }
            .sidebar-controls { width: 100%; border-right: none; border-top: 1px solid var(--border-glass); }
            .grid-theater { padding: 12px; min-height: 400px; }
        }
    </style>
</head>
<body>

<div class="back-nav-container">
    <a href="game.html" class="btn-back">← Back to Games</a>
</div>

<div class="header-widget">
    <div class="user-tag">👤 User: <span id="userName">Guest</span></div>
    <div class="wallet-display">🪙 <span id="userBalance">0.00</span></div>
</div>

<div class="game-wrapper">
    <div class="sidebar-controls">
        <div>
            <div class="label">Bet Amount</div>
            <div class="input-container">
                <input type="number" id="betValue" value="10" min="1">
                <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
            </div>
        </div>

        <div>
            <div class="label">Risk / Difficulty</div>
            <div class="input-container">
                <select id="difficultySelect" onchange="updateMultipliersDisplay()">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </div>

        <button class="action-btn" id="mainActionBtn" onclick="dropPlinkoBall()" disabled>Syncing Balance...</button>
    </div>

    <div class="grid-theater">
        <div class="canvas-container">
            <canvas id="plinkoCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbzWEe-nOLyOZlwk8t76jgULfhPfXZdtDPqtaWi4dJuEIP5HMJW8GQJM7N7HPK5x63NzfQ/exec";

    let balance = 0;
    const canvas = document.getElementById("plinkoCanvas");
    const ctx = canvas.getContext("2d");

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSyntheticSound(frequency, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();
    document.getElementById("userName").innerText = cleanUser;

    const rows = 8;
    let pegs = [];
    let balls = [];
    let multipliers = [];

    const difficultySettings = {
        easy:   [5.0, 2.0, 1.4, 0.6, 0.4, 0.6, 1.4, 2.0, 5.0],
        medium: [10, 4.0, 1.5, 0.7, 0.2, 0.7, 1.5, 4.0, 10],
        hard:   [29, 8.0, 2.0, 0.5, 0.2, 0.5, 2.0, 8.0, 29]
    };

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight || 500;
        generatePegGrid();
    }
    window.addEventListener('resize', resizeCanvas);

    function generatePegGrid() {
        pegs = [];
        const spacingX = canvas.width / (rows + 2);
        const spacingY = (canvas.height - 80) / rows;

        for (let r = 2; r <= rows + 1; r++) {
            const pegsInRow = r;
            const rowWidth = (pegsInRow - 1) * spacingX;
            const startX = (canvas.width - rowWidth) / 2;
            const y = (r - 1) * spacingY + 30;

            for (let p = 0; p < pegsInRow; p++) {
                pegs.push({ x: startX + p * spacingX, y: y });
            }
        }
    }

    function updateMultipliersDisplay() {
        const diff = document.getElementById("difficultySelect").value;
        multipliers = difficultySettings[diff];
    }

    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`, {
            method: "GET",
            mode: "cors",
            redirect: "follow"
        })
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                document.getElementById("mainActionBtn").disabled = false;
                document.getElementById("mainActionBtn").innerText = "Drop Ball";
            }
        }).catch(err => console.error("Wallet hook exception:", err));
    }

    function syncTxToDatabase(amountChange) {
        let url = `${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&bet_amount=${amountChange}`;

        fetch(url, {
            method: "GET",
            mode: "cors",
            redirect: "follow"
        })
        .then(r => r.json())
        .then(data => {
            if (data && data.newBalance !== undefined) {
                balance = parseFloat(data.newBalance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            } else if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
        }).catch(err => console.error("Database update sequence rejected:", err));
    }

    function adjustStakeScale(type) {
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function dropPlinkoBall() {
        const betInput = document.getElementById("betValue");
        const desiredBet = parseInt(betInput.value) || 0;

        if (desiredBet < 1 || desiredBet > balance) {
            alert("Insufficient or invalid bet amount!");
            return;
        }

        balance -= desiredBet;
        document.getElementById('userBalance').innerText = balance.toFixed(2);
        
        syncTxToDatabase(-desiredBet);

        balls.push({
            x: canvas.width / 2 + (Math.random() * 4 - 2),
            y: 15,
            vx: 0,
            vy: 2.5,
            radius: 6,
            bet: desiredBet,
            difficulty: document.getElementById("difficultySelect").value,
            currentRow: 0
        });

        playSyntheticSound(523.25, 'sine', 0.1);
    }

    function drawMultipliers() {
        const totalBuckets = rows + 1;
        const spacingX = canvas.width / (rows + 2);
        const rowWidth = (totalBuckets - 1) * spacingX;
        const startX = (canvas.width - rowWidth) / 2;
        const y = canvas.height - 35;

        ctx.font = "bold 11px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (let b = 0; b < totalBuckets; b++) {
            const mVal = multipliers[b] || 1;
            const bucketX = startX + b * spacingX;

            let color = "#ef4444"; 
            if (b >= 2 && b <= 6) color = "#fbbf24"; 
            if (b >= 3 && b <= 5) color = "#2563eb"; 

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(bucketX - (spacingX/2 - 3), y - 12, spacingX - 6, 24, 4);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.fillText(mVal + "x", bucketX, y);
        }
    }

    function handlePhysicsEngineLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        pegs.forEach(peg => {
            ctx.beginPath();
            ctx.arc(peg.x, peg.y, 3.5, 0, 2 * Math.PI);
            ctx.fill();
        });

        drawMultipliers();

        const gravity = 0.16;
        const bounceDamping = 0.45;

        for (let i = balls.length - 1; i >= 0; i--) {
            let ball = balls[i];

            ball.vy += gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            pegs.forEach(peg => {
                let dx = ball.x - peg.x;
                let dy = ball.y - peg.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < ball.radius + 3.5) {
                    let nx = dx / dist;
                    let ny = dy / dist;
                    ball.x = peg.x + nx * (ball.radius + 3.5);
                    ball.y = peg.y + ny * (ball.radius + 3.5);

                    let dot = ball.vx * nx + ball.vy * ny;
                    ball.vx = (ball.vx - 2 * dot * nx) * bounceDamping;
                    ball.vy = (ball.vy - 2 * dot * ny) * bounceDamping;

                    ball.vx += (Math.random() - 0.5) * 0.4;
                    
                    playSyntheticSound(783.99, 'triangle', 0.04);
                }
            });

            if (ball.x < ball.radius) { ball.x = ball.radius; ball.vx *= -0.5; }
            if (ball.x > canvas.width - ball.radius) { ball.x = canvas.width - ball.radius; ball.vx *= -0.5; }

            ctx.fillStyle = "#ff3366";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, 2 * Math.PI);
            ctx.fill();

            if (ball.y >= canvas.height - 55) {
                const spacingX = canvas.width / (rows + 2);
                const totalBuckets = rows + 1;
                const rowWidth = (totalBuckets - 1) * spacingX;
                const startX = (canvas.width - rowWidth) / 2;

                let closestIndex = Math.round((ball.x - startX) / spacingX);
                if (closestIndex < 0) closestIndex = 0;
                if (closestIndex >= totalBuckets) closestIndex = totalBuckets - 1;

                const chosenMultipliers = difficultySettings[ball.difficulty];
                const winMultiplier = chosenMultipliers[closestIndex];
                const totalReturn = ball.bet * winMultiplier;

                balance += totalReturn;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                
                syncTxToDatabase(totalReturn);

                playSyntheticSound(winMultiplier >= 1 ? 880 : 330, 'sine', 0.18);
                balls.splice(i, 1);
            }
        }

        requestAnimationFrame(handlePhysicsEngineLoop);
    }

    setTimeout(() => {
        resizeCanvas();
        updateMultipliersDisplay();
        handlePhysicsEngineLoop();
        fetchLiveWallet();
    }, 100);
</script>
</body>
</html>
