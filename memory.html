<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Memory Game</title>

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#ff6b6b,#6c5ce7,#00cec9);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
text-align:center;
width:95%;
max-width:700px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:20px;
}

.card{
height:100px;
background:white;
border-radius:12px;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
cursor:pointer;
color:black;
font-weight:bold;
}

.info{
margin-top:15px;
font-size:20px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
margin:10px;
font-size:16px;
}

.back{
background:white;
color:black;
}

</style>

</head>
<body>

<div class="container">

<h1>🧠 Memory Game</h1>

<p>Match all pairs to win!</p>

<div class="info">

Moves: <span id="moves">0</span>

  |  

Matched: <span id="matched">0</span>/8

</div>

<div class="grid" id="grid"></div>

<button onclick="startGame()">
Restart
</button>

<button class="back"
onclick="window.location.href='game.html'">
Back </button>

</div>

<script>

const emojis = [
"🍎","🍎",
"🚀","🚀",
"🎲","🎲",
"⚽","⚽",
"🐱","🐱",
"🎵","🎵",
"🌟","🌟",
"🍕","🍕"
];

let firstCard = null;
let secondCard = null;
let lockBoard = false;

let moves = 0;
let matchedPairs = 0;

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j =
Math.floor(Math.random()*(i+1));

[array[i],array[j]] =
[array[j],array[i]];
}

return array;

}

function startGame(){

const grid =
document.getElementById("grid");

grid.innerHTML="";

firstCard = null;
secondCard = null;
lockBoard = false;

moves = 0;
matchedPairs = 0;

document.getElementById("moves")
.innerHTML = 0;

document.getElementById("matched")
.innerHTML = 0;

const cards =
shuffle([...emojis]);

cards.forEach(symbol=>{

const card =
document.createElement("div");

card.className = "card";

card.dataset.symbol =
symbol;

card.innerHTML = "?";

card.addEventListener(
"click",
flipCard
);

grid.appendChild(card);

});

}

function flipCard(){

if(lockBoard) return;

if(this === firstCard) return;

this.innerHTML =
this.dataset.symbol;

if(!firstCard){

firstCard = this;

return;

}

secondCard = this;

moves++;

document.getElementById("moves")
.innerHTML = moves;

if(
firstCard.dataset.symbol ===
secondCard.dataset.symbol
){

matchedPairs++;

document.getElementById("matched")
.innerHTML =
matchedPairs;

firstCard = null;
secondCard = null;

if(matchedPairs === 8){

setTimeout(()=>{

alert(
"🎉 Congratulations! You matched all pairs in "
+ moves +
" moves."
);

},300);

}

}
else{

lockBoard = true;

setTimeout(()=>{

firstCard.innerHTML = "?";
secondCard.innerHTML = "?";

firstCard = null;
secondCard = null;

lockBoard = false;

},1000);

}

}

startGame();

</script>

</body>
</html>
