<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Number Guess Challenge</title>

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#ff6b6b,#6c5ce7,#00cec9);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
background:rgba(255,255,255,0.15);
padding:30px;
border-radius:20px;
text-align:center;
width:90%;
max-width:500px;
backdrop-filter:blur(10px);
}

h1{
margin-bottom:20px;
}

input{
width:80%;
padding:12px;
border:none;
border-radius:10px;
font-size:18px;
}

button{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:18px;
}

.result{
margin-top:20px;
font-size:22px;
font-weight:bold;
}

.stats{
margin-top:20px;
font-size:18px;
}

.back{
background:white;
color:black;
margin-left:10px;
}

</style>

</head>
<body>

<div class="container">

<h1>🎯 Number Guess Challenge</h1>

<p>Guess a number between 1 and 100</p>

<input
type="number"
id="guessInput"
placeholder="Enter your guess">

<br>

<button onclick="checkGuess()">
Guess
</button>

<button onclick="restartGame()">
Restart
</button>

<button class="back"
onclick="window.location.href='game.html'">
Back </button>

<div class="result" id="result"></div>

<div class="stats">

<p>
Attempts:
<span id="attempts">0</span>
</p>

<p>
Best Score:
<span id="best">0</span>
</p>

</div>

</div>

<script>

let secret =
Math.floor(Math.random()*100)+1;

let attempts = 0;

let best =
localStorage.getItem("bestScore") || 0;

document.getElementById("best")
.innerHTML = best;

function checkGuess(){

let guess =
Number(
document.getElementById("guessInput").value
);

if(!guess){

alert("Enter a number");

return;
}

attempts++;

document.getElementById("attempts")
.innerHTML =
attempts;

if(guess === secret){

document.getElementById("result")
.innerHTML =
"🎉 Correct! Number was "
+ secret;

if(best == 0 || attempts < best){

best = attempts;

localStorage.setItem(
"bestScore",
best
);

document.getElementById("best")
.innerHTML = best;
}

}
else if(guess < secret){

document.getElementById("result")
.innerHTML =
"📉 Guessed Number is Lower, Try Again!!";

}
else{

document.getElementById("result")
.innerHTML =
"📈 Guessed Number is High, Try Again!!";

}

}

function restartGame(){

secret =
Math.floor(Math.random()*100)+1;

attempts = 0;

document.getElementById("attempts")
.innerHTML = 0;

document.getElementById("result")
.innerHTML = "";

document.getElementById("guessInput")
.value = "";

}

</script>

</body>
</html>
