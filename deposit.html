<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit Money💳</title>
    <style>
        :root {
            --bg-main: #060b19;
            --bg-card: rgba(15, 23, 42, 0.6);
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
        }

        /* Top Navigation Bar */
        .top-nav-container {
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
            z-index: 10;
        }

        .btn-game-nav {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            color: #dfe6e9;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-game-nav:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-blue);
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .deposit-container {
            width: 100%;
            max-width: 430px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 24px;
            box-shadow: var(--glow-shadow);
            z-index: 10;
        }

        /* Payment Instruction Headers */
        .payment-banner {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 14px;
            border-radius: 14px;
            text-align: center;
        }

        .upi-target {
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
        }

        .upi-address {
            color: var(--accent-gold);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .time-alert {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fbbf24;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
            height: 44px;
            align-items: center;
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 12px;
            font-weight: 600;
            font-size: 0.95rem;
            outline: none;
        }

        .input-container input::placeholder {
            color: #475569;
        }

        /* Status UI Message Element */
        .status-message {
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .status-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green); }
        .status-error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent-red); color: var(--accent-red); }

        .submit-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.15s ease;
        }

        .submit-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        /* History Module */
        .history-section {
            border-top: 1px solid var(--border-glass);
            padding-top: 16px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
        }
        .history-list::-webkit-scrollbar { display: none; }

        .history-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-amount {
            font-weight: 700;
            color: white;
        }

        .item-txid {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .item-status {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-gold);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body>

<div class="top-nav-container">
    <a href="game.html" class="btn-game-nav">← Back to Home</a>
</div>

<div class="deposit-container">
    <div class="payment-banner">
        <div class="upi-target">Please Pay to: <span class="upi-address">xx@upi</span></div>
    </div>

    <div class="time-alert">
        ⚠️ It takes upto 24 Hours to Update Your Balance.
    </div>

    <div id="statusBox" class="status-message"></div>

    <div class="input-group">
        <div class="label">Username</div>
        <div class="input-container">
            <input type="text" id="usernameField" placeholder="Enter your username" readonly>
        </div>
    </div>

    <div class="input-group">
        <div class="label">Amount</div>
        <div class="input-container">
            <input type="number" id="amountField" min="1" placeholder="Enter amount paid">
        </div>
    </div>

    <div class="input-group">
        <div class="label">UPI Transaction ID</div>
        <div class="input-container">
            <input type="text" id="txidField" placeholder="Enter 12-digit Ref No.">
        </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="sendDepositReport()">Submit Request</button>

    <div class="history-section">
        <div class="history-title">Your Deposit History</div>
        <div class="history-list" id="historyContainer">
            </div>
    </div>
</div>

<script>
    // Configured with the Web App Deployment execution endpoint URL
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbxdewVWmLbZ5Z6iVrnm01ARLX1z51eUVDunoz6tbkEqam2v2XKrD2SWIr-CSuF0HFRg/exec";

    // Auto-detect and populate workspace identities
    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();
    document.getElementById("usernameField").value = cleanUser;

    // Run history renderer initialization immediately
    renderLocalHistory();

    function sendDepositReport() {
        const amountInput = document.getElementById("amountField");
        const txidInput = document.getElementById("txidField");
        const submitBtn = document.getElementById("submitBtn");
        
        const amount = parseFloat(amountInput.value) || 0;
        const txid = txidInput.value.trim();

        // Standard validation sweeps
        if (amount <= 0) {
            displayStatus("Please enter a valid balance metric greater than 0.", "error");
            return;
        }
        if (txid.length < 6) {
            displayStatus("Please enter a valid tracking UPI Transaction Ref ID.", "error");
            return;
        }

        // Lock form state interfaces during pending execution operations
        submitBtn.disabled = true;
        submitBtn.innerText = "Transmitting to Sheet...";
        hideStatus();

        // Construct parameters targeting spreadsheet log entries mapping pipelines
        const targetUrl = `${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&amount=${amount}&txid=${encodeURIComponent(txid)}&nocache=${Date.now()}`;

        fetch(targetUrl)
        .then(response => response.json())
        .then(data => {
            // Display exact success verification text requested
            displayStatus("Yayy! Deposit Successfull", "success");
            
            // Save request block parameters into application instance local structural histories
            saveRequestToLocalLog(amount, txid);
            
            // Wipe variable fields layout values clean
            amountInput.value = "";
            txidInput.value = "";
        })
        .catch(err => {
            console.error("Transmission Exception:", err);
            displayStatus("Network response timeout. Request captured locally.", "error");
            // Fail-safe tracking log write if internet buffers drops momentarily
            saveRequestToLocalLog(amount, txid);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Request";
        });
    }

    function saveRequestToLocalLog(amt, transactionId) {
        const logStorageKey = `deposit_history_${cleanUser}`;
        let records = JSON.parse(localStorage.getItem(logStorageKey)) || [];
        
        const newEntry = {
            amount: amt.toFixed(2),
            txid: transactionId,
            status: "Pending",
            date: new Date().toLocaleDateString()
        };
        
        records.unshift(newEntry);
        localStorage.setItem(logStorageKey, JSON.stringify(records));
        renderLocalHistory();
    }

    function renderLocalHistory() {
        const logStorageKey = `deposit_history_${cleanUser}`;
        const container = document.getElementById("historyContainer");
        let records = JSON.parse(localStorage.getItem(logStorageKey)) || [];

        if (records.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:15px; font-size:0.75rem; color:var(--text-muted);">No recent deposit records found.</div>`;
            return;
        }

        container.innerHTML = records.map(item => `
            <div class="history-item">
                <div class="item-details">
                    <div class="item-amount">🪙 ${item.amount}</div>
                    <div class="item-txid">ID: ${item.txid}</div>
                </div>
                <div class="item-status">${item.status}</div>
            </div>
        `).join('');
    }

    function displayStatus(msg, type) {
        const box = document.getElementById("statusBox");
        box.innerText = msg;
        box.className = `status-message status-${type}`;
        box.style.display = "block";
    }

    function hideStatus() {
        document.getElementById("statusBox").style.display = "none";
    }
</script>

</body>
</html>
