<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make a Deposit</title>
    <style>
        :root {
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --bg-gradient: linear-gradient(-45deg, #1f1c2c, #928dab, #0f2027, #203a43);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glow-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --primary-color: #00cec9;
            --primary-hover: #00b894;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f5f6fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Navigation Bar container */
        .top-nav-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .btn-home-nav {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: #dfe6e9;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-home-nav:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-color);
            color: white;
            box-shadow: 0 0 15px rgba(0, 206, 201, 0.2);
        }

        .deposit-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--glow-shadow);
            position: relative;
        }

        .pay-to {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff7675, #74b9ff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .notice-box {
            background: rgba(253, 203, 110, 0.1);
            border: 1px solid rgba(253, 203, 110, 0.25);
            color: #fbc531;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #b2bec3;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #dfe6e9;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 206, 201, 0.2);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(45deg, var(--primary-color), #00b894);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 206, 201, 0.3);
        }

        /* Success Screen Overlay */
        .success-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.98);
            border-radius: 24px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 206, 201, 0.1);
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .success-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 10px;
        }

        .success-desc {
            color: #b2bec3;
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="top-nav-container">
    <a href="index.html" class="btn-home-nav">← Back to Home</a>
</div>

<div class="deposit-container">
    <div class="success-screen" id="successScreen">
        <div class="success-icon">✓</div>
        <div class="success-title">Deposit Successful!</div>
        <div class="success-desc">Your transaction details were logged.<br>Please wait up to 24 hours for review.</div>
        <button class="btn-back" onclick="window.location.href='index.html'">Back to Home</button>
    </div>

    <div class="pay-to">PAY TO: yourupi@upi</div>
    
    <div class="notice-box">
        ⚠️ Processing times may take up to 24 Hours.
    </div>

    <form id="depositForm">
        <div class="form-title">Enter your deposit details:</div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Username" required>
        </div>

        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" placeholder="Enter deposit amount" min="1" required>
        </div>

        <div class="form-group">
            <label for="upi_id">UPI Transaction ID</label>
            <input type="text" id="upi_id" name="upi_id" placeholder="12-digit Ref No." pattern="[0-9]{12}" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Submit Deposit</button>
    </form>
</div>

<script>
    // Automatically retrieve the username logged in from Hub
    const storedUser = localStorage.getItem("currentUser") || "";
    if(storedUser) {
        document.getElementById('username').value = storedUser.replace("@game.local", "");
    }

    document.getElementById('depositForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Stop page reload immediately!

        const submitBtn = document.getElementById('submitBtn');
        const successScreen = document.getElementById('successScreen');
        const upiInput = document.getElementById('upi_id').value;

        if (upiInput.length !== 12 || isNaN(upiInput)) {
            alert('Please enter a valid 12-digit UPI Transaction ID.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "Processing Transaction...";

        const formData = new FormData(this);

        fetch("https://script.google.com/macros/s/AKfycbxdewVWmLbZ5Z6iVrnm01ARLX1z51eUVDunoz6tbkEqam2v2XKrD2SWIr-CSuF0HFRg/exec", {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if(data.result === 'success') {
                successScreen.style.display = 'flex'; // Reveals elegant success page window
                document.getElementById('depositForm').reset();
            } else {
                alert('Backend Error: ' + data.error);
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Deposit";
            }
        })
        .catch(error => {
            console.error('Error!', error);
            alert('Submission completely executed but server response timed out. Check your Google Sheet to see if it still added the data.');
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Deposit";
        });
    });
</script>

</body>
</html>
