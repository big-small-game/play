<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit Funds - Big Small Pro</title>
    <style>
        :root {
            --bg-main: #060b19;
            --bg-card: rgba(15, 23, 42, 0.6);
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        /* Top Navigation Bar configured to route back to game.html */
        .top-nav-container {
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
            z-index: 10;
        }

        .btn-game-nav {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            color: #dfe6e9;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-game-nav:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-blue);
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .deposit-container {
            width: 100%;
            max-width: 430px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 24px;
            box-shadow: var(--glow-shadow);
            z-index: 10;
        }

        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 14px;
        }

        .title-text {
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
        }

        .wallet-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            font-weight: 800;
            color: var(--accent-gold);
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
            height: 48px;
            align-items: center;
        }

        .input-container span {
            padding-left: 14px;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 12px;
            font-weight: 700;
            font-size: 1.1rem;
            outline: none;
        }

        /* Status Banner Box */
        .status-message {
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .status-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green); }
        .status-error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent-red); color: var(--accent-red); }

        .submit-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.15s ease;
        }

        .submit-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="top-nav-container">
    <a href="game.html" class="btn-game-nav">← Back to Game</a>
</div>

<div class="deposit-container">
    <div class="header-widget">
        <div class="title-text">Instant Deposit</div>
        <div class="wallet-display">🪙 <span id="currentBalance">0.00</span></div>
    </div>

    <div id="statusBox" class="status-message"></div>

    <div class="input-group">
        <div class="label">Amount to add</div>
        <div class="input-container">
            <span>🪙</span>
            <input type="number" id="depositValue" value="50" min="1" placeholder="Enter amount">
        </div>
    </div>

    <button class="submit-btn" id="submitDepositBtn" onclick="processManualDeposit()">Confirm Deposit</button>
</div>

<script>
    // MATCHING CENTRAL APPLICATION PATH ENDPOINT
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

    let balance = 0;

    // Pull identification parameters matching system environments
    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();

    // Pull live wallet data instantly upon page entry
    function fetchCurrentWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('currentBalance').innerText = balance.toFixed(2);
            }
        }).catch(err => console.error("Balance tracking fault:", err));
    }

    // RESOLUTION: Dynamic query parameters matching Web Endpoint transaction models
    function processManualDeposit() {
        const depositInput = document.getElementById("depositValue");
        const depositAmount = parseFloat(depositInput.value) || 0;
        const submitBtn = document.getElementById("submitDepositBtn");
        const statusBox = document.getElementById("statusBox");

        if (depositAmount <= 0) {
            showStatus("Please enter a valid deposit amount greater than 0.", "error");
            return;
        }

        // Lock interface buttons to avoid duplicate requests processing simultaneously
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing Tx...";
        statusBox.style.display = "none";

        // Dispatch POSITIVE currency value variations targeting pipeline handles
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&amount=${depositAmount}`)
        .then(response => response.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance);
                document.getElementById('currentBalance').innerText = balance.toFixed(2);
                
                showStatus(`Success! Added 🪙${depositAmount.toFixed(2)} to your balance.`, "success");
                depositInput.value = ""; // clear inputs
            } else {
                showStatus("Error: Server responded but wallet could not update.", "error");
            }
        })
        .catch(err => {
            console.error("Database connection failure:", err);
            showStatus("Database sync timed out. Try again shortly.", "error");
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Confirm Deposit";
        });
    }

    function showStatus(msg, type) {
        const statusBox = document.getElementById("statusBox");
        statusBox.innerText = msg;
        statusBox.className = `status-message status-${type}`;
        statusBox.style.display = "block";
    }

    // Launch validation sweeps directly on activation passes
    fetchCurrentWallet();
</script>

</body>
</html>
