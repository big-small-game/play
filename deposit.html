<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Deposit</title>
    <style>
        :root {
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --bg-gradient: linear-gradient(-45deg, #1f1c2c, #928dab, #0f2027, #203a43);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glow-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --primary-color: #00cec9;
            --primary-hover: #00b894;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f5f6fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .deposit-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--glow-shadow);
            position: relative;
            animation: containerEntry 0.5s ease-out;
        }

        @keyframes containerEntry {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pay-to {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff7675, #74b9ff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .notice-box {
            background: rgba(253, 203, 110, 0.1);
            border: 1px solid rgba(253, 203, 110, 0.25);
            color: #fbc531;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #b2bec3;
            text-align: left;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #dfe6e9;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: white;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 15px rgba(0, 206, 201, 0.2);
        }

        input::placeholder {
            color: #636e72;
        }

        /* Standardize input styles across devices */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(45deg, var(--primary-color), #00b894);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 206, 201, 0.3);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 206, 201, 0.5);
        }

        .btn-submit:disabled {
            background: linear-gradient(45deg, #57606f, #2f3542);
            color: #a4b0be;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Luxury Success Screen Overlay */
        .success-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.98);
            border-radius: 24px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 206, 201, 0.1);
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: var(--primary-color);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 206, 201, 0.3);
            animation: scaleUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes scaleUp {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .success-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 10px;
        }

        .success-desc {
            color: #b2bec3;
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

<div class="deposit-container">
    <div class="success-screen" id="successScreen">
        <div class="success-icon">✓</div>
        <div class="success-title">Deposit Successful!</div>
        <div class="success-desc">Your transaction request was received.<br>Please wait up to 24 hours for manual approval.</div>
        <button class="btn-back" onclick="window.location.href='index.html'">Back to Home</button>
    </div>

    <div class="pay-to">PAY TO: yourupi@upi</div>
    
    <div class="notice-box">
        ⚠️ Processing times may take up to 24 Hours.
    </div>

    <form id="depositForm">
        <div class="form-title">Enter your deposit details:</div>

        <div class="form-group">
            <label for="username">Username</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                placeholder="Enter your system username" 
                required
            >
        </div>

        <div class="form-group">
            <label for="amount">Amount</label>
            <input 
                type="number" 
                id="amount" 
                name="amount" 
                placeholder="Enter deposit amount" 
                min="1" 
                required
            >
        </div>

        <div class="form-group">
            <label for="upi_id">UPI Transaction ID</label>
            <input 
                type="text" 
                id="upi_id" 
                name="upi_id" 
                placeholder="Enter 12-digit UPI Ref No." 
                pattern="[0-9]{12}" 
                title="UPI Transaction ID must be exactly a 12-digit number"
                required
            >
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Submit Deposit</button>
    </form>
</div>

<script>
    // Autofill username from LocalStorage if logged in
    const storedUser = localStorage.getItem("currentUser") || "";
    if(storedUser) {
        document.getElementById('username').value = storedUser.replace("@game.local", "");
    }

    document.getElementById('depositForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const successScreen = document.getElementById('successScreen');
        const upiInput = document.getElementById('upi_id').value;

        // Validation fallback
        if (upiInput.length !== 12 || isNaN(upiInput)) {
            alert('Please enter a valid 12-digit UPI Transaction ID.');
            return;
        }

        // Processing state animation
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing
