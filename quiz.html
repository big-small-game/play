<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Quiz Arena</title>

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#ff6b6b,#6c5ce7,#00cec9);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
width:90%;
max-width:700px;
background:rgba(255,255,255,0.15);
padding:30px;
border-radius:20px;
backdrop-filter:blur(10px);
text-align:center;
}

h1{
margin-bottom:20px;
}

.question{
font-size:24px;
margin-bottom:20px;
}

.option{
display:block;
width:100%;
margin:10px 0;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:22px;
font-weight:bold;
}

.score{
margin-top:20px;
font-size:20px;
}

button{
cursor:pointer;
}

.next{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:10px;
font-size:16px;
}

.back{
background:white;
color:black;
margin-left:10px;
}

</style>

</head>
<body>

<div class="container">

<h1>📚 Quiz Arena</h1>

<div class="question" id="question">
Loading...
</div>

<button class="option" onclick="checkAnswer(0)" id="o0"></button> <button class="option" onclick="checkAnswer(1)" id="o1"></button> <button class="option" onclick="checkAnswer(2)" id="o2"></button> <button class="option" onclick="checkAnswer(3)" id="o3"></button>

<div class="result" id="result"></div>

<div class="score">

Score: <span id="score">0</span>

  |  

Question: <span id="qnum">1</span>

</div>

<button class="next" onclick="nextQuestion()">
Next Question
</button>

<button class="next back"
onclick="window.location.href='game.html'">
⬅ Back to Hub </button>

</div>

<script>

const quiz = [

{
q:"What is the capital of Japan?",
o:["Tokyo","Delhi","Paris","London"],
a:0
},

{
q:"Which planet is called the Red Planet?",
o:["Venus","Mars","Earth","Jupiter"],
a:1
},

{
q:"Who developed Python?",
o:[
"Guido van Rossum",
"Elon Musk",
"Bill Gates",
"Linus Torvalds"
],
a:0
},

{
q:"How many continents are there?",
o:["5","6","7","8"],
a:2
},

{
q:"Which is the largest ocean?",
o:[
"Indian",
"Atlantic",
"Arctic",
"Pacific"
],
a:3
},

{
q:"What is 12 × 8 ?",
o:["86","96","108","88"],
a:1
},

{
q:"Which gas do plants absorb?",
o:[
"Oxygen",
"Carbon Dioxide",
"Hydrogen",
"Nitrogen"
],
a:1
},

{
q:"Which language runs in browsers?",
o:[
"Java",
"Python",
"JavaScript",
"C++"
],
a:2
}

];

let current = 0;
let score = 0;

loadQuestion();

function loadQuestion(){

document.getElementById("question")
.innerHTML =
quiz[current].q;

for(let i=0;i<4;i++){

document.getElementById("o"+i)
.innerHTML =
quiz[current].o[i];

}

document.getElementById("qnum")
.innerHTML =
current + 1;

document.getElementById("result")
.innerHTML = "";

}

function checkAnswer(choice){

if(choice === quiz[current].a){

score++;

document.getElementById("result")
.innerHTML =
"✅ Correct";

}else{

document.getElementById("result")
.innerHTML =
"❌ Wrong";

}

document.getElementById("score")
.innerHTML =
score;

}

function nextQuestion(){

current++;

if(current >= quiz.length){

document.getElementById("question")
.innerHTML =
"🎉 Quiz Finished!";

document.getElementById("result")
.innerHTML =
"Final Score: "
+ score +
"/" +
quiz.length;

for(let i=0;i<4;i++){

document.getElementById("o"+i)
.style.display = "none";

}

return;

}

loadQuestion();

}

</script>

</body>
</html>
