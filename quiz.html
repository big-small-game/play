<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Quiz Arena</title>

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#ff6b6b,#6c5ce7,#00cec9);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
width:90%;
max-width:700px;
background:rgba(255,255,255,0.15);
padding:30px;
border-radius:20px;
backdrop-filter:blur(10px);
text-align:center;
}

h1{
margin-bottom:20px;
}

.question{
font-size:24px;
margin-bottom:20px;
}

.option{
display:block;
width:100%;
margin:10px 0;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:22px;
font-weight:bold;
}

.score{
margin-top:20px;
font-size:20px;
}

.next{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.back{
background:white;
color:black;
margin-left:10px;
}

.loading{
font-size:22px;
}

</style>

</head>
<body>

<div class="container">

<h1>📚 Quiz Arena</h1>

<div id="question" class="question">
Loading Questions...
</div>

<button class="option" onclick="checkAnswer(0)" id="o0"></button> <button class="option" onclick="checkAnswer(1)" id="o1"></button> <button class="option" onclick="checkAnswer(2)" id="o2"></button> <button class="option" onclick="checkAnswer(3)" id="o3"></button>

<div class="result" id="result"></div>

<div class="score">

Score: <span id="score">0</span>

  |  

Question: <span id="qnum">1</span>/10

</div>

<button class="next" onclick="nextQuestion()">
Next Question
</button>

<button class="next back"
onclick="window.location.href='game.html'">
⬅ Back to Hub </button>

</div>

<script>

let questions = [];
let current = 0;
let score = 0;
let answered = false;

async function loadQuizData(){

try{

const response = await fetch(
"https://opentdb.com/api.php?amount=10&type=multiple"
);

const data = await response.json();

questions = data.results;

showQuestion();

}
catch(error){

document.getElementById("question")
.innerHTML =
"Failed to load questions.";

console.log(error);

}

}

function decodeHTML(html){

const txt =
document.createElement("textarea");

txt.innerHTML = html;

return txt.value;

}

function showQuestion(){

answered = false;

document.getElementById("result")
.innerHTML = "";

const q = questions[current];

document.getElementById("question")
.innerHTML =
decodeHTML(q.question);

document.getElementById("qnum")
.innerHTML =
current + 1;

let options = [

q.correct_answer,
...q.incorrect_answers

];

options.sort(
() => Math.random() - 0.5
);

for(let i=0;i<4;i++){

let btn =
document.getElementById("o"+i);

btn.innerHTML =
decodeHTML(options[i]);

btn.dataset.correct =
(options[i] === q.correct_answer);

btn.style.background = "white";
btn.style.color = "black";

}

}

function checkAnswer(index){

if(answered) return;

answered = true;

let btn =
document.getElementById("o"+index);

if(btn.dataset.correct === "true"){

score++;

document.getElementById("result")
.innerHTML =
"✅ Correct";

btn.style.background =
"#00b894";

}
else{

document.getElementById("result")
.innerHTML =
"❌ Wrong";

btn.style.background =
"#d63031";

}

document.getElementById("score")
.innerHTML =
score;

}

function nextQuestion(){

if(current >= questions.length-1){

document.getElementById("question")
.innerHTML =
"🎉 Quiz Finished!";

document.getElementById("result")
.innerHTML =
"Final Score: "
+ score +
"/10";

for(let i=0;i<4;i++){

document.getElementById("o"+i)
.style.display = "none";

}

return;

}

current++;

showQuestion();

}

loadQuizData();

</script>

</body>
</html>
