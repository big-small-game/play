<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mines Sweeper Pro</title>
    <style>
        :root {
            --bg-main: #060b19;
            --bg-card: rgba(15, 23, 42, 0.6);
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        .game-container {
            width: 100%;
            max-width: 430px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px;
            box-shadow: var(--glow-shadow);
            z-index: 10;
        }

        /* Header Navigation Widget */
        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .wallet-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            font-weight: 800;
            color: var(--accent-gold);
        }

        /* 5x5 Mines Matrix Theatre Board Grid */
        .mines-board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: rgba(10, 15, 30, 0.6);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: 20px;
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        .tile-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.1s ease, background 0.15s ease;
        }

        .tile-btn:active:not(:disabled) {
            transform: scale(0.92);
        }

        /* Revealed Tile Visual Overrides states profiles */
        .tile-diamond {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(37, 99, 235, 0.25)) !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4) !important;
        }

        .tile-mine {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(153, 27, 27, 0.4)) !important;
            border-color: #f43f5e !important;
            animation: shakeTile 0.15s ease-in-out infinite;
        }

        @keyframes shakeTile {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-1px, 1px); }
        }

        /* Input Control Deck Console Panels */
        .control-deck {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(10, 15, 30, 0.4);
            padding: 12px;
            border-radius: 18px;
            border: 1px solid var(--border-glass);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .input-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
            height: 40px;
        }

        .input-container input, .input-container select {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 10px;
            font-weight: 700;
            font-size: 0.95rem;
            outline: none;
            color-scheme: dark;
        }

        .scale-btn {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: white;
            padding: 0 10px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border-left: 1px solid var(--border-glass);
        }

        .action-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            color: white;
            transition: all 0.15s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-cashout {
            background: linear-gradient(135deg, #10b981, #047857);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .action-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Header Navigation Section Bar Row -->
    <div class="header-widget">
        <div class="user-tag">👤 <span id="userName">Guest</span></div>
        <div class="wallet-display">🪙 <span id="userBalance">Loading...</span></div>
    </div>

    <!-- 5x5 Mines Sweep Array Space Board Grid Deck Matrix Container -->
    <div class="mines-board-grid" id="minesGridMatrix"></div>

    <!-- Operational Controls Configuration Workspace Deck Deck -->
    <div class="control-deck">
        <div class="input-row">
            <div>
                <div class="label">Bet Amount</div>
                <div class="input-container">
                    <input type="number" id="betValue" value="10" min="1">
                    <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                    <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
                </div>
            </div>
            <div>
                <div class="label">Mines Count</div>
                <div class="input-container">
                    <select id="minesCountSelector">
                        <option value="1">1 Mine</option>
                        <option value="3" selected>3 Mines</option>
                        <option value="5">5 Mines</option>
                        <option value="10">10 Mines</option>
                        <option value="15">15 Mines</option>
                        <option value="20">20 Mines</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="action-btn btn-start" id="mainActionBtn" onclick="toggleMinesEngineLoopState()" disabled>Syncing Wallet...</button>
    </div>
</div>

<script>
    // CENTRAL BACKEND SPREADSHEETS ARCHITECTURES API HOOK
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

    let balance = 0;
    let betAmount = 0;
    let minesQuantity = 3;
    let gameActive = false;

    let boardTilesArray = Array(25).fill(false); // Stores true for mines positions
    let openedTilesCount = 0;
    let currentPayoutMultiplier = 1.00;

    // Filter dynamic clean local user identification details handles
    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();
    document.getElementById("userName").innerText = cleanUser;

    // Setup initial matrix tiles layouts nodes fields
    const gridContainer = document.getElementById("minesGridMatrix");
    for (let i = 0; i < 25; i++) {
        const btn = document.createElement("button");
        btn.className = "tile-btn";
        btn.dataset.index = i;
        btn.disabled = true;
        btn.addEventListener("click", () => handleTileClickReveal(i));
        gridContainer.appendChild(btn);
    }

    // 1. LIVE REFRESH SYNC FROM SHEET DATA DIRECT
    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                
                if (!gameActive) {
                    const actionBtn = document.getElementById("mainActionBtn");
                    actionBtn.disabled = false;
                    actionBtn.innerText = "Bet & Start Game";
                    actionBtn.className = "action-btn btn-start";
                }
            }
        }).catch(err => {
            console.error("Database endpoint connection link loss dropped:", err);
            document.getElementById('userBalance').innerText = "Offline";
        });
    }

    // 2. BACKEND TRANSACTION DISPATCH PIPE PACKET
    function syncTxToDatabase(amountChange, updateScreenUI = true) {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&amount=${amountChange}`)
        .then(r => r.json())
        .then(data => {
            if (updateScreenUI && data && data.balance !== undefined) {
                balance = parseFloat(data.balance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
        }).catch(e => console.error("Database transaction logs dropped out:", e));
    }

    function adjustStakeScale(type) {
        if (gameActive) return;
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function toggleMinesEngineLoopState() {
        const actionBtn = document.getElementById("mainActionBtn");

        if (!gameActive) {
            // Place Bet and Initialise Board Game State
            const betInput = document.getElementById("betValue");
            const desiredBet = parseInt(betInput.value) || 0;
            minesQuantity = parseInt(document.getElementById("minesCountSelector").value);

            if (desiredBet < 1 || desiredBet > balance) {
                alert("Stake bounds error! Balance metrics mismatched.");
                return;
            }

            // BALANCE BUG RESOLUTION: Subtract local variable values and display layout views instantly
            betAmount = desiredBet;
            balance -= betAmount;
            document.getElementById('userBalance').innerText = balance.toFixed(2);

            // Transmit background write command to server spreadsheet structure quietly
            syncTxToDatabase(-betAmount, false);

            // Initialize game state rules components variables parameters metrics 
            gameActive = true;
            openedTilesCount = 0;
            currentPayoutMultiplier = 1.00;
            generateRandomHiddenMinesPlacement();

            // Toggle operating system control deck inputs components fields 
            betInput.disabled = true;
            document.getElementById("minesCountSelector").disabled = true;

            actionBtn.innerText = "Choose a tile...";
            actionBtn.disabled = true;
            actionBtn.className = "action-btn btn-cashout";

            // Un-freeze target display matrix nodes elements interaction states 
            const tiles = gridContainer.children;
            for (let i = 0; i < tiles.length; i++) {
                tiles[i].className = "tile-btn";
                tiles[i].innerText = "";
                tiles[i].disabled = false;
            }
        } else {
            // Cash Out Event Triggered by manual click selection action
            executeCashoutSequence();
        }
    }

    function generateRandomHiddenMinesPlacement() {
        boardTilesArray.fill(false);
        let minesSet = 0;
        while (minesSet < minesQuantity) {
            let randomIndex = Math.floor(Math.random() * 25);
            if (!boardTilesArray[randomIndex]) {
                boardTilesArray[randomIndex] = true;
                minesSet++;
            }
        }
    }

    // Mathematical combination formula parameters calculators computing dynamic casino odds returns parameters mapping inline models
    function calculateNextMinesMultiplier() {
        let currentCombinations = combinations(25, openedTilesCount);
        let nextCombinations = combinations(25 - minesQuantity, openedTilesCount);
        
        // Dynamic edge house loading fee algorithm matrix profiles multiplier mapping sets calculations
        let absoluteRawOdds = currentCombinations / nextCombinations;
        let finalScaleMultiplier = absoluteRawOdds * 0.97; // Apply standard 3% house edge factor
        return Math.max(1.01, parseFloat(finalScaleMultiplier.toFixed(2)));
    }

    // Helper combinations logic function
    function combinations(n, k) {
        if (k === 0) return 1;
        let res = 1;
        for (let i = 1; i <= k; i++) {
            res = res * (n - k + i) / i;
        }
        return res;
    }

    function handleTileClickReveal(index) {
        if (!gameActive) return;
        const targetTile = gridContainer.children[index];
        targetTile.disabled = true; // prevent repeated click calls cycles handling

        const landedOnAMine = boardTilesArray[index];

        if (landedOnAMine) {
            // HIT MINE: Instant sequence explosion failure loop
            triggerExplosionLossSequence(index);
        } else {
            // HIT GEM: Safe choice progression trace path
            openedTilesCount++;
            targetTile.className = "tile-btn tile-diamond";
            targetTile.innerText = "💎";

            currentPayoutMultiplier = calculateNextMinesMultiplier();
            const prospectiveCashoutTotal = betAmount * currentPayoutMultiplier;

            // Update interactive action button matrix structures trackers
            const actionBtn = document.getElementById("mainActionBtn");
            actionBtn.disabled = false;
            actionBtn.innerText = `Cash Out 🪙${prospectiveCashoutTotal.toFixed(2)} (x${currentPayoutMultiplier.toFixed(2)})`;

            // Max Win Scenario: Check if all gems have been swept perfectly
            if (openedTilesCount === (25 - minesQuantity)) {
                executeCashoutSequence();
            }
        }
    }

    function executeCashoutSequence() {
        if (!gameActive) return;
        gameActive = false; // Freeze status mechanics immediately to completely eliminate overlapping latency hazards

        const totalWinningsReturn = betAmount * currentPayoutMultiplier;
        balance += totalWinningsReturn;
        document.getElementById('userBalance').innerText = balance.toFixed(2);

        // WIN SEQUENCE: Dispatch transaction update directly to server sheet architecture safely
        syncTxToDatabase(totalWinningsReturn, true);

        revealEntireBoardState(true);

        const actionBtn = document.getElementById("mainActionBtn");
        actionBtn.disabled = true;
        actionBtn.innerText = `CASHED OUT! +🪙${totalWinningsReturn.toFixed(2)}`;

        resetGameArenaEnvironmentDelayed();
    }

    function triggerExplosionLossSequence(explodedIndex) {
        gameActive = false;
        
        revealEntireBoardState(false);
        
        // Highlight specific execution failure node point
        gridContainer.children[explodedIndex].innerText = "💥";

        const actionBtn = document.getElementById("mainActionBtn");
        actionBtn.disabled = true;
        actionBtn.innerText = "BOOM! GAME OVER";

        // LOSS SEQUENCE: No network check update is triggered here. Visually drops values permanently safely.
        resetGameArenaEnvironmentDelayed();
    }

    function revealEntireBoardState(userWon) {
        const tiles = gridContainer.children;
        for (let i = 0; i < tiles.length; i++) {
            tiles[i].disabled = true;
            if (boardTilesArray[i]) {
                tiles[i].className = "tile-btn tile-mine";
                tiles[i].innerText = "💣";
            } else {
                if (!tiles[i].classList.contains("tile-diamond")) {
                    tiles[i].innerText = "💎";
                    tiles[i].style.opacity = "0.3"; // fade unselected safe gems visually
                }
            }
        }
    }

    function resetGameArenaEnvironmentDelayed() {
        setTimeout(() => {
            document.getElementById("betValue").disabled = false;
            document.getElementById("minesCountSelector").disabled = false;
            
            const actionBtn = document.getElementById("mainActionBtn");
            actionBtn.innerText = "Bet & Start Game";
            actionBtn.className = "action-btn btn-start";
            actionBtn.disabled = false;

            // Soft reset display fields textures values paths
            const tiles = gridContainer.children;
            for (let i = 0; i < tiles.length; i++) {
                tiles[i].className = "tile-btn";
                tiles[i].innerText = "";
                tiles[i].style.opacity = "1";
                tiles[i].disabled = true;
            }
        }, 4000);
    }

    // Direct immediate launch sequences initialization passes
    fetchLiveWallet();
</script>

</body>
</html>
