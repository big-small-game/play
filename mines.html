<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mines Pro | Stake Edition</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #0b0f19;
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #00e676;
            --accent-red: #ff3333;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.05);
            --tile-unopened: #2f455e;
            --tile-unopened-hover: #3c5674;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .game-wrapper {
            width: 100%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        /* Left Side: Stake Control Panel */
        .sidebar-controls {
            width: 320px;
            background: var(--bg-sidebar);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border-glass);
        }

        /* Right Side: Game Grid Arena */
        .grid-theater {
            flex: 1;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        /* Header Navigation Info */
        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 16px;
            max-width: 900px;
            padding: 0 8px;
        }

        .user-tag {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .wallet-display {
            background: var(--bg-sidebar);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            font-weight: 800;
            color: var(--accent-gold);
        }

        /* 5x5 Matrix Layout Grid */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1 / 1;
        }

        .tile-btn {
            background: var(--tile-unopened);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #1b2a3a;
            transition: all 0.1s ease;
        }

        .tile-btn:hover:not(:disabled) {
            background: var(--tile-unopened-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1b2a3a;
        }

        .tile-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1b2a3a;
        }

        /* Revealed Tile Override Profiles */
        .tile-gem {
            background: #071824 !important;
            border: 2px solid var(--accent-green) !important;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.2) !important;
            transform: none !important;
        }

        .tile-mine {
            background: #1e1015 !important;
            border: 2px solid var(--accent-red) !important;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.2) !important;
            transform: none !important;
        }

        /* Input Controls */
        .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-container {
            display: flex;
            background: var(--bg-main);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            height: 44px;
        }

        .input-container input, .input-container select {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 14px;
            font-weight: 700;
            font-size: 0.95rem;
            outline: none;
        }

        .scale-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-light);
            padding: 0 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-left: 1px solid rgba(255,255,255,0.1);
            transition: background 0.2s;
        }

        .scale-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: all 0.15s ease;
        }

        .btn-bet {
            background: var(--primary-blue);
            box-shadow: 0 4px 0 #1d4ed8;
        }
        .btn-bet:hover:not(:disabled) { background: #2563eb; }

        .btn-cashout {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 4px 0 #00b359;
            font-weight: 800;
        }
        .btn-cashout:hover:not(:disabled) { background: #33ff99; }

        .action-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none !important;
        }

        .action-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        /* Responsive Breakpoint for Mobile Interfaces */
        @media (max-width: 768px) {
            .game-wrapper {
                flex-direction: column-reverse;
            }
            .sidebar-controls {
                width: 100%;
                border-right: none;
                border-top: 1px solid var(--border-glass);
            }
            .grid-theater {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<!-- Top Navigation Data Hub Widget -->
<div class="header-widget">
    <div class="user-tag">👤 User: <span id="userName">Guest</span></div>
    <div class="wallet-display">🪙 <span id="userBalance">0.00</span></div>
</div>

<div class="game-wrapper">
    <!-- Left Hand Stake Console Command Deck Menu -->
    <div class="sidebar-controls">
        <div>
            <div class="label">Bet Amount</div>
            <div class="input-container">
                <input type="number" id="betValue" value="10" min="1">
                <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
            </div>
        </div>

        <div>
            <div class="label">Mines</div>
            <div class="input-container">
                <select id="minesCountSelector">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="24">24</option>
                </select>
            </div>
        </div>

        <button class="action-btn btn-bet" id="mainActionBtn" onclick="toggleMinesEngineLoopState()" disabled>Syncing Balance...</button>
    </div>

    <!-- Right Hand Interactive Graphic Grid Arena Arena -->
    <div class="grid-theater">
        <div class="mines-grid" id="minesGridMatrix"></div>
    </div>
</div>

<script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

    let balance = 0;
    let betAmount = 0;
    let minesQuantity = 3;
    let gameActive = false;

    let boardTilesArray = Array(25).fill(false);
    let openedTilesCount = 0;
    let currentPayoutMultiplier = 1.00;

    // Native Browser Sound Effects Synthesizer Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSyntheticSound(frequency, type, duration, slideTo = 0) {
        try {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            if (slideTo > 0) {
                osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
            }
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) { console.log("Audio not allowed yet"); }
    }

    // Clean user account profile configuration tags handles
    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();
    document.getElementById("userName").innerText = cleanUser;

    // Render Matrix Layout Elements
    const gridContainer = document.getElementById("minesGridMatrix");
    for (let i = 0; i < 25; i++) {
        const btn = document.createElement("button");
        btn.className = "tile-btn";
        btn.dataset.index = i;
        btn.disabled = true;
        btn.addEventListener("click", () => handleTileClickReveal(i));
        gridContainer.appendChild(btn);
    }

    // 1. Fetch live profile sync database values
    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                
                if (!gameActive) {
                    const actionBtn = document.getElementById("mainActionBtn");
                    actionBtn.disabled = false;
                    actionBtn.innerText = "Bet";
                    actionBtn.className = "action-btn btn-bet";
                }
            }
        }).catch(err => {
            document.getElementById('userBalance').innerText = "Offline";
        });
    }

    // 2. Transmit ledger logs change events background pipeline parameters
    function syncTxToDatabase(amountChange, updateScreenUI = true) {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&amount=${amountChange}`)
        .then(r => r.json())
        .then(data => {
            if (updateScreenUI && data && data.balance !== undefined) {
                balance = parseFloat(data.balance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
        });
    }

    function adjustStakeScale(type) {
        if (gameActive) return;
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function toggleMinesEngineLoopState() {
        const actionBtn = document.getElementById("mainActionBtn");

        if (!gameActive) {
            const betInput = document.getElementById("betValue");
            const desiredBet = parseInt(betInput.value) || 0;
            minesQuantity = parseInt(document.getElementById("minesCountSelector").value);

            if (desiredBet < 1 || desiredBet > balance) {
                alert("Mismatched allocation balance bounds details!");
                return;
            }

            // INSTANT DEDUCTION PARADIGM LAYER
            betAmount = desiredBet;
            balance -= betAmount;
            document.getElementById('userBalance').innerText = balance.toFixed(2);
            syncTxToDatabase(-betAmount, false);

            gameActive = true;
            openedTilesCount = 0;
            currentPayoutMultiplier = 1.00;
            generateRandomHiddenMinesPlacement();

            betInput.disabled = true;
            document.getElementById("minesCountSelector").disabled = true;

            actionBtn.innerText = "Cash Out";
            actionBtn.className = "action-btn btn-cashout";
            actionBtn.disabled = true;

            playSyntheticSound(587.33, 'triangle', 0.15); // Start game chime

            const tiles = gridContainer.children;
            for (let i = 0; i < tiles.length; i++) {
                tiles[i].className = "tile-btn";
                tiles[i].innerText = "";
                tiles[i].disabled = false;
            }
        } else {
            executeCashoutSequence();
        }
    }

    function generateRandomHiddenMinesPlacement() {
        boardTilesArray.fill(false);
        let minesSet = 0;
        while (minesSet < minesQuantity) {
            let randomIndex = Math.floor(Math.random() * 25);
            if (!boardTilesArray[randomIndex]) {
                boardTilesArray[randomIndex] = true;
                minesSet++;
            }
        }
    }

    function calculateNextMinesMultiplier() {
        let currentCombinations = combinations(25, openedTilesCount);
        let nextCombinations = combinations(25 - minesQuantity, openedTilesCount);
        let absoluteRawOdds = currentCombinations / nextCombinations;
        return Math.max(1.01, parseFloat((absoluteRawOdds * 0.99).toFixed(2))); // 1% House Edge
    }

    function combinations(n, k) {
        if (k === 0) return 1;
        let res = 1;
        for (let i = 1; i <= k; i++) res = res * (n - k + i) / i;
        return res;
    }

    function handleTileClickReveal(index) {
        if (!gameActive) return;
        const targetTile = gridContainer.children[index];
        targetTile.disabled = true;

        if (boardTilesArray[index]) {
            triggerExplosionLossSequence(index);
        } else {
            openedTilesCount++;
            targetTile.className = "tile-btn tile-gem";
            targetTile.innerText = "💎";

            // Synthesize crisp ascending note scale sweep for gem discover alerts
            playSyntheticSound(440 + (openedTilesCount * 60), 'sine', 0.12, 600 + (openedTilesCount * 60));

            currentPayoutMultiplier = calculateNextMinesMultiplier();
            const prospectiveCashoutTotal = betAmount * currentPayoutMultiplier;

            const actionBtn = document.getElementById("mainActionBtn");
            actionBtn.disabled = false;
            actionBtn.innerText = `Cash Out (${prospectiveCashoutTotal.toFixed(2)})`;

            if (openedTilesCount === (25 - minesQuantity)) {
                executeCashoutSequence();
            }
        }
    }

    function executeCashoutSequence() {
        if (!gameActive) return;
        gameActive = false;

        const totalWinningsReturn = betAmount * currentPayoutMultiplier;
        balance += totalWinningsReturn;
        document.getElementById('userBalance').innerText = balance.toFixed(2);
        syncTxToDatabase(totalWinningsReturn, true);

        // Success cash-out arpeggio wave sound cascade
        playSyntheticSound(523.25, 'sine', 0.1);
        setTimeout(() => playSyntheticSound(659.25, 'sine', 0.1), 80);
        setTimeout(() => playSyntheticSound(783.99, 'sine', 0.2, 1200), 160);

        revealEntireBoardState();

        const actionBtn = document.getElementById("mainActionBtn");
        actionBtn.disabled = true;
        actionBtn.innerText = `+🪙${totalWinningsReturn.toFixed(2)}`;

        resetGameArenaEnvironmentDelayed();
    }

    function triggerExplosionLossSequence(explodedIndex) {
        gameActive = false;
        revealEntireBoardState();
        
        gridContainer.children[explodedIndex].innerText = "💥";
        playSyntheticSound(120, 'sawtooth', 0.4, 30); // Bass explosion sound crash

        const actionBtn = document.getElementById("mainActionBtn");
        actionBtn.disabled = true;
        actionBtn.innerText = "Mined! Game Over";

        resetGameArenaEnvironmentDelayed();
    }

    function revealEntireBoardState() {
        const tiles = gridContainer.children;
        for (let i = 0; i < tiles.length; i++) {
            tiles[i].disabled = true;
            if (boardTilesArray[i]) {
                if(tiles[i].innerText !== "💥") {
                    tiles[i].className = "tile-btn tile-mine";
                    tiles[i].innerText = "💣";
                }
            } else {
                if (!tiles[i].classList.contains("tile-gem")) {
                    tiles[i].innerText = "💎";
                    tiles[i].style.opacity = "0.2";
                }
            }
        }
    }

    function resetGameArenaEnvironmentDelayed() {
        setTimeout(() => {
            document.getElementById("betValue").disabled = false;
            document.getElementById("minesCountSelector").disabled = false;
            
            const actionBtn = document.getElementById("mainActionBtn");
            actionBtn.innerText = "Bet";
            actionBtn.className = "action-btn btn-bet";
            actionBtn.disabled = false;

            const tiles = gridContainer.children;
            for (let i = 0; i < tiles.length; i++) {
                tiles[i].className = "tile-btn";
                tiles[i].innerText = "";
                tiles[i].style.opacity = "1";
                tiles[i].disabled = true;
            }
        }, 3500);
    }

    fetchLiveWallet();
</script>

</body>
</html>
