<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Pro | Stake Edition</title>
    <!-- Premium Cyber/Casino Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #060b19;
            --bg-sidebar: #0f172a;
            --bg-card: #020617;
            --primary-blue: #2563eb;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.06);
            --font-fancy: 'Orbitron', system-ui, sans-serif;
            --font-sub: 'Rajdhani', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: var(--font-sub);
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            letter-spacing: 0.5px;
        }

        /* Top-Left Back Button Platform */
        .back-nav-container {
            width: 100%;
            max-width: 940px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .btn-back {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-glass);
            color: var(--text-light);
            font-family: var(--font-fancy);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .btn-back:hover {
            background: var(--accent-red);
            border-color: transparent;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .game-wrapper {
            width: 100%;
            max-width: 940px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        /* Left Side Controls Panel Console */
        .sidebar-controls {
            width: 340px;
            background: var(--bg-sidebar);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border-glass);
        }

        /* Right Side Flight Simulation Theater */
        .grid-theater {
            flex: 1;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: relative;
            min-height: 400px;
        }

        /* Header Statistics Display widget */
        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 14px;
            max-width: 940px;
            padding: 0 4px;
        }

        .user-tag {
            font-family: var(--font-fancy);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .wallet-display {
            font-family: var(--font-fancy);
            background: var(--bg-sidebar);
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            font-weight: 800;
            color: var(--accent-gold);
        }

        /* Graphic Canvas Component Layer Styles */
        .canvas-container {
            width: 100%;
            flex: 1;
            background: #040814;
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Flying Multiplier Large Typography overlay tracking values */
        .live-multiplier-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-fancy);
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }

        .flew-away-text {
            color: var(--accent-red) !important;
            font-size: 2.8rem;
        }

        /* Inputs Console styling architectures */
        .label {
            font-family: var(--font-fancy);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .input-container {
            display: flex;
            background: var(--bg-main);
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
            height: 44px;
            align-items: center;
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 14px;
            font-family: var(--font-fancy);
            font-weight: 600;
            font-size: 0.95rem;
            outline: none;
        }

        /* Auto Switch Module Styles */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.15);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-red); }
        input:checked + .slider:before { transform: translateX(22px); }

        .scale-btn {
            background: rgba(255, 255, 255, 0.03);
            border: none;
            color: var(--text-light);
            padding: 0 14px;
            font-family: var(--font-fancy);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border-left: 1px solid var(--border-glass);
            height: 100%;
        }

        .scale-btn:hover { background: rgba(255, 255, 255, 0.08); }

        .action-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 8px;
            font-family: var(--font-fancy);
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            color: white;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-bet {
            background: var(--accent-green);
            color: #020617;
            box-shadow: 0 4px 0 #047857;
        }
        .btn-bet:hover:not(:disabled) { background: #34d399; }

        .btn-cashout {
            background: var(--accent-gold);
            color: #020617;
            box-shadow: 0 4px 0 #d97706;
        }
        .btn-cashout:hover:not(:disabled) { background: #fbbf24; }

        .action-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none !important;
        }

        .action-btn:disabled {
            background: #1e293b !important;
            color: #475569 !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        /* Mobile Breakpoint Optimization */
        @media (max-width: 768px) {
            .game-wrapper { flex-direction: column-reverse; }
            .sidebar-controls { width: 100%; border-right: none; border-top: 1px solid var(--border-glass); }
            .grid-theater { padding: 12px; min-height: 300px; }
        }
    </style>
</head>
<body>

<!-- Dynamic Navigation Redirect Bar -->
<div class="back-nav-container">
    <a href="game.html" class="btn-back">← BACK TO GAMES</a>
</div>

<!-- Game Data Metrics Widget Header -->
<div class="header-widget">
    <div class="user-tag">👤 ID: <span id="userName">Guest</span></div>
    <div class="wallet-display">🪙 <span id="userBalance">0.00</span></div>
</div>

<div class="game-wrapper">
    <!-- Action Control Deck Left Sidebar Panel -->
    <div class="sidebar-controls">
        <div>
            <div class="label">Bet Amount</div>
            <div class="input-container">
                <input type="number" id="betValue" value="10" min="1">
                <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
            </div>
        </div>

        <!-- Auto Cashout Toggle Module Grid -->
        <div>
            <div class="toggle-row">
                <span class="label" style="margin:0;">Auto Cashout</span>
                <label class="switch">
                    <input type="checkbox" id="autoCashoutToggle" onchange="toggleAutoInputVisibility()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div id="autoCashoutInputContainer" style="display: none;">
            <div class="label">Cashout Multiplier Target</div>
            <div class="input-container">
                <input type="number" id="autoCashoutTarget" value="2.00" step="0.1" min="1.01">
            </div>
        </div>

        <button class="action-btn btn-bet" id="mainActionBtn" onclick="toggleAviatorEngineState()" disabled>Syncing Balance...</button>
    </div>

    <!-- Active Visual Plane Flight Simulation Arena -->
    <div class="grid-theater">
        <div class="canvas-container">
            <div class="live-multiplier-overlay" id="multiplierDisplay">1.00x</div>
            <canvas id="flightCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

    let balance = 0;
    let betAmount = 0;
    let gameActive = false;
    let hasCashedOut = false;

    let currentMultiplier = 1.00;
    let crashPoint = 0;
    let flightStartTime = 0;
    let animationFrameId = null;

    // Canvas Render Objects
    const canvas = document.getElementById("flightCanvas");
    const ctx = canvas.getContext("2d");

    // Sound FX Framework Sythesizers 
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSyntheticSound(frequency, type, duration, slideTo = 0) {
        try {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            if (slideTo > 0) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    // Process user session credentials profiles
    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();
    document.getElementById("userName").innerText = cleanUser;

    function resizeSimulationCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        drawFlightEnvironment(0, 0, false);
    }
    window.addEventListener('resize', resizeSimulationCanvas);

    function toggleAutoInputVisibility() {
        const checked = document.getElementById("autoCashoutToggle").checked;
        document.getElementById("autoCashoutInputContainer").style.display = checked ? "block" : "none";
    }

    // 1. Core Profile Balance Fetch Sync Direct Link
    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                
                if (!gameActive) {
                    const actionBtn = document.getElementById("mainActionBtn");
                    actionBtn.disabled = false;
                    actionBtn.innerText = "Fly Bet";
                    actionBtn.className = "action-btn btn-bet";
                }
            }
        });
    }

    // 2. Transaction Dispatch Ledger Background Engine Links 
    function syncTxToDatabase(amountChange, updateScreenUI = true) {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&amount=${amountChange}`)
        .then(r => r.json())
        .then(data => {
            if (updateScreenUI && data && data.balance !== undefined) {
                balance = parseFloat(data.balance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
        });
    }

    function adjustStakeScale(type) {
        if (gameActive) return;
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function toggleAviatorEngineState() {
        if (!gameActive) {
            const betInput = document.getElementById("betValue");
            const desiredBet = parseInt(betInput.value) || 0;

            if (desiredBet < 1 || desiredBet > balance) {
                alert("Stake bounds matching balance allocation bounds error!");
                return;
            }

            // INSTANT DEDUCTION PARADIGM
            betAmount = desiredBet;
            balance -= betAmount;
            document.getElementById('userBalance').innerText = balance.toFixed(2);
            syncTxToDatabase(-betAmount, false);

            // House math algorithms calculating flight limits profiles
            const rand = Math.random();
            if (rand < 0.08) {
                crashPoint = 1.00; // Instant house crash event parameters
            } else {
                crashPoint = parseFloat((1.01 + (Math.random() * 8) + (Math.random() * Math.random() * 20)).toFixed(2));
            }

            gameActive = true;
            hasCashedOut = false;
            currentMultiplier = 1.00;
            flightStartTime = performance.now();

            betInput.disabled = true;
            document.getElementById("autoCashoutToggle").disabled = true;
            document.getElementById("autoCashoutTarget").disabled = true;

            const actionBtn = document.getElementById("mainActionBtn");
            actionBtn.innerText = "Cash Out";
            actionBtn.className = "action-btn btn-cashout";

            playSyntheticSound(300, 'sine', 0.2, 500);
            executeFlightSimulationLoop();
        } else {
            executeCashoutSequence();
        }
    }

    function executeFlightSimulationLoop() {
        if (!gameActive) return;

        const timeElapsed = (performance.now() - flightStartTime) / 1000;
        // Accurate parabolic scale speed multiplier logic curves
        currentMultiplier = parseFloat((1.00 + Math.pow(timeElapsed, 1.45) * 0.15).toFixed(2));

        const multText = document.getElementById("multiplierDisplay");

        // Real-time automatic cash out threshold checker pass
        const autoActive = document.getElementById("autoCashoutToggle").checked;
        const autoTarget = parseFloat(document.getElementById("autoCashoutTarget").value) || 2.00;

        if (autoActive && !hasCashedOut && currentMultiplier >= autoTarget && currentMultiplier < crashPoint) {
            currentMultiplier = autoTarget; // Bind execution perfectly right at targeted threshold
            executeCashoutSequence();
        }

        if (currentMultiplier >= crashPoint) {
            triggerCrashSequence();
            return;
        }

        multText.innerText = `${currentMultiplier.toFixed(2)}x`;

        // Map flight coordinates profiles to drawing parameters boundaries
        const progressPercent = Math.min(1, timeElapsed / 10);
        const planeX = 60 + (canvas.width - 140) * progressPercent;
        const planeY = (canvas.height - 60) - (canvas.height - 140) * Math.sin(progressPercent * Math.PI / 2);

        drawFlightEnvironment(planeX, planeY, true);
        animationFrameId = requestAnimationFrame(executeFlightSimulationLoop);
    }

    function drawFlightEnvironment(planeX, planeY, renderTrail) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw background layout reference graph grids
        ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
        ctx.lineWidth = 1;
        const step = 40;
        for (let x = 0; x < canvas.width; x += step) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += step) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        if (!renderTrail) return;

        // Draw parabolic flight path vector line stream
        ctx.beginPath();
        ctx.strokeStyle = "var(--accent-red)";
        ctx.lineWidth = 4;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "rgba(239, 68, 68, 0.5)";
        ctx.moveTo(60, canvas.height - 60);
        ctx.quadraticCurveTo(canvas.width * 0.4, canvas.height - 60, planeX, planeY);
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset canvas effects shadows definitions

        // Render dynamic vectorized Stake styled red prop plane engine
        ctx.save();
        ctx.translate(planeX, planeY);
        ctx.rotate(-Math.PI / 12); // Steady aerodynamic angle ascent trajectory profiles
        
        // Plane fuselage structural core architecture profiles
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 6, 0, 0, 2 * Math.PI);
        ctx.fill();

        // Wings architecture
        ctx.fillStyle = "#b91c1c";
        ctx.fillRect(-4, -14, 6, 28);

        // Tail stabilizer profile layout parameters
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.moveTo(-14, 0);
        ctx.lineTo(-20, -8);
        ctx.lineTo(-18, 0);
        ctx.lineTo(-20, 8);
        ctx.closePath();
        ctx.fill();

        // Propeller hub tracking nodes
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(16, 0, 3, 0, 2 * Math.PI);
        ctx.fill();

        ctx.restore();
    }

    function executeCashoutSequence() {
        if (!gameActive || hasCashedOut) return;
        hasCashedOut = true;

        const totalFlightPayout = betAmount * currentMultiplier;
        balance += totalFlightPayout;
        document.getElementById('userBalance').innerText = balance.toFixed(2);
        syncTxToDatabase(totalFlightPayout, true);

        playSyntheticSound(600, 'sine', 0.15);
        setTimeout(() => playSyntheticSound(800, 'sine', 0.2), 100);

        const actionBtn = document.getElementById("mainActionBtn");
        actionBtn.disabled = true;
        actionBtn.innerText = `+🪙${totalFlightPayout.toFixed(2)}`;
    }

    function triggerCrashSequence() {
        gameActive = false;
        cancelAnimationFrame(animationFrameId);

        playSyntheticSound(130, 'sawtooth', 0.4);

        const multText = document.getElementById("multiplierDisplay");
        multText.innerHTML = `${currentMultiplier.toFixed(2)}x<br><span class="flew-away-text">FLEW AWAY</span>`;

        const actionBtn = document.getElementById("mainActionBtn");
        actionBtn.disabled = true;
        actionBtn.innerText = "Flew Away!";

        resetFlightArenaDelayed();
    }

    function resetFlightArenaDelayed() {
        setTimeout(() => {
            document.getElementById("betValue").disabled = false;
            document.getElementById("autoCashoutToggle").disabled = false;
            toggleAutoInputVisibility(); // Evaluates toggle locking states layout boundaries values accurately

            const actionBtn = document.getElementById("mainActionBtn");
            actionBtn.innerText = "Fly Bet";
            actionBtn.className = "action-btn btn-bet";
            actionBtn.disabled = false;

            document.getElementById("multiplierDisplay").innerText = "1.00x";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawFlightEnvironment(0, 0, false);
        }, 3800);
    }

    // Initialize execution sequences hooks layout instances
    setTimeout(resizeSimulationCanvas, 150);
    fetchLiveWallet();
</script>

</body>
</html>
