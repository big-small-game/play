<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crash Aviator Pro</title>
    <style>
        :root {
            --bg-main: #060b19;
            --bg-card: rgba(15, 23, 42, 0.6);
            --primary-blue: #3b82f6;
            --primary-hover: #2563eb;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background */
        .bg-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .game-container {
            width: 100%;
            max-width: 430px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px;
            box-shadow: var(--glow-shadow);
            z-index: 10;
        }

        /* Top Header Navigation Widget */
        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2px;
        }

        .user-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .wallet-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            font-weight: 800;
            color: var(--accent-gold);
        }

        /* Crash Live Multiplier Display Arena */
        .flight-theater {
            background: rgba(10, 15, 30, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            height: 220px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #graphCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .multiplier-counter {
            font-size: 3.2rem;
            font-weight: 900;
            z-index: 5;
            letter-spacing: -1px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
            transition: color 0.2s ease;
        }
        .status-flee { color: var(--accent-red); animation: shake 0.15s ease-in-out infinite; }
        .status-fly { color: white; }
        .status-win { color: var(--accent-green); }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2px, 2px); }
        }

        /* Past Flight Multiplier Logs Strips */
        .history-ribbon {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 4px;
        }
        .history-ribbon::-webkit-scrollbar { display: none; }
        
        .history-pill {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
        }
        .pill-high { color: #c084fc; border-color: rgba(192, 132, 252, 0.3); background: rgba(192, 132, 252, 0.08); }
        .pill-low { color: #f43f5e; border-color: rgba(244, 63, 94, 0.3); background: rgba(244, 63, 94, 0.08); }

        /* Control Input Workspace Deck Layout */
        .control-deck {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(10, 15, 30, 0.4);
            padding: 14px;
            border-radius: 18px;
            border: 1px solid var(--border-glass);
        }

        .label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .input-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
            height: 44px;
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 12px;
            font-weight: 700;
            font-size: 1rem;
            outline: none;
        }

        .scale-btn {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: white;
            padding: 0 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-left: 1px solid var(--border-glass);
        }

        .action-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
            color: white;
        }

        .btn-bet {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        .btn-cashout {
            background: linear-gradient(135deg, #10b981, #047857);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .action-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="bg-glow" id="ambientGlow"></div>

<div class="game-container">
    <div class="header-widget">
        <div class="user-tag">👤 <span id="userName">Guest</span></div>
        <div class="wallet-display">🪙 <span id="userBalance">Loading...</span></div>
    </div>

    <div class="flight-theater">
        <canvas id="graphCanvas"></canvas>
        <div id="multiplierDisplay" class="multiplier-counter status-fly">1.00x</div>
    </div>

    <div class="history-ribbon" id="historyBox"></div>

    <div class="control-deck">
        <div>
            <div class="label">Bet Amount</div>
            <div class="input-container">
                <input type="number" id="betValue" value="10" min="1">
                <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
            </div>
        </div>

        <button class="action-btn btn-bet" id="mainActionBtn" onclick="toggleEngineCoreState()" disabled>Syncing Wallet...</button>
    </div>
</div>

<script>
    // CENTRAL BACKEND APPS SCRIPT PATH ENDPOINT
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

    let balance = 0;
    let betAmount = 0;
    let gameActive = false;
    let flightRunning = false;

    let currentMultiplier = 1.00;
    let crashPoint = 0;
    let loopAnimationRef = null;
    let flightStartTime = 0;

    // Canvas Configuration
    const canvas = document.getElementById("graphCanvas");
    const ctx = canvas.getContext("2d");
    
    function syncCanvasSizing() {
        canvas.width = canvas.offsetWidth * window.devicePixelRatio;
        canvas.height = canvas.offsetHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    // Filter dynamic clean local user identification details handles
    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();
    document.getElementById("userName").innerText = cleanUser;

    // 1. LIVE REFRESH SYNC FROM SHEET DATA DIRECT
    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                
                if (!gameActive && !flightRunning) {
                    const btn = document.getElementById("mainActionBtn");
                    btn.disabled = false;
                    btn.innerText = "Place Bet";
                    btn.className = "action-btn btn-bet";
                }
            }
        }).catch(err => {
            console.error("Database connection fault:", err);
            document.getElementById('userBalance').innerText = "Offline";
        });
    }

    // 2. BACKEND TRANSACTION DISPATCH PIPE PACKET
    function syncTxToDatabase(amountChange, updateScreenUI = true) {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&amount=${amountChange}`)
        .then(r => r.json())
        .then(data => {
            // Only update screen UI if explicit clearance is granted (Wins/Cashouts)
            if (updateScreenUI && data && data.balance !== undefined) {
                balance = parseFloat(data.balance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
        }).catch(e => console.error("Database tracking link loss:", e));
    }

    function adjustStakeScale(type) {
        if (gameActive || flightRunning) return;
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function toggleEngineCoreState() {
        const actionBtn = document.getElementById("mainActionBtn");

        if (!gameActive && !flightRunning) {
            // Place Bet State
            const betInput = document.getElementById("betValue");
            const desiredBet = parseInt(betInput.value) || 0;

            if (desiredBet < 1 || desiredBet > balance) {
                alert("Stake bounds error! Balance metrics mismatched.");
                return;
            }

            // BALANCE BUG RESOLUTION: Subtract local variable values and display layout views instantly
            betAmount = desiredBet;
            balance -= betAmount;
            document.getElementById('userBalance').innerText = balance.toFixed(2);

            // Transmit background write command to server spreadsheet structure quietly
            syncTxToDatabase(-betAmount, false);

            gameActive = true;
            betInput.disabled = true;

            actionBtn.innerText = "Waiting for Takeoff...";
            actionBtn.disabled = true;

            // Trigger Flight Initializer sequence with slight suspense delay loop simulation pass
            setTimeout(launchFlightEngine, 1200);
        } else if (gameActive && flightRunning) {
            // Cash Out Click Event triggered manually by user interaction
            executeCashoutSequence();
        }
    }

    function generateMathematicalCrashPoint() {
        // Standard crash formula configuration calculation with standard 3% instant loss risk
        const houseEdgeFactor = 0.03; 
        if (Math.random() < houseEdgeFactor) return 1.00; 
        
        // Dynamic curve configuration algorithms map distribution calculations passes
        return parseFloat((1.01 + (Math.random() * 0.97) / (Math.random() + 0.01)).toFixed(2));
    }

    function launchFlightEngine() {
        flightRunning = true;
        currentMultiplier = 1.00;
        crashPoint = generateMathematicalCrashPoint();
        flightStartTime = performance.now();

        const actionBtn = document.getElementById("mainActionBtn");
        const display = document.getElementById("multiplierDisplay");
        
        display.className = "multiplier-counter status-fly";
        document.getElementById("ambientGlow").style.background = "radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(0,0,0,0) 70%)";

        if (gameActive) {
            actionBtn.disabled = false;
            actionBtn.innerText = `Cash Out`;
            actionBtn.className = "action-btn btn-cashout";
        }

        syncCanvasSizing();
        tickFlightLoop();
    }

    function tickFlightLoop() {
        if (!flightRunning) return;

        const timeElapsed = (performance.now() - flightStartTime) / 1000; // time in seconds
        
        // Exponential growth speed calculation formula logic model matching premium crash parameters
        currentMultiplier = parseFloat((Math.pow(Math.E, 0.075 * timeElapsed)).toFixed(2));

        if (currentMultiplier >= crashPoint) {
            currentMultiplier = crashPoint; // lock bounds metrics execution cap
            triggerCrashSequence();
            return;
        }

        document.getElementById("multiplierDisplay").innerText = `${currentMultiplier.toFixed(2)}x`;
        if (gameActive) {
            const currentProfitTotal = betAmount * currentMultiplier;
            document.getElementById("mainActionBtn").innerText = `Cash Out 🪙 ${currentProfitTotal.toFixed(2)}`;
        }

        renderGraphTrajectoryCurve(timeElapsed);
        loopAnimationRef = requestAnimationFrame(tickFlightLoop);
    }

    function renderGraphTrajectoryCurve(seconds) {
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;
        ctx.clearRect(0, 0, w, h);

        // Map dimensions to canvas constraints scaling formulas passes
        const curveX = Math.min(w * 0.85, (seconds / 15) * w + 30);
        const curveY = Math.max(h * 0.2, h - ((currentMultiplier - 1) / 5) * h - 30);

        // Draw glowing vector matrix lines traces
        ctx.beginPath();
        ctx.moveTo(30, h - 30);
        ctx.quadraticCurveTo(w * 0.4, h - 30, curveX, curveY);
        ctx.strokeStyle = gameActive ? "#10b981" : "#3b82f6";
        ctx.lineWidth = 4;
        ctx.shadowBlur = 15;
        ctx.shadowColor = gameActive ? "rgba(16, 185, 129, 0.6)" : "rgba(59, 130, 246, 0.6)";
        ctx.stroke();
        ctx.shadowBlur = 0; // reset shader overrides values

        // Draw moving vector dot indicator node point
        ctx.beginPath();
        ctx.arc(curveX, curveY, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
    }

    function executeCashoutSequence() {
        if (!gameActive || !flightRunning) return;
        gameActive = false; // drop game state immediately to block concurrent double tap inputs overrides

        const winPrizeAmount = betAmount * currentMultiplier;
        balance += winPrizeAmount;
        document.getElementById('userBalance').innerText = balance.toFixed(2);

        // WIN SEQUENCE: Update database server transaction directly and permit safe screen updates
        syncTxToDatabase(winPrizeAmount, true);

        const display = document.getElementById("multiplierDisplay");
        display.className = "multiplier-counter status-win";

        const actionBtn = document.getElementById("mainActionBtn");
        actionBtn.disabled = true;
        actionBtn.innerText = `Cached Out! +🪙 ${winPrizeAmount.toFixed(2)}`;
    }

    function triggerCrashSequence() {
        flightRunning = false;
        cancelAnimationFrame(loopAnimationRef);

        const display = document.getElementById("multiplierDisplay");
        display.innerText = `Crashed @ ${crashPoint.toFixed(2)}x`;
        display.className = "multiplier-counter status-flee";
        
        document.getElementById("ambientGlow").style.background = "radial-gradient(circle, rgba(239, 68, 68, 0.25) 0%, rgba(0,0,0,0) 70%)";

        const actionBtn = document.getElementById("mainActionBtn");
        actionBtn.disabled = true;
        actionBtn.innerText = "FLEW AWAY";
        actionBtn.className = "action-btn btn-bet";

        if (gameActive) {
            // LOSS SEQUENCE: DO NOT ping server for balance check updates now. Retain visual deductions intact.
            gameActive = false;
        }

        pushLogToHistoryRibbon(crashPoint);

        // Dynamic 3 seconds cool-down state recovery loop transitions
        setTimeout(() => {
            document.getElementById("betValue").disabled = false;
            display.innerText = "1.00x";
            display.className = "multiplier-counter status-fly";
            actionBtn.innerText = "Place Bet";
            actionBtn.disabled = false;

            // Clear layout curves paths
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, w, h);
        }, 3500);
    }

    function pushLogToHistoryRibbon(val) {
        const box = document.getElementById("historyBox");
        const pill = document.createElement("div");
        pill.className = `history-pill ${val >= 2.0 ? 'pill-high' : 'pill-low'}`;
        pill.innerText = `${val.toFixed(2)}x`;

        box.insertBefore(pill, box.firstChild);
        if (box.children.length > 8) box.removeChild(box.lastChild);
    }

    // Direct immediate launch sequences initialization passes
    window.addEventListener('resize', syncCanvasSizing);
    fetchLiveWallet();
</script>

</body>
</html>
