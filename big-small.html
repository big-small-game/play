<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Small Pro</title>
    <style>
        :root {
            --bg-main: #060b19;
            --bg-card: rgba(15, 23, 42, 0.6);
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        .game-container {
            width: 100%;
            max-width: 430px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            box-shadow: var(--glow-shadow);
            z-index: 10;
        }

        /* Header Navigation Widget */
        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .wallet-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            font-weight: 800;
            color: var(--accent-gold);
        }

        /* Dice Theatre Stage Container */
        .dice-theater {
            background: rgba(10, 15, 30, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .dice-row {
            display: flex;
            gap: 16px;
        }

        .die {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            color: #0f172a;
            border-radius: 12px;
            font-size: 2rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 -4px 0 #cbd5e1;
            transition: transform 0.1s ease;
        }

        .dice-rolling {
            animation: shakeAndRoll 0.15s infinite alternate;
        }

        @keyframes shakeAndRoll {
            0% { transform: translate(3px, -3px) rotate(-8deg); }
            100% { transform: translate(-3px, 3px) rotate(8deg); }
        }

        .total-badge {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-light);
            background: rgba(255,255,255,0.05);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
        }

        /* History Ribbons */
        .history-ribbon {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .history-ribbon::-webkit-scrollbar { display: none; }

        .history-pill {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
        }
        .pill-big { color: var(--primary-blue); border-color: rgba(59, 130, 246, 0.3); }
        .pill-small { color: var(--accent-gold); border-color: rgba(245, 158, 11, 0.3); }

        /* Betting Space Selector Zones */
        .betting-zones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .zone-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .zone-btn .title { font-size: 1.3rem; font-weight: 900; }
        .zone-btn .odds { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }

        .zone-big { color: var(--primary-blue); }
        .zone-big.selected { background: rgba(59, 130, 246, 0.15); border-color: var(--primary-blue); box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }

        .zone-small { color: var(--accent-gold); }
        .zone-small.selected { background: rgba(245, 158, 11, 0.15); border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }

        /* Control Input Deck */
        .control-deck {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(10, 15, 30, 0.4);
            padding: 14px;
            border-radius: 18px;
            border: 1px solid var(--border-glass);
        }

        .label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .input-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
            height: 44px;
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 12px;
            font-weight: 700;
            font-size: 1rem;
            outline: none;
        }

        .scale-btn {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: white;
            padding: 0 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-left: 1px solid var(--border-glass);
        }

        .roll-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: all 0.15s ease;
        }

        .roll-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Header -->
    <div class="header-widget">
        <div class="user-tag">👤 <span id="userName">Guest</span></div>
        <div class="wallet-display">🪙 <span id="userBalance">Loading...</span></div>
    </div>

    <!-- Dice Theater Arena Layout -->
    <div class="dice-theater">
        <div class="dice-row">
            <div class="die" id="die1">⚀</div>
            <div class="die" id="die2">⚄</div>
            <div class="die" id="die3">⚃</div>
        </div>
        <div class="total-badge" id="totalScoreText">Total: --</div>
    </div>

    <!-- History Ribbon Log Strip -->
    <div class="history-ribbon" id="historyBox"></div>

    <!-- Interactive Choice Layout Blocks -->
    <div class="betting-zones">
        <button class="zone-btn zone-big" id="zoneBig" onclick="selectPredictionZone('BIG')">
            <span class="title">BIG</span>
            <span class="odds">11 - 17 (x2.0)</span>
        </button>
        <button class="zone-btn zone-small" id="zoneSmall" onclick="selectPredictionZone('SMALL')">
            <span class="title">SMALL</span>
            <span class="odds">4 - 10 (x2.0)</span>
        </button>
    </div>

    <!-- Operating System Input Blocks -->
    <div class="control-deck">
        <div>
            <div class="label">Bet Amount</div>
            <div class="input-container">
                <input type="number" id="betValue" value="10" min="1">
                <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
            </div>
        </div>

        <button class="roll-btn" id="rollActionBtn" onclick="executeBetAndRollCycle()" disabled>Syncing Wallet...</button>
    </div>
</div>

<script>
    // CENTRAL BACKEND APPS SCRIPT PATH ENDPOINT
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

    let balance = 0;
    let selectedZone = null;
    let isRolling = false;
    const diceGlyphs = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    // Filter dynamic clean local user identification details handles
    const rawUser = localStorage.getItem("currentUser") || "Guest";
    const cleanUser = rawUser.trim().includes("@") ? rawUser.split("@")[0] : rawUser.trim();
    document.getElementById("userName").innerText = cleanUser;

    // 1. LIVE REFRESH SYNC FROM SHEET DATA DIRECT
    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                
                if (!isRolling) {
                    document.getElementById("rollActionBtn").disabled = false;
                    updateRollButtonStateText();
                }
            }
        }).catch(err => {
            console.error("Database sync fault:", err);
            document.getElementById('userBalance').innerText = "Offline";
        });
    }

    // 2. BACKEND TRANSACTION DISPATCH PIPE PACKET
    function syncTxToDatabase(amountChange, updateScreenUI = true) {
        return fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&amount=${amountChange}`)
        .then(r => r.json())
        .then(data => {
            if (updateScreenUI && data && data.balance !== undefined) {
                balance = parseFloat(data.balance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
            return data;
        }).catch(e => console.error("Database tracking connection lost:", e));
    }

    function selectPredictionZone(zone) {
        if (isRolling) return;
        selectedZone = zone;
        
        document.getElementById("zoneBig").classList.remove("selected");
        document.getElementById("zoneSmall").classList.remove("selected");

        if (zone === 'BIG') document.getElementById("zoneBig").classList.add("selected");
        if (zone === 'SMALL') document.getElementById("zoneSmall").classList.add("selected");

        updateRollButtonStateText();
    }

    function adjustStakeScale(type) {
        if (isRolling) return;
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function updateRollButtonStateText() {
        const btn = document.getElementById("rollActionBtn");
        if (!selectedZone) {
            btn.innerText = "Select BIG or SMALL";
            btn.disabled = true;
        } else {
            btn.innerText = `Roll for ${selectedZone}`;
            btn.disabled = false;
        }
    }

    function executeBetAndRollCycle() {
        if (isRolling || !selectedZone) return;

        const betInput = document.getElementById("betValue");
        const betAmount = parseInt(betInput.value) || 0;

        if (betAmount < 1 || betAmount > balance) {
            alert("Stake bounds error! Balance metrics mismatched.");
            return;
        }

        // BALANCE BUG RESOLUTION: Subtract local variable values and display layout views instantly
        isRolling = true;
        balance -= betAmount;
        document.getElementById('userBalance').innerText = balance.toFixed(2);

        // Lock workspace interaction components inputs fields
        betInput.disabled = true;
        document.getElementById("rollActionBtn").disabled = true;
        document.getElementById("zoneBig").style.opacity = "0.6";
        document.getElementById("zoneSmall").style.opacity = "0.6";

        // Transmit background write command to server spreadsheet structure quietly
        syncTxToDatabase(-betAmount, false);

        // Trigger Dice Graphical CSS Animation Sequence
        const d1 = document.getElementById("die1");
        const d2 = document.getElementById("die2");
        const d3 = document.getElementById("die3");
        d1.classList.add("dice-rolling");
        d2.classList.add("dice-rolling");
        d3.classList.add("dice-rolling");

        // Run rolling ticker loops visually changing numbers inside element views frames
        let rollingTickerInterval = setInterval(() => {
            d1.innerText = diceGlyphs[Math.floor(Math.random() * 6) + 1];
            d2.innerText = diceGlyphs[Math.floor(Math.random() * 6) + 1];
            d3.innerText = diceGlyphs[Math.floor(Math.random() * 6) + 1];
        }, 80);

        // Terminate sequence cycle updates executions outcomes passes after exactly 1.8 seconds
        setTimeout(() => {
            clearInterval(rollingTickerInterval);
            
            d1.classList.remove("dice-rolling");
            d2.classList.remove("dice-rolling");
            d3.classList.remove("dice-rolling");

            // Compute math scores values results drops properties
            const val1 = Math.floor(Math.random() * 6) + 1;
            const val2 = Math.floor(Math.random() * 6) + 1;
            const val3 = Math.floor(Math.random() * 6) + 1;
            const absoluteTotalSum = val1 + val2 + val3;

            d1.innerText = diceGlyphs[val1];
            d2.innerText = diceGlyphs[val2];
            d3.innerText = diceGlyphs[val3];

            // Resolve game engine logic outcomes states calculations
            let outcomeGroupText = "SMALL";
            if (absoluteTotalSum >= 11) outcomeGroupText = "BIG";
            // Specific exception rules context handle definitions bounds: 3 and 18 are automatic losses (triple house rules edge)
            if (absoluteTotalSum <= 3 || absoluteTotalSum >= 18) outcomeGroupText = "TRIPLE_LOSS";

            document.getElementById("totalScoreText").innerText = `Total: ${absoluteTotalSum} (${outcomeGroupText})`;

            const userWonGame = (selectedZone === outcomeGroupText);

            if (userWonGame) {
                const totalWinReturnFunds = betAmount * 2;
                balance += totalWinReturnFunds;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                
                // WIN CONDITION: Dispatch transaction update payload packet directly to server sheet architectures pipeline safely
                syncTxToDatabase(totalWinWinReturnFunds, true);
                document.getElementById("rollActionBtn").innerText = `WINNINGS +🪙${totalWinReturnFunds}`;
            } else {
                // LOSS CONDITION: DO NOT pull from database endpoint now to avoid breaking UI local memory changes states visualization workflows
                document.getElementById("rollActionBtn").innerText = "YOU LOST";
            }

            if (outcomeGroupText !== "TRIPLE_LOSS") {
                pushLogToHistoryRibbon(outcomeGroupText);
            }

            // Restore active interface functionalities access paths blocks maps hooks loops
            setTimeout(() => {
                isRolling = false;
                betInput.disabled = false;
                document.getElementById("zoneBig").style.opacity = "1";
                document.getElementById("zoneSmall").style.opacity = "1";
                updateRollButtonStateText();
            }, 2000);

        }, 1800);
    }

    function pushLogToHistoryRibbon(outcome) {
        const box = document.getElementById("historyBox");
        const pill = document.createElement("div");
        pill.className = `history-pill ${outcome === 'BIG' ? 'pill-big' : 'pill-small'}`;
        pill.innerText = outcome;

        box.insertBefore(pill, box.firstChild);
        if (box.children.length > 8) box.removeChild(box.lastChild);
    }

    // Direct immediate launch sequences initialization passes
    fetchLiveWallet();
</script>

</body>
</html>
