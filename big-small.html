<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Small Pro</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-sidebar: #131c2e;
            --bg-card: #0b0f19;
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.06);
            --sidebar-width: 360px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        /* Ambient Glow Backdrop Elements */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            z-index: -1;
        }
        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.05) 0%, transparent 70%);
            bottom: -10%;
            right: -10%;
            z-index: -1;
        }

        .back-nav-container {
            width: 100%;
            max-width: 1040px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 16px;
        }

        .btn-back {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border-glass);
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }

        .btn-back:hover {
            color: var(--text-light);
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 16px;
            max-width: 1040px;
            background: rgba(19, 28, 46, 0.4);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
        }

        .user-tag {
            font-size: 0.9rem;
            font-weight: 600;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .user-tag span {
            color: var(--text-light);
            font-weight: 700;
        }

        .wallet-display {
            background: rgba(11, 15, 25, 0.6);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(245, 158, 11, 0.2);
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .game-wrapper {
            width: 100%;
            max-width: 1040px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
        }

        .sidebar-controls {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            border-right: 1px solid var(--border-glass);
        }

        .grid-theater {
            flex: 1;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            padding: 32px;
            position: relative;
            min-height: 480px;
            gap: 24px;
        }

        .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .input-container {
            display: flex;
            background: #090d16;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            height: 48px;
            align-items: center;
            transition: border-color 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .input-container:focus-within {
            border-color: rgba(59, 130, 246, 0.5);
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 16px;
            font-weight: 700;
            font-size: 1.05rem;
            outline: none;
        }

        /* Remove default spin buttons */
        .input-container input::-webkit-outer-spin-button,
        .input-container input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-container input[type=number] {
            -moz-appearance: textfield;
        }

        .scale-btn {
            background: rgba(255, 255, 255, 0.03);
            border: none;
            color: #94a3b8;
            width: 54px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            border-left: 1px solid rgba(255,255,255,0.08);
            height: 100%;
            transition: all 0.15s ease;
        }

        .scale-btn:hover { 
            background: rgba(255, 255, 255, 0.08); 
            color: var(--text-light);
        }

        .betting-zones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .zone-btn {
            background: rgba(9, 13, 22, 0.5);
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 22px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .zone-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .zone-btn:hover:not(.disabled) {
            border-color: var(--primary-blue);
            transform: translateY(-2px);
            background: rgba(59, 130, 246, 0.03);
        }
        .zone-btn:hover:not(.disabled)::before { opacity: 1; }

        .zone-btn#zoneSmall.selected {
            border-style: solid;
            border-color: var(--primary-blue);
            background: rgba(59, 130, 246, 0.12);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.25), inset 0 0 12px rgba(59, 130, 246, 0.1);
        }
        .zone-btn#zoneBig.selected {
            border-style: solid;
            border-color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.12);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.25), inset 0 0 12px rgba(245, 158, 11, 0.1);
        }

        .zone-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: #cbd5e1;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }
        .zone-btn.selected .zone-title { color: white; }

        .zone-sub {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 4px;
            font-weight: 600;
        }
        .zone-btn.selected .zone-sub { color: rgba(255,255,255,0.6); }

        .action-btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            color: #020617;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
            position: relative;
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.1);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .action-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
        }

        .action-btn:disabled {
            background: #1e293b !important;
            color: #475569 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .dice-arena {
            width: 100%;
            flex: 1;
            background: radial-gradient(circle at center, #0c1527 0%, #040813 100%);
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 240px;
            box-shadow: inset 0 4px 30px rgba(0,0,0,0.6);
        }

        /* Container 3D Dice styling Grid setup */
        .dice-container {
            display: flex;
            gap: 40px;
            margin-bottom: 25px;
            perspective: 600px; /* Essential for 3D realism perspective */
            padding: 20px;
        }

        /* Advanced Realistic 3D Cube Structure Styles */
        .dice-cube {
            position: relative;
            width: 60px;
            height: 60px;
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
        }

        .face {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            border-radius: 12px;
            border: 1px solid #94a3b8;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 7px;
            box-sizing: border-box;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.15), 0 0 10px rgba(0,0,0,0.2);
            backface-visibility: hidden;
        }

        /* 3D Sides Transformations mapping */
        .face-1 { transform: rotateY(0deg) translateZ(30px); }
        .face-2 { transform: rotateY(90deg) translateZ(30px); }
        .face-3 { transform: rotateX(90deg) translateZ(30px); }
        .face-4 { transform: rotateX(-90deg) translateZ(30px); }
        .face-5 { transform: rotateY(-90deg) translateZ(30px); }
        .face-6 { transform: rotateY(180deg) translateZ(30px); }

        /* Pip Dots configuration layout rules inside 3x3 grids */
        .pip {
            background-color: #0f172a;
            border-radius: 50%;
            width: 9px;
            height: 9px;
            margin: auto;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.6);
        }
        /* Red center point dot for face 1 and 4 for extra luxury classic look */
        .face-1 .pip { background-color: #dc2626; width: 12px; height: 12px;}
        .face-4 .pip { background-color: #1e3a8a; }

        /* Specific Pip distributions maps per side */
        .face-1 .pip:nth-child(1) { grid-area: 2 / 2; }

        .face-2 .pip:nth-child(1) { grid-area: 1 / 1; }
        .face-2 .pip:nth-child(2) { grid-area: 3 / 3; }

        .face-3 .pip:nth-child(1) { grid-area: 1 / 1; }
        .face-3 .pip:nth-child(2) { grid-area: 2 / 2; }
        .face-3 .pip:nth-child(3) { grid-area: 3 / 3; }

        .face-4 .pip:nth-child(1) { grid-area: 1 / 1; }
        .face-4 .pip:nth-child(2) { grid-area: 1 / 3; }
        .face-4 .pip:nth-child(3) { grid-area: 3 / 1; }
        .face-4 .pip:nth-child(4) { grid-area: 3 / 3; }

        .face-5 .pip:nth-child(1) { grid-area: 1 / 1; }
        .face-5 .pip:nth-child(2) { grid-area: 1 / 3; }
        .face-5 .pip:nth-child(3) { grid-area: 2 / 2; }
        .face-5 .pip:nth-child(4) { grid-area: 3 / 1; }
        .face-5 .pip:nth-child(5) { grid-area: 3 / 3; }

        .face-6 .pip:nth-child(1) { grid-area: 1 / 1; }
        .face-6 .pip:nth-child(2) { grid-area: 1 / 3; }
        .face-6 .pip:nth-child(3) { grid-area: 2 / 1; }
        .face-6 .pip:nth-child(4) { grid-area: 2 / 3; }
        .face-6 .pip:nth-child(5) { grid-area: 3 / 1; }
        .face-6 .pip:nth-child(6) { grid-area: 3 / 3; }

        /* Live rolling spin configuration animation classes loops */
        .dice-cube.rolling-fast {
            animation: spin3D 0.2s infinite linear;
        }

        @keyframes spin3D {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        .live-result-overlay {
            font-size: 2.5rem;
            font-weight: 900;
            color: white;
            text-align: center;
            letter-spacing: 0.5px;
            min-height: 40px;
            line-height: 1.2;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .house-tie-text {
            color: var(--accent-red);
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            margin-top: 6px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .history-panel {
            background: rgba(9, 13, 22, 0.4);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--border-glass);
        }

        .history-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px;
            scroll-behavior: smooth;
        }

        .history-list::-webkit-scrollbar {
            height: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .history-pill {
            background: #131c30;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.04);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .history-pill.pill-big { color: #60a5fa; border-color: rgba(59, 130, 246, 0.2); background: rgba(59, 130, 246, 0.05); }
        .history-pill.pill-small { color: #fbbf24; border-color: rgba(245, 158, 11, 0.2); background: rgba(245, 158, 11, 0.05); }
        .history-pill.pill-tie { color: #f87171; border-color: rgba(239, 68, 68, 0.2); background: rgba(239, 68, 68, 0.05); }

        .disabled {
            opacity: 0.4;
            cursor: not-allowed !important;
            pointer-events: none;
        }

        /* Premium Modal Dialog Popups UI Elements */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 7, 13, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #131c30;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 28px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: white;
        }

        .modal-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .modal-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 32px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s ease;
        }
        .modal-btn:hover { background: #2563eb; }

        @media (max-width: 820px) {
            .game-wrapper { flex-direction: column-reverse; }
            .sidebar-controls { width: 100%; border-right: none; border-top: 1px solid var(--border-glass); padding: 24px; }
            .grid-theater { padding: 20px; min-height: 380px; }
            .dice-container { gap: 24px; }
        }
    </style>
</head>
<body>

<div class="back-nav-container">
    <a href="game.html" class="btn-back">← Back to Games</a>
</div>

<div class="header-widget">
    <div class="user-tag">👤 User: <span id="userName">Guest</span></div>
    <div class="wallet-display">🪙 <span id="userBalance">0.00</span></div>
</div>

<div class="game-wrapper">
    <div class="sidebar-controls">
        <div>
            <div class="label">Bet Amount</div>
            <div class="input-container">
                <input type="number" id="betValue" value="10" min="1">
                <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
            </div>
        </div>

        <div>
            <div class="label">Select Prediction</div>
            <div class="betting-zones">
                <div class="zone-btn" id="zoneSmall" onclick="selectPrediction('SMALL')">
                    <div class="zone-title">SMALL</div>
                    <div class="zone-sub">4 - 10 (1:1)</div>
                </div>
                <div class="zone-btn" id="zoneBig" onclick="selectPrediction('BIG')">
                    <div class="zone-title">BIG</div>
                    <div class="zone-sub">11 - 17 (1:1)</div>
                </div>
            </div>
        </div>

        <button class="action-btn" id="mainActionBtn" onclick="executeDiceRollEngine()" disabled>Syncing Balance...</button>
    </div>

    <div class="grid-theater">
        <div class="dice-arena">
            <div class="dice-container">
                <div class="dice-cube" id="cube1">
                    <div class="face face-1"><div class="pip"></div></div>
                    <div class="face face-2"><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-3"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-4"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-5"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-6"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                </div>
                <div class="dice-cube" id="cube2">
                    <div class="face face-1"><div class="pip"></div></div>
                    <div class="face face-2"><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-3"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-4"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-5"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-6"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                </div>
                <div class="dice-cube" id="cube3">
                    <div class="face face-1"><div class="pip"></div></div>
                    <div class="face face-2"><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-3"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-4"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-5"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                    <div class="face face-6"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
                </div>
            </div>
            <div class="live-result-overlay" id="resultDisplay">Ready</div>
        </div>

        <div class="history-panel">
            <div class="label">Recent Outcomes</div>
            <div class="history-list" id="historyLog"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="customAlertModal">
    <div class="modal-card">
        <div class="modal-title" id="modalAlertTitle">Attention</div>
        <div class="modal-desc" id="modalAlertText">Alert message goes here.</div>
        <button class="modal-btn" onclick="closeCustomAlert()">Acknowledge</button>
    </div>
</div>

<script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbzWEe-nOLyOZlwk8t76jgULfhPfXZdtDPqtaWi4dJuEIP5HMJW8GQJM7N7HPK5x63NzfQ/exec";

    let balance = 0;
    let betAmount = 0;
    let selectedPrediction = null;
    let gameActive = false;

    // Fixed 3D Rotation coordinates mapping table for structural sides indexes (1 to 6)
    const cubeRotationMap = {
        1: "rotateX(0deg) rotateY(0deg)",
        2: "rotateX(0deg) rotateY(-90deg)",
        3: "rotateX(-90deg) rotateY(0deg)",
        4: "rotateX(90deg) rotateY(0deg)",
        5: "rotateX(0deg) rotateY(90deg)",
        6: "rotateX(180deg) rotateY(0deg)"
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSyntheticSound(frequency, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    // Modal Helper logic actions
    function triggerCustomAlert(title, text) {
        document.getElementById("modalAlertTitle").innerText = title;
        document.getElementById("modalAlertText").innerText = text;
        document.getElementById("customAlertModal").classList.add("active");
    }

    function closeCustomAlert() {
        document.getElementById("customAlertModal").classList.remove("active");
    }

    const cleanUser = (localStorage.getItem("currentUser") || "Guest").trim();
    document.getElementById("userName").innerText = cleanUser;

    function selectPrediction(side) {
        if (gameActive) return;
        selectedPrediction = side;
        document.getElementById("zoneSmall").classList.remove("selected");
        document.getElementById("zoneBig").classList.remove("selected");
        
        if (side === "SMALL") document.getElementById("zoneSmall").classList.add("selected");
        if (side === "BIG") document.getElementById("zoneBig").classList.add("selected");
        playSyntheticSound(450, 'sine', 0.08);
    }

    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                if (!gameActive) {
                    const actionBtn = document.getElementById("mainActionBtn");
                    actionBtn.disabled = false;
                    actionBtn.innerText = "Roll Dice";
                }
            }
        });
    }

    function syncTxToDatabase(amountChange, outcome = "none", updateScreenUI = true) {
        let url = `${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&modify_balance=${amountChange}`;
        if(outcome !== "none") {
            url += `&game_result=${outcome}`;
        }
        
        fetch(url)
        .then(r => r.json())
        .then(data => {
            if (updateScreenUI && data && data.newBalance !== undefined) {
                balance = parseFloat(data.newBalance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
        });
    }

    function adjustStakeScale(type) {
        if (gameActive) return;
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function executeDiceRollEngine() {
        if (gameActive) return;

        const betInput = document.getElementById("betValue");
        const desiredBet = parseInt(betInput.value) || 0;

        if (!selectedPrediction) {
            triggerCustomAlert("Prediction Missing", "Please pick a side: BIG or SMALL to place your stakes.");
            return;
        }

        if (desiredBet < 1 || desiredBet > balance) {
            triggerCustomAlert("Invalid Balance", "Stake value must be at least 1 and cannot exceed your current total wallet balance.");
            return;
        }

        gameActive = true;
        betAmount = desiredBet;
        balance -= betAmount;
        document.getElementById('userBalance').innerText = balance.toFixed(2);
        
        // Locking interfaces
        betInput.disabled = true;
        document.getElementById("mainActionBtn").disabled = true;
        document.getElementById("zoneSmall").classList.add("disabled");
        document.getElementById("zoneBig").classList.add("disabled");

        // Sync original stake subtraction to server
        syncTxToDatabase(-betAmount, "none", true);

        // Visual rolling initialization via adding faster continuous looping rotation animation
        const c1 = document.getElementById("cube1");
        const c2 = document.getElementById("cube2");
        const c3 = document.getElementById("cube3");
        
        c1.classList.add("rolling-fast");
        c2.classList.add("rolling-fast");
        c3.classList.add("rolling-fast");
        document.getElementById("resultDisplay").innerText = "Rolling...";

        let soundTicks = 0;
        const soundInterval = setInterval(() => {
            if(soundTicks >= 12) {
                clearInterval(soundInterval);
            } else {
                playSyntheticSound(200 + Math.random() * 350, 'triangle', 0.06);
                soundTicks++;
            }
        }, 100);

        setTimeout(() => {
            resolveDiceEngineOutcome();
        }, 1400);
    }

    function resolveDiceEngineOutcome() {
        const r1 = Math.floor(Math.random() * 6) + 1;
        const r2 = Math.floor(Math.random() * 6) + 1;
        const r3 = Math.floor(Math.random() * 6) + 1;

        const c1 = document.getElementById("cube1");
        const c2 = document.getElementById("cube2");
        const c3 = document.getElementById("cube3");

        // Stop continuous spinning animations
        c1.classList.remove("rolling-fast");
        c2.classList.remove("rolling-fast");
        c3.classList.remove("rolling-fast");

        // Apply distinct 3D vector coordinates to face correct landing outcomes directly
        c1.style.transform = cubeRotationMap[r1];
        c2.style.transform = cubeRotationMap[r2];
        c3.style.transform = cubeRotationMap[r3];

        const totalSum = r1 + r2 + r3;
        let category = "TIE";

        if (totalSum >= 4 && totalSum <= 10) {
            category = "SMALL";
        } else if (totalSum >= 11 && totalSum <= 17) {
            category = "BIG";
        }

        const display = document.getElementById("resultDisplay");
        let outcomeString = `${totalSum} (${category})`;
        
        if (category === "TIE") {
            outcomeString = `${totalSum}<br><span class="house-tie-text">🔥 HOUSE TRIPLE TIE 🔥</span>`;
        }
        display.innerHTML = outcomeString;

        // Determinedynamic payoffs
        let isWin = (selectedPrediction === category);
        let finalChangeAmount = 0;
        let gameResultStatus = "loss";

        if (isWin) {
            finalChangeAmount = betAmount * 2;
            balance += finalChangeAmount;
            gameResultStatus = "win";
            playSyntheticSound(520, 'sine', 0.12);
            setTimeout(() => playSyntheticSound(780, 'sine', 0.18), 80);
        } else {
            playSyntheticSound(140, 'sawtooth', 0.35);
        }

        document.getElementById('userBalance').innerText = balance.toFixed(2);
        
        // Final database balancing sync
        syncTxToDatabase(finalChangeAmount, gameResultStatus, true);
        appendHistoryLog(totalSum, category);

        // Cool-down layout reset
        setTimeout(() => {
            gameActive = false;
            document.getElementById("betValue").disabled = false;
            document.getElementById("mainActionBtn").disabled = false;
            document.getElementById("zoneSmall").classList.remove("disabled");
            document.getElementById("zoneBig").classList.remove("disabled");
            document.getElementById("mainActionBtn").innerText = "Roll Dice";
        }, 1800);
    }

    function appendHistoryLog(sum, category) {
        const log = document.getElementById("historyLog");
        const pill = document.createElement("div");
        pill.className = `history-pill pill-${category.toLowerCase()}`;
        pill.innerText = `${sum} ${category[0]}`;
        
        log.insertBefore(pill, log.firstChild);
        if (log.children.length > 10) {
            log.removeChild(log.lastChild);
        }
    }

    fetchLiveWallet();
</script>
</body>
</html>
