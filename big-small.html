<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Small Learning Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ff6b6b,#6c5ce7,#00cec9);
    color:white;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
}

.account-btn{
    background:white;
    color:black;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.score-box{
    background:rgba(255,255,255,0.2);
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
    text-align:center;
}

.timer{
    font-size:60px;
    font-weight:bold;
    margin:20px 0;
}

.choice-btn{
    padding:15px 40px;
    margin:15px;
    border:none;
    border-radius:15px;
    font-size:22px;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

.big{
    background:#00b894;
}

.small{
    background:#d63031;
}

.lock-btn{
    padding:15px 35px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-size:18px;
    margin-top:15px;
}

.result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

.panel{
    margin-top:20px;
    background:rgba(255,255,255,0.15);
    padding:15px;
    border-radius:15px;
    display:none;
}

.history{
    margin-top:25px;
    background:rgba(255,255,255,0.15);
    padding:15px;
    border-radius:15px;
    text-align:left;
}

.history ul{
    padding-left:20px;
}

li{
    margin-top:5px;
}
</style>
</head>
<body>

<div class="topbar">
    <button class="account-btn" onclick="togglePanel()">
        📊 Stats
    </button>

    <div class="score-box">
        Score: <span id="score">0</span>
    </div>
</div>

<div class="container">

    <h1>🎲 BIG SMALL GAME</h1>

    <div class="panel" id="statsPanel">
        <p><b>Wins:</b> <span id="wins">0</span></p>
        <p><b>Losses:</b> <span id="losses">0</span></p>
    </div>

    <div class="timer" id="timer">20</div>

    <button class="choice-btn big" onclick="choose('Big')">
        BIG
    </button>

    <button class="choice-btn small" onclick="choose('Small')">
        SMALL
    </button>

    <p id="selectedChoice" style="margin-top:10px;"></p>

    <button class="lock-btn" onclick="lockChoice()">
        Place Bet
    </button>

    <div class="result" id="result"></div>

    <div class="history">
        <h3>Round History</h3>
        <ul id="historyList"></ul>
    </div>

</div>

<script>
let selected = "";
let lockedChoice = null;

let score = 0;
let wins = 0;
let losses = 0;

function togglePanel(){
    let panel = document.getElementById("statsPanel");

    panel.style.display =
        panel.style.display === "block"
        ? "none"
        : "block";
}

function choose(choice){

    if(lockedChoice !== null){
        alert("Bet already placed for this round.");
        return;
    }

    selected = choice;

    document.getElementById("selectedChoice").innerText =
        "Selected: " + choice;
}

function lockChoice(){

    if(selected === ""){
        alert("Choose Big or Small first.");
        return;
    }

    if(lockedChoice !== null){
        alert("Bet already Placed.");
        return;
    }

    lockedChoice = selected;

    document.getElementById("result").innerText =
        "⏳ Bet Placed";
}

function settleRound(){

    if(lockedChoice === null){
        document.getElementById("result").innerText =
            "No choice made this round.";
        return;
    }

    const outcome =
        Math.random() < 0.5
        ? "Big"
        : "Small";

    let text = "";

    if(outcome === lockedChoice){

        wins++;
        score++;

        text =
            "✅ WIN | Result: " + outcome;

    }else{

        losses++;
        score--;

        text =
            "❌ LOSS | Result: " + outcome;
    }

    document.getElementById("score").innerText = score;
    document.getElementById("wins").innerText = wins;
    document.getElementById("losses").innerText = losses;
    document.getElementById("result").innerText = text;

    let li = document.createElement("li");

    li.innerText =
        new Date().toLocaleTimeString() +
        " - " + text;

    document.getElementById("historyList")
        .prepend(li);

    selected = "";
    lockedChoice = null;

    document.getElementById("selectedChoice")
        .innerText = "";
}

let time = 20;

setInterval(() => {

    time--;

    if(time < 0){

        settleRound();

        time = 20;
    }

    document.getElementById("timer").innerText =
        time;

},1000);
</script>

</body>
</html>
