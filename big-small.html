<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Small</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #0b0f19;
            --primary-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #00e676;
            --accent-red: #ff3333;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .back-nav-container {
            width: 100%;
            max-width: 940px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .btn-back {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-glass);
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--accent-red);
            border-color: transparent;
        }

        .game-wrapper {
            width: 100%;
            max-width: 940px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .sidebar-controls {
            width: 340px;
            background: var(--bg-sidebar);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border-glass);
        }

        .grid-theater {
            flex: 1;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: relative;
            min-height: 400px;
            gap: 20px;
        }

        .header-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 16px;
            max-width: 940px;
            padding: 0 8px;
        }

        .user-tag {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .wallet-display {
            background: var(--bg-sidebar);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            font-weight: bold;
            color: var(--accent-gold);
        }

        .dice-arena {
            width: 100%;
            flex: 1;
            background: #040814;
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 180px;
        }

        .dice-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .die {
            width: 60px;
            height: 60px;
            background-color: white;
            color: #0f172a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 6px 0 #cbd5e1, 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
        }

        .die.rolling {
            animation: shake 0.15s infinite alternate;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            100% { transform: translate(-1px, -2px) rotate(-5deg); }
        }

        .live-result-overlay {
            font-size: 2.2rem;
            font-weight: 900;
            color: white;
            text-align: center;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .house-tie-text {
            color: var(--accent-red);
            font-size: 1rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-container {
            display: flex;
            background: var(--bg-main);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            height: 44px;
            align-items: center;
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 0 14px;
            font-weight: 700;
            font-size: 0.95rem;
            outline: none;
        }

        .scale-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-light);
            padding: 0 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-left: 1px solid rgba(255,255,255,0.1);
            height: 100%;
        }

        .scale-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .betting-zones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .zone-btn {
            background: rgba(0,0,0,0.25);
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .zone-btn:hover:not(.disabled) {
            border-color: var(--primary-blue);
            background: rgba(59, 130, 246, 0.05);
        }

        .zone-btn.selected {
            border-style: solid;
            border-color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.15);
        }

        .zone-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: white;
            margin-bottom: 2px;
        }

        .zone-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .action-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: #020617;
            transition: all 0.15s ease;
            text-transform: uppercase;
            background: var(--accent-green);
            box-shadow: 0 4px 0 #047857;
        }

        .action-btn:hover:not(:disabled) { background: #34d399; }

        .action-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none !important;
        }

        .action-btn:disabled {
            background: #334155 !important;
            color: #64748b !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        .history-panel {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid var(--border-glass);
        }

        .history-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-top: 4px;
        }

        .history-pill {
            background: var(--bg-sidebar);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--border-glass);
            white-space: nowrap;
        }

        .history-pill.pill-big { color: var(--primary-blue); }
        .history-pill.pill-small { color: var(--accent-gold); }
        .history-pill.pill-tie { color: var(--accent-red); }

        @media (max-width: 768px) {
            .game-wrapper { flex-direction: column-reverse; }
            .sidebar-controls { width: 100%; border-right: none; border-top: 1px solid var(--border-glass); }
            .grid-theater { padding: 12px; min-height: 300px; }
        }
    </style>
</head>
<body>

<div class="back-nav-container">
    <a href="game.html" class="btn-back">← Back to Games</a>
</div>

<div class="header-widget">
    <div class="user-tag">👤 User: <span id="userName">Guest</span></div>
    <div class="wallet-display">🪙 <span id="userBalance">0.00</span></div>
</div>

<div class="game-wrapper">
    <div class="sidebar-controls">
        <div>
            <div class="label">Bet Amount</div>
            <div class="input-container">
                <input type="number" id="betValue" value="10" min="1">
                <button class="scale-btn" onclick="adjustStakeScale('half')">½</button>
                <button class="scale-btn" onclick="adjustStakeScale('double')">2x</button>
            </div>
        </div>

        <div>
            <div class="label">Select Prediction</div>
            <div class="betting-zones">
                <div class="zone-btn" id="zoneSmall" onclick="selectPrediction('SMALL')">
                    <div class="zone-title">SMALL</div>
                    <div class="zone-sub">4 - 10 (1:1)</div>
                </div>
                <div class="zone-btn" id="zoneBig" onclick="selectPrediction('BIG')">
                    <div class="zone-title">BIG</div>
                    <div class="zone-sub">11 - 17 (1:1)</div>
                </div>
            </div>
        </div>

        <button class="action-btn" id="mainActionBtn" onclick="executeDiceRollEngine()" disabled>Syncing Balance...</button>
    </div>

    <div class="grid-theater">
        <div class="dice-arena">
            <div class="dice-container">
                <div class="die" id="die1">?</div>
                <div class="die" id="die2">?</div>
                <div class="die" id="die3">?</div>
            </div>
            <div class="live-result-overlay" id="resultDisplay">-</div>
        </div>

        <div class="history-panel">
            <div class="label">Recent Outcomes</div>
            <div class="history-list" id="historyLog"></div>
        </div>
    </div>
</div>

<script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbzWEe-nOLyOZlwk8t76jgULfhPfXZdtDPqtaWi4dJuEIP5HMJW8GQJM7N7HPK5x63NzfQ/exec";

    let balance = 0;
    let betAmount = 0;
    let selectedPrediction = null;
    let gameActive = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSyntheticSound(frequency, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    const cleanUser = (localStorage.getItem("currentUser") || "Guest").trim();
    document.getElementById("userName").innerText = cleanUser;

    function selectPrediction(side) {
        if (gameActive) return;
        selectedPrediction = side;
        document.getElementById("zoneSmall").classList.remove("selected");
        document.getElementById("zoneBig").classList.remove("selected");
        
        if (side === "SMALL") document.getElementById("zoneSmall").classList.add("selected");
        if (side === "BIG") document.getElementById("zoneBig").classList.add("selected");
        playSyntheticSound(450, 'sine', 0.08);
    }

    function fetchLiveWallet() {
        fetch(`${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&nocache=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                balance = parseFloat(data.balance) || 0;
                document.getElementById('userBalance').innerText = balance.toFixed(2);
                if (!gameActive) {
                    const actionBtn = document.getElementById("mainActionBtn");
                    actionBtn.disabled = false;
                    actionBtn.innerText = "Roll Dice";
                }
            }
        });
    }

    function syncTxToDatabase(amountChange, outcome = "none", updateScreenUI = true) {
        let url = `${DATABASE_URL}?username=${encodeURIComponent(cleanUser)}&modify_balance=${amountChange}`;
        if(outcome !== "none") {
            url += `&game_result=${outcome}`;
        }
        
        fetch(url)
        .then(r => r.json())
        .then(data => {
            if (updateScreenUI && data && data.newBalance !== undefined) {
                balance = parseFloat(data.newBalance);
                document.getElementById('userBalance').innerText = balance.toFixed(2);
            }
        });
    }

    function adjustStakeScale(type) {
        if (gameActive) return;
        const input = document.getElementById("betValue");
        let current = parseInt(input.value) || 0;
        if (type === 'half') input.value = Math.max(1, Math.floor(current / 2));
        if (type === 'double') input.value = Math.min(balance, current * 2);
    }

    function executeDiceRollEngine() {
        if (gameActive) return;

        const betInput = document.getElementById("betValue");
        const desiredBet = parseInt(betInput.value) || 0;

        if (!selectedPrediction) {
            alert("Please select BIG or SMALL!");
            return;
        }

        if (desiredBet < 1 || desiredBet > balance) {
            alert("Stake error!");
            return;
        }

        gameActive = true;
        betAmount = desiredBet;
        balance -= betAmount;
        document.getElementById('userBalance').innerText = balance.toFixed(2);
        
        // Locking interfaces
        betInput.disabled = true;
        document.getElementById("mainActionBtn").disabled = true;
        document.getElementById("zoneSmall").classList.add("disabled");
        document.getElementById("zoneBig").classList.add("disabled");

        // Sync original stake subtraction to server
        syncTxToDatabase(-betAmount, "none", false);

        // Visual rolling animations
        const d1 = document.getElementById("die1");
        const d2 = document.getElementById("die2");
        const d3 = document.getElementById("die3");
        
        d1.classList.add("rolling");
        d2.classList.add("rolling");
        d3.classList.add("rolling");

        let rollCounter = 0;
        const rollInterval = setInterval(() => {
            d1.innerText = Math.floor(Math.random() * 6) + 1;
            d2.innerText = Math.floor(Math.random() * 6) + 1;
            d3.innerText = Math.floor(Math.random() * 6) + 1;
            playSyntheticSound(200 + Math.random() * 300, 'triangle', 0.05);
            rollCounter++;
            
            if (rollCounter >= 10) {
                clearInterval(rollInterval);
                resolveDiceEngineOutcome();
            }
        }, 120);
    }

    function resolveDiceEngineOutcome() {
        const r1 = Math.floor(Math.random() * 6) + 1;
        const r2 = Math.floor(Math.random() * 6) + 1;
        const r3 = Math.floor(Math.random() * 6) + 1;

        const d1 = document.getElementById("die1");
        const d2 = document.getElementById("die2");
        const d3 = document.getElementById("die3");

        d1.classList.remove("rolling");
        d2.classList.remove("rolling");
        d3.classList.remove("rolling");

        d1.innerText = r1;
        d2.innerText = r2;
        d3.innerText = r3;

        const totalSum = r1 + r2 + r3;
        let category = "TIE"; // Base definition for house edge sums (3 and 18)

        if (totalSum >= 4 && totalSum <= 10) {
            category = "SMALL";
        } else if (totalSum >= 11 && totalSum <= 17) {
            category = "BIG";
        }

        const display = document.getElementById("resultDisplay");
        let outcomeString = `${totalSum} (${category})`;
        
        if (category === "TIE") {
            outcomeString = `${totalSum}<br><span class="house-tie-text">HOUSE TRIPLE TIE</span>`;
        }
        display.innerHTML = outcomeString;

        // Determine dynamic payoffs
        let isWin = (selectedPrediction === category);
        let finalChangeAmount = 0;
        let gameResultStatus = "loss";

        if (isWin) {
            finalChangeAmount = betAmount * 2; // Win returns stake + matched winnings
            balance += finalChangeAmount;
            gameResultStatus = "win";
            playSyntheticSound(550, 'sine', 0.15);
            setTimeout(() => playSyntheticSound(750, 'sine', 0.2), 100);
        } else {
            playSyntheticSound(150, 'sawtooth', 0.4);
        }

        document.getElementById('userBalance').innerText = balance.toFixed(2);
        
        // Final database balancing sync
        syncTxToDatabase(finalChangeAmount, gameResultStatus, true);
        appendHistoryLog(totalSum, category);

        // Cool-down layout reset
        setTimeout(() => {
            gameActive = false;
            document.getElementById("betValue").disabled = false;
            document.getElementById("mainActionBtn").disabled = false;
            document.getElementById("zoneSmall").classList.remove("disabled");
            document.getElementById("zoneBig").classList.remove("disabled");
            document.getElementById("mainActionBtn").innerText = "Roll Dice";
        }, 2000);
    }

    function appendHistoryLog(sum, category) {
        const log = document.getElementById("historyLog");
        const pill = document.createElement("div");
        pill.className = `history-pill pill-${category.toLowerCase()}`;
        pill.innerText = `${sum} ${category[0]}`;
        
        log.insertBefore(pill, log.firstChild);
        if (log.children.length > 10) {
            log.removeChild(log.lastChild);
        }
    }

    fetchLiveWallet();
</script>
</body>
</html>
