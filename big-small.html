<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Small Learning Game</title>
<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#1e1e2f;
    color:white;
}
.top{
    display:flex;
    justify-content:space-between;
    padding:15px;
}
.box{
    background:#333;
    padding:10px 15px;
    border-radius:10px;
}
.timer{
    font-size:60px;
    margin:20px;
}
button{
    padding:12px 25px;
    margin:10px;
    cursor:pointer;
}
input{
    padding:10px;
    width:120px;
}
.history{
    max-width:500px;
    margin:auto;
    text-align:left;
}
</style>
</head>
<body>

<div class="top">
    <div class="box">Points: <span id="points">1000</span></div>
    <div class="box">Wins: <span id="wins">0</span> | Losses: <span id="losses">0</span></div>
</div>

<h1>Big Small Learning Game</h1>

<div class="timer" id="timer">20</div>

<input type="number" id="stake" value="10" min="1">

<br>

<button onclick="choose('Big')">BIG</button>
<button onclick="choose('Small')">SMALL</button>

<p id="choice"></p>

<button onclick="lockChoice()">Lock Choice</button>

<h2 id="result"></h2>

<div class="history">
    <h3>History</h3>
    <ul id="history"></ul>
</div>

<script>
let points = 1000;
let wins = 0;
let losses = 0;

let selected = "";
let lockedChoice = null;
let stakeAmount = 0;

function choose(c){
    if(lockedChoice) return;
    selected = c;
    document.getElementById("choice").innerText =
        "Selected: " + c;
}

function lockChoice(){

    if(selected === ""){
        alert("Select Big or Small");
        return;
    }

    stakeAmount =
        Number(document.getElementById("stake").value);

    if(stakeAmount <= 0){
        alert("Enter valid points");
        return;
    }

    lockedChoice = selected;

    document.getElementById("result").innerText =
        "⏳ Choice Locked";
}

function settleRound(){

    if(lockedChoice === null) return;

    const outcome =
        Math.random() < 0.5 ? "Big" : "Small";

    let msg = "";

    if(outcome === lockedChoice){

        const reward =
            Math.round(stakeAmount * 1.9);

        points += reward;
        wins++;

        msg =
            "✅ WIN | Result: " +
            outcome +
            " | +" +
            reward +
            " points";

    }else{

        points -= stakeAmount;
        losses++;

        msg =
            "❌ LOSS | Result: " +
            outcome +
            " | -" +
            stakeAmount +
            " points";
    }

    document.getElementById("points").innerText =
        points;

    document.getElementById("wins").innerText =
        wins;

    document.getElementById("losses").innerText =
        losses;

    document.getElementById("result").innerText =
        msg;

    const li =
        document.createElement("li");

    li.innerText =
        new Date().toLocaleTimeString() +
        " - " +
        msg;

    document.getElementById("history")
        .prepend(li);

    selected = "";
    lockedChoice = null;
    stakeAmount = 0;

    document.getElementById("choice").innerText =
        "";
}

let time = 20;

setInterval(() => {

    time--;

    if(time < 0){
        settleRound();
        time = 20;
    }

    document.getElementById("timer").innerText =
        time;

}, 1000);
</script>

</body>
</html>
