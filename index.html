<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Game Zone!!</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e40af,#7c3aed);
}

.container{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,0.95);
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.logo{
    font-size:70px;
}

h1{
    margin-top:10px;
    color:#111827;
}

.tagline{
    margin-top:10px;
    color:#6b7280;
    font-size:15px;
}

.btn{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

.login{
    background:#2563eb;
    color:white;
}

.register{
    background:#16a34a;
    color:white;
}

.btn:hover{
    transform:translateY(-2px);
}

.footer{
    margin-top:25px;
    color:#6b7280;
    font-size:13px;
}
</style>

</head>

<body>

<div class="container">

    <div class="logo">🎲</div>

    <h1>GAME ZONE</h1>

    <p class="tagline">
        Login to Play Games
    </p>

    <button class="btn login"
    onclick="window.location.href='login.html'">
        🔑 Login
    </button>

    <button class="btn register"
    onclick="window.location.href='register.html'">
        📝 Register
    </button>

    <div class="footer">
        Welcome to Game Zone
    </div>

</div>

</body>
</html>
