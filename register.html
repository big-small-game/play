<!DOCTYPE html>

<html>
<head>
<title>Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#2563eb,#7c3aed);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
width:90%;
max-width:400px;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
margin-bottom:20px;
color:#222;
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

button{
width:95%;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:.9;
}

#msg{
margin-top:15px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h1>Create Account</h1>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<input
type="password"
id="confirm"
placeholder="Confirm Password">

<button onclick="register()">
Register
</button>

<div id="msg"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyA_hkolHDRyi4r0rTSC8fRt-tEhXMS-4pM",
authDomain: "big-small-15ac1.firebaseapp.com",
projectId: "big-small-15ac1",
storageBucket: "big-small-15ac1.firebasestorage.app",
messagingSenderId: "445997925162",
appId: "1:445997925162:web:3eda0cfdf8c808b4d6d453"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = function(){

let username =
document.getElementById("username")
.value.trim();

let password =
document.getElementById("password")
.value;

let confirm =
document.getElementById("confirm")
.value;

if(username === ""){

document.getElementById("msg").innerHTML =
"Enter Username";

return;

}

if(password.length < 6){

document.getElementById("msg").innerHTML =
"Password must be at least 6 characters";

return;

}

if(password !== confirm){

document.getElementById("msg").innerHTML =
"Passwords do not match";

return;

}

let fakeEmail =
username + "@game.local";

createUserWithEmailAndPassword(
auth,
fakeEmail,
password
)

.then(() => {

localStorage.setItem(
"currentUser",
username
);

/* Save User To Balance Sheet */

/* Save User To Balance Sheet */
fetch(
"https://script.google.com/macros/s/AKfycbxWEe-nOLyOZlwk8t76jgULfhPfXZdtDPqtaWi4dJuEIP5HMJW8GQJM7N7HPK5x63NzfQ/exec",
{
  method: "POST",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify({
    username: username,
    balance: 0,
    wins: 0,
    losses: 0
  })
}
);

document.getElementById("msg").innerHTML =
"Registration Successful";

setTimeout(()=>{

window.location.href =
"login.html";

},1500);

})

.catch((error)=>{

document.getElementById("msg").innerHTML =
error.message;

console.error(error);

});

}

</script>

</body>
</html>
