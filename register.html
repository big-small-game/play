<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#2563eb,#7c3aed);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
width:90%;
max-width:400px;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
margin-bottom:20px;
color:#222;
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

button{
width:95%;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:.9;
}

#msg{
margin-top:15px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
    <h1>Create Account</h1>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <input type="password" id="confirm" placeholder="Confirm Password">

    <button onclick="register()">Register</button>

    <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA_hkolHDRyi4r0rTSC8fRt-tEhXMS-4pM",
    authDomain: "big-small-15ac1.firebaseapp.com",
    projectId: "big-small-15ac1",
    storageBucket: "big-small-15ac1.firebasestorage.app",
    messagingSenderId: "445997925162",
    appId: "1:445997925162:web:3eda0cfdf8c808b4d6d453"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = function(){
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;

    if(username === ""){
        document.getElementById("msg").innerHTML = "Enter Username";
        document.getElementById("msg").style.color = "#ef4444";
        return;
    }

    if(password.length < 6){
        document.getElementById("msg").innerHTML = "Password must be at least 6 characters";
        document.getElementById("msg").style.color = "#ef4444";
        return;
    }

    if(password !== confirm){
        document.getElementById("msg").innerHTML = "Passwords do not match";
        document.getElementById("msg").style.color = "#ef4444";
        return;
    }

    document.getElementById("msg").innerHTML = "Creating account...";
    document.getElementById("msg").style.color = "#2563eb";

    let fakeEmail = username + "@game.local";

    createUserWithEmailAndPassword(auth, fakeEmail, password)
    .then(() => {
        // 1. Keep track of current user locally
        localStorage.setItem("currentUser", username);

        // 2. TARGET UNIFIED APP SCRIPT URL (Using parameter routing)
        const databaseUrl = "https://script.google.com/macros/s/AKfycbxWEe-nOLyOZlwk8t76jgULfhPfXZdtDPqtaWi4dJuEIP5HMJW8GQJM7N7HPK5x63NzfQ/exec";

        fetch(`${databaseUrl}?register_user=${encodeURIComponent(username)}`, {
            method: "POST",
            mode: "no-cors"
        })
        .then(() => {
            document.getElementById("msg").innerHTML = "Registration Successful!";
            document.getElementById("msg").style.color = "#10b981";
            
            setTimeout(()=>{
                window.location.href = "login.html";
            }, 1500);
        })
        .catch((error) => {
            console.error("Database Error: ", error);
            document.getElementById("msg").innerHTML = "Registration completed with sync warning.";
            document.getElementById("msg").style.color = "#f59e0b";
            
            setTimeout(()=>{
                window.location.href = "login.html";
            }, 2000);
        });
    })
    .catch((error)=>{
        document.getElementById("msg").innerHTML = error.message;
        document.getElementById("msg").style.color = "#ef4444";
        console.error(error);
    });
}
</script>

</body>
</html>
