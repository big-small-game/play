<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA_hkolHDRyi4r0rTSC8fRt-tEhXMS-4pM",
  authDomain: "big-small-15ac1.firebaseapp.com",
  projectId: "big-small-15ac1",
  storageBucket: "big-small-15ac1.firebasestorage.app",
  messagingSenderId: "445997925162",
  appId: "1:445997925162:web:3eda0cfdf8c808b4d6d453"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = function(){

let username =
document.getElementById("username").value.trim();

let password =
document.getElementById("password").value;

let confirm =
document.getElementById("confirm").value;

if(username === ""){

document.getElementById("msg").innerHTML =
"Enter Username";

return;

}

if(password.length < 6){

document.getElementById("msg").innerHTML =
"Password must be at least 6 characters";

return;

}

if(password !== confirm){

document.getElementById("msg").innerHTML =
"Passwords do not match";

return;

}

let fakeEmail =
username + "@game.local";

createUserWithEmailAndPassword(
auth,
fakeEmail,
password
)
.then(() => {

localStorage.setItem(
"currentUser",
username
);

fetch(
"https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec",
{
method:"POST",
mode:"no-cors",
body:JSON.stringify({
username:username,
balance:0,
wins:0,
losses:0
})
}
);

document.getElementById("msg").innerHTML =
"Registration Successful";

setTimeout(()=>{
window.location.href="login.html";
},1500);

})
.catch((error)=>{

document.getElementById("msg").innerHTML =
error.message;

console.error(error);

});

}

</script>
