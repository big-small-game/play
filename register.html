<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e40af);
}

.card{
width:90%;
max-width:400px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<h1>Create Account</h1>

<input id="username" placeholder="Username">

<input id="password"
type="password"
placeholder="Password">

<input id="confirm"
type="password"
placeholder="Confirm Password">

<button onclick="registerUser()">
Register
</button>

<div id="msg"></div>

</div>

<script>

const SCRIPT_URL =
"YOUR_SCRIPT_URL";

function registerUser(){

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

let confirm =
document.getElementById("confirm").value;

if(password !== confirm){

document.getElementById("msg").innerHTML =
"Passwords do not match";

return;
}

fetch(https://script.google.com/macros/s/AKfycbyrBSSuLQs2vOQj78cg0cJZruLygNIzwkb5s625LkjhmgN1iamiSxDyxH0ttLGqm7w-2w/exec,{
method:"POST",
body:JSON.stringify({
username:username,
password:password
})
})
.then(r=>r.text())
.then(data=>{

document.getElementById("msg").innerHTML =
"Registration Successful";

setTimeout(()=>{
window.location.href="login.html";
},1500);

})
.catch(err=>{

document.getElementById("msg").innerHTML =
"Error";

});

}

</script>

</body>
</html>
