<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Games Hub Pro</title>
<style>
:root {
  --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --bg-gradient: linear-gradient(-45deg, #1f1c2c, #928dab, #0f2027, #203a43);
  --glass-bg: rgba(255, 255, 255, 0.06);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glow-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

body {
  margin: 0;
  font-family: var(--font-main);
  background: var(--bg-gradient);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  color: #f5f6fa;
  min-height: 100vh;
  text-align: center;
  overflow-x: hidden;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Floating Status Bars */
.coin-box, .account-btn {
  position: fixed;
  top: 15px;
  padding: 12px 24px;
  border-radius: 50px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glow-shadow);
  font-weight: 600;
  letter-spacing: 0.5px;
  z-index: 1000;
  transition: all 0.3s ease;
}

.account-btn {
  left: 20px;
  color: white;
  cursor: pointer;
}

.account-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
}

.coin-box {
  right: 20px;
  background: rgba(255, 215, 0, 0.15);
  border-color: rgba(255, 215, 0, 0.3);
}

/* Base Cards */
.card {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 30px;
  margin: 40px auto;
  width: 90%;
  max-width: 650px;
  box-shadow: var(--glow-shadow);
  transition: transform 0.3s ease;
}

.card:first-of-type {
  margin-top: 100px;
  background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
}

h1 {
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: 2px;
  margin: 0 0 10px 0;
  background: linear-gradient(45deg, #ff7675, #74b9ff, #a29bfe);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

.card p {
  color: #b2bec3;
  margin: 0;
  font-size: 0.95rem;
}

/* Elegant Account Menu Dropdown */
.account-menu {
  display: none;
  position: fixed;
  top: 75px;
  left: 20px;
  width: 280px;
  max-width: 90vw;
  background: rgba(15, 15, 25, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 24px;
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  z-index: 999999;
  text-align: left;
  animation: fadeIn 0.25s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.account-menu p {
  margin-top: 0;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  font-size: 1.05rem;
}

/* Menu Action Buttons */
.deposit-btn, .withdraw-btn, .logout-btn {
  color: white;
  border: none;
  padding: 14px;
  border-radius: 14px;
  width: 100%;
  font-size: 16px;
  font-weight: 600;
  margin-top: 12px;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.deposit-btn { background: linear-gradient(45deg, #00b894, #00cec9); }
.deposit-btn:hover { box-shadow: 0 0 15px rgba(0,206,201,0.4); transform: translateY(-2px); }

.withdraw-btn { background: linear-gradient(45deg, #e17055, #fdcb6e); }
.withdraw-btn:hover { box-shadow: 0 0 15px rgba(225,112,85,0.4); transform: translateY(-2px); }

.logout-btn { background: linear-gradient(45deg, #d63031, #e84393); }
.logout-btn:hover { box-shadow: 0 0 15px rgba(214,48,49,0.4); transform: translateY(-2px); }


/* Fancy Premium Grid Game Buttons */
.game-btn {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 18px auto;
  padding: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  min-height: 70px;
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
  position: relative;
  overflow: hidden;
}

.game-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: all 0.6s ease;
}

.game-btn:hover::before {
  left: 150%;
}

.game-btn:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: rgba(255,255,255,0.3);
}

/* Individual Game Styles */
.big-small {
  background: linear-gradient(45deg, #ff9f43, #ff5252);
  color: white;
  box-shadow: 0 6px 20px rgba(255, 159, 67, 0.3);
}
.big-small:hover { box-shadow: 0 12px 25px rgba(255, 159, 67, 0.5); }

.mines {
  background: linear-gradient(45deg, #2c3e50, #000000);
  color: white;
  box-shadow: 0 6px 20px rgba(44, 62, 80, 0.4);
}
.mines:hover { box-shadow: 0 12px 25px rgba(44, 62, 80, 0.6); }

.guess {
  background: linear-gradient(45deg, #10ac84, #1dd1a1);
  color: white;
  box-shadow: 0 6px 20px rgba(29, 209, 161, 0.3);
}
.guess:hover { box-shadow: 0 12px 25px rgba(29, 209, 161, 0.5); }

.memory {
  background: linear-gradient(45deg, #0abde3, #2e86de);
  color: white;
  box-shadow: 0 6px 20px rgba(10, 189, 227, 0.3);
}
.memory:hover { box-shadow: 0 12px 25px rgba(10, 189, 227, 0.5); }

.rps {
  background: linear-gradient(45deg, #5f27cd, #341f97);
  color: white;
  box-shadow: 0 6px 20px rgba(95, 39, 205, 0.3);
}
.rps:hover { box-shadow: 0 12px 25px rgba(95, 39, 205, 0.5); }

.reaction {
  background: linear-gradient(45deg, #ee5253, #ff6b6b);
  color: white;
  box-shadow: 0 6px 20px rgba(238, 82, 83, 0.3);
}
.reaction:hover { box-shadow: 0 12px 25px rgba(238, 82, 83, 0.5); }

.quiz {
  background: linear-gradient(45deg, #00d2d3, #01a3a4);
  color: white;
  box-shadow: 0 6px 20px rgba(0, 210, 211, 0.3);
}
.quiz:hover { box-shadow: 0 12px 25px rgba(0, 210, 211, 0.5); }

.soon {
  background: linear-gradient(45deg, #57606f, #2f3542);
  color: #a4b0be;
  cursor: not-allowed;
  box-shadow: none;
}
.soon:hover { transform: none; border-color: rgba(255,255,255,0.1); }


/* Responsive Scaling fixes */
@media(max-width:600px){
  h1 { font-size: 1.7rem; }
  
  .card {
    width: 92%;
    padding: 20px;
    margin: 20px auto;
  }
  
  .card:first-of-type { margin-top: 85px; }

  .account-menu {
    left: 10px;
    width: calc(100vw - 60px);
    top: 70px;
  }

  .coin-box, .account-btn {
    top: 12px;
    padding: 10px 16px;
    font-size: 13px;
  }
  .account-btn { left: 10px; }
  .coin-box { right: 10px; }
}
</style>
</head>
<body>

<button class="account-btn" onclick="toggleMenu()">👤 Account</button>

<div class="account-menu" id="menu">
<p><b>User:</b> <span id="user"></span></p>
<button class="deposit-btn" onclick="openDeposit()">
➕ Deposit
</button>

<button class="withdraw-btn" onclick="openWithdraw()">
➖ Withdraw
</button>

<button class="logout-btn" onclick="logout()">
🚪 Logout
</button>
</div>

<div class="coin-box">🪙 Balance: <span id="coins">0</span></div>

<div class="card">
<h1>🎮 MINI GAMES HUB PRO</h1>
<p>Logged In: <span id="email"></span></p>
</div>

<div class="card">
<button class="game-btn big-small" onclick="location.href='big-small.html'">
🎲 Big Small Game
</button>
<button class="game-btn mines" onclick="location.href='mines.html'">
💣 Mines
</button>
  
<button class="game-btn drgn" onclick="location.href='drgn.html'">
🐉 Dragon Tower
</button>

<button class="game-btn av" onclick="location.href='av.html'">
✈️ Crash
</button>

<button class="game-btn memory" onclick="location.href='memory.html'">
🧠 Memory Game
</button>



<button class="game-btn reaction" onclick="location.href='reaction.html'">
⚡ Reaction Test
</button>

<button class="game-btn quiz" onclick="location.href='quiz.html'">
📚 Quiz Arena
</button>

<button class="game-btn soon">
🚀 More Games Coming Soon
</button>
</div>

<script>
let user = localStorage.getItem("currentUser") || "Guest";

if(user.includes("@game.local")){
user = user.replace("@game.local","");
}
document.getElementById("email").innerText=user;
document.getElementById("user").innerText=user;
fetch("https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec?username="+user)
.then(r=>r.json())
.then(data=>{
document.getElementById("coins").innerText =
data.balance;
});

function toggleMenu(){
let m=document.getElementById("menu");
m.style.display=m.style.display==="block"?"none":"block";
}
function openDeposit(){
window.location.href = "deposit.html";
}
function openWithdraw(){
window.location.href = "withdraw.html";
}
function logout(){
localStorage.removeItem("currentUser");
window.location.href="login.html";
}
</script>
</body>
</html>
