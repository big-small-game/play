<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Games Hub Pro</title>
<style>
:root {
  --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --bg-main: #0f172a;
  --bg-card: rgba(30, 41, 59, 0.7);
  --primary-blue: #3b82f6;
  --primary-hover: #2563eb;
  --accent-gold: #f59e0b;
  --text-light: #f8fafc;
  --text-muted: #64748b;
  --border-glass: rgba(255, 255, 255, 0.08);
  --glow-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  font-family: var(--font-main);
  background-color: var(--bg-main);
  color: var(--text-light);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 12px;
  padding-bottom: 30px;
  overflow-x: hidden;
}

/* Master Mobile Workspace Wrapper */
.app-wrapper {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Sticky Premium Navigation Header */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 12px 16px;
  border-radius: 16px;
  border: 1px solid var(--border-glass);
  box-shadow: var(--glow-shadow);
}

.account-trigger {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-glass);
  color: white;
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}
.account-trigger:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

.wallet-badge {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 215, 0, 0.2);
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: 700;
  color: var(--accent-gold);
  font-size: 0.95rem;
}

/* User Hero Banner Section */
.hero-card {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(30, 41, 59, 0.4) 100%);
  border: 1px solid var(--border-glass);
  border-radius: 20px;
  padding: 20px;
  text-align: left;
  box-shadow: var(--glow-shadow);
}

.hero-card h1 {
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 4px;
  background: linear-gradient(45deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-card p {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-weight: 500;
}

/* Elegant Floating Account Context Drawer */
.account-drawer {
  display: none;
  position: absolute;
  top: 70px;
  left: 12px;
  right: 12px;
  background: rgba(15, 23, 42, 0.98);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 16px;
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  z-index: 9999;
  animation: slideDownIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideDownIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.drawer-user-info {
  font-size: 0.95rem;
  font-weight: 700;
  padding-bottom: 10px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--border-glass);
}

.drawer-btn {
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
  width: 100%;
  font-size: 0.95rem;
  font-weight: 600;
  margin-top: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-dep { background: linear-gradient(45deg, #10b981, #059669); }
.btn-wd { background: linear-gradient(45deg, #f59e0b, #d97706); }
.btn-lo { background: linear-gradient(45deg, #ef4444, #dc2626); }
.drawer-btn:active { transform: scale(0.98); }

/* Premium Grid System Game Selectors */
.games-grid-title {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  text-align: left;
  margin-left: 4px;
  margin-top: 6px;
}

.game-card-btn {
  width: 100%;
  border: 1px solid var(--border-glass);
  border-radius: 16px;
  padding: 18px 16px;
  font-size: 1.1rem;
  font-weight: 700;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.1);
  transition: transform 0.15s ease;
}

.game-card-btn:active {
  transform: scale(0.97);
}

.game-card-btn .btn-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}

.game-card-btn .sub-desc {
  font-size: 0.75rem;
  font-weight: 500;
  opacity: 0.75;
}

.game-card-btn .arrow-icon {
  font-size: 1.2rem;
  opacity: 0.6;
}

/* Brand Grid Color Spectrum Maps */
.bg-bigsmall { background: linear-gradient(135deg, #f97316, #ef4444); }
.bg-mines { background: linear-gradient(135deg, #334155, #1e293b); }
.bg-dragon { background: linear-gradient(135deg, #6366f1, #4f46e5); }
.bg-crash { background: linear-gradient(135deg, #a855f7, #9333ea); }
.bg-plinko { background: linear-gradient(135deg, #0ea5e9, #2563eb); }
.bg-reaction { background: linear-gradient(135deg, #f43f5e, #e11d48); }
.bg-quiz { background: linear-gradient(135deg, #06b6d4, #0891b2); }

.bg-soon { 
  background: #1e293b; 
  color: var(--text-muted); 
  cursor: not-allowed; 
  box-shadow: none;
  opacity: 0.6;
}
</style>
</head>
<body>

<div class="app-wrapper">
    <div class="app-header">
        <button class="account-trigger" onclick="toggleAccountMenu()">👤 Account</button>
        <div class="wallet-badge">🪙 <span id="coins">Syncing...</span></div>
    </div>

    <div class="account-drawer" id="accountMenu">
        <div class="drawer-user-info">User ID: <span id="userHandleDisplay">Loading...</span></div>
        <button class="drawer-btn btn-dep" onclick="routeTo('deposit.html')">➕ Deposit Cash</button>
        <button class="drawer-btn btn-wd" onclick="routeTo('withdraw.html')">➖ Withdraw Profits</button>
        <button class="drawer-btn btn-lo" onclick="triggerSignout()">🚪 Log Out</button>
    </div>

    <div class="hero-card">
        <h1>MINI GAMES HUB PRO</h1>
        <p>Session Active: <span id="sessionEmail" style="color: var(--text-light);">Loading...</span></p>
    </div>

    <div class="games-grid-title">Available Arena Modules</div>

    <button class="game-card-btn bg-bigsmall" onclick="routeTo('big-small.html')">
        <div class="btn-meta"><span>🎲 Big Small Game</span><span class="sub-desc">Predict total sum ranges</span></div>
        <span class="arrow-icon">➔</span>
    </button>

    <button class="game-card-btn bg-mines" onclick="routeTo('mines.html')">
        <div class="btn-meta"><span>💣 Mines Sweeper</span><span class="sub-desc">Uncover safe diamond gems</span></div>
        <span class="arrow-icon">➔</span>
    </button>

    <button class="game-card-btn bg-dragon" onclick="routeTo('drgn.html')">
        <div class="btn-meta"><span>🐉 Dragon Tower</span><span class="sub-desc">Scale the brick levels safely</span></div>
        <span class="arrow-icon">➔</span>
    </button>

    <button class="game-card-btn bg-crash" onclick="routeTo('av.html')">
        <div class="btn-meta"><span>✈️ Crash Aviator</span><span class="sub-desc">Cashout before multiplier fails</span></div>
        <span class="arrow-icon">➔</span>
    </button>

    <button class="game-card-btn bg-plinko" onclick="routeTo('plinko.html')">
        <div class="btn-meta"><span>⚽ Plinko Drop</span><span class="sub-desc">Classic peg distribution boards</span></div>
        <span class="arrow-icon">➔</span>
    </button>

    <button class="game-card-btn bg-reaction" onclick="routeTo('reaction.html')">
        <div class="btn-meta"><span>⚡ Reaction Speed</span><span class="sub-desc">Test muscle impulse responses</span></div>
        <span class="arrow-icon">➔</span>
    </button>

    <button class="game-card-btn bg-quiz" onclick="routeTo('quiz.html')">
        <div class="btn-meta"><span>📚 Quiz Arena</span><span class="sub-desc">Wager tokens on smart answers</span></div>
        <span class="arrow-icon">➔</span>
    </button>

    <button class="game-card-btn bg-soon" disabled>
        <div class="btn-meta"><span>🚀 Upcoming Realtime Modules</span><span class="sub-desc">New code engines in construction</span></div>
    </button>
</div>

<script>
// CENTRAL GOOGLE APPS SCRIPT DATABASE CONNECTION ENDPOINT
const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

let rawStorageUser = localStorage.getItem("currentUser") || "Guest";
let dynamicUserHandle = rawStorageUser.trim();

if(dynamicUserHandle.includes("@")) {
    dynamicUserHandle = dynamicUserHandle.split("@")[0];
}

document.getElementById("sessionEmail").innerText = dynamicUserHandle;
document.getElementById("userHandleDisplay").innerText = dynamicUserHandle;

// Core balance syncing function
function forceSyncWalletData() {
    document.getElementById("coins").innerText = "Syncing...";
    
    // Append a random timestamp parameter onto query requests to destroy browser cache metrics
    fetch(`${DATABASE_URL}?username=${encodeURIComponent(dynamicUserHandle)}&nocache=${Date.now()}`)
    .then(response => response.json())
    .then(data => {
        if(data && data.balance !== undefined) {
            let extractedBalanceValue = parseFloat(data.balance);
            document.getElementById("coins").innerText = extractedBalanceValue.toFixed(2);
        } else {
            document.getElementById("coins").innerText = "Sync Error";
        }
    })
    .catch(error => {
        console.error("Network dashboard tracking sync failure:", error);
        document.getElementById("coins").innerText = "Offline";
    });
}

function toggleAccountMenu() {
    let menuElement = document.getElementById("accountMenu");
    menuElement.style.display = menuElement.style.display === "block" ? "none" : "block";
}

function routeTo(targetFile) {
    window.location.href = targetFile;
}

function triggerSignout() {
    localStorage.removeItem("currentUser");
    window.location.href = "login.html";
}

// CRITICAL FIX: Forces page to fetch un-cached balance data whenever it's shown
window.addEventListener("pageshow", function(event) {
    forceSyncWalletData();
});

// Watch window visibility state changes (e.g., app minimizing or back-navigation patterns)
document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") {
        forceSyncWalletData();
    }
});
</script>
</body>
</html>
