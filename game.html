<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Games Hub Pro</title>
<style>
:root {
  --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --bg-main: #060b19;
  --bg-card: rgba(15, 23, 42, 0.55);
  --primary-blue: #3b82f6;
  --accent-gold: #f59e0b;
  --text-light: #f8fafc;
  --text-muted: #64748b;
  --border-glass: rgba(255, 255, 255, 0.07);
  --glow-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  font-family: var(--font-main);
  background-color: var(--bg-main);
  color: var(--text-light);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px;
  padding-bottom: 40px;
  overflow-x: hidden;
  position: relative;
}

#bgCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  pointer-events: none;
}

.app-wrapper {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  z-index: 10;
}

/* New User Welcome Message Notification Banner */
.welcome-alert-banner {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(147, 51, 234, 0.2) 100%);
  border: 1px solid rgba(147, 51, 234, 0.4);
  padding: 14px 16px;
  border-radius: 16px;
  font-size: 0.9rem;
  line-height: 1.4;
  color: #e0f2fe;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  display: none; /* Controlled dynamically by JS */
  animation: pulseGlow 2s infinite alternate;
}

@keyframes pulseGlow {
  from { border-color: rgba(147, 51, 234, 0.4); }
  to { border-color: rgba(59, 130, 246, 0.8); }
}

.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 10px 14px;
  border-radius: 50px;
  border: 1px solid var(--border-glass);
  box-shadow: var(--glow-shadow);
}

.account-trigger {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.03));
  border: 2px solid var(--primary-blue);
  color: white;
  border-radius: 50%;
  font-size: 1.25rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.account-trigger:active { 
  transform: scale(0.9);
}

.wallet-badge {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 215, 0, 0.25);
  padding: 8px 18px;
  border-radius: 30px;
  font-weight: 800;
  color: var(--accent-gold);
  font-size: 0.95rem;
}

.account-drawer {
  display: none;
  position: absolute;
  top: 76px;
  left: 0;
  right: 0;
  background: rgba(10, 15, 30, 0.96);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 20px;
  border-radius: 24px;
  box-shadow: 0 24px 50px rgba(0,0,0,0.8);
  z-index: 9999;
}

.drawer-user-info {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  padding-bottom: 12px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border-glass);
}

.drawer-btn {
  color: white;
  border: none;
  padding: 14px;
  border-radius: 12px;
  width: 100%;
  font-size: 0.95rem;
  font-weight: 700;
  margin-top: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-dep { background: linear-gradient(135deg, #10b981, #059669); }
.btn-wd { background: linear-gradient(135deg, #f59e0b, #d97706); }
.btn-lo { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); color: #f87171; }

.hero-card {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-glass);
  border-radius: 24px;
  padding: 22px;
  box-shadow: var(--glow-shadow);
}

.hero-card h1 {
  font-size: 1.5rem;
  font-weight: 900;
  background: linear-gradient(45deg, #60a5fa, #a78bfa, #f472b6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-card p {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 4px;
}

.games-grid-title {
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  margin-left: 4px;
}

.games-matrix-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  width: 100%;
}

.game-card-btn {
  border: 1px solid var(--border-glass);
  border-radius: 20px;
  padding: 22px 14px;
  color: white;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  aspect-ratio: 1 / 1;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 8px 16px rgba(0,0,0,0.2);
  transition: transform 0.15s ease;
}
.game-card-btn:active { transform: scale(0.95); }
.game-card-btn .game-icon { font-size: 2.2rem; }
.game-card-btn .game-title { font-size: 0.95rem; font-weight: 800; }
.game-card-btn .sub-desc { font-size: 0.7rem; opacity: 0.55; }

.span-full { grid-column: span 2; aspect-ratio: auto; padding: 16px; }
.bg-bigsmall { background: linear-gradient(135deg, #f97316 0%, #ef4444 100%); }
.bg-mines { background: linear-gradient(135deg, #475569 0%, #1e293b 100%); }
.bg-dragon { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
.bg-crash { background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%); }
.bg-plinko { background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); }
.bg-soon { background: rgba(30, 41, 59, 0.4); color: var(--text-muted); cursor: not-allowed; opacity: 0.4; box-shadow: none; }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="app-wrapper">
    <!-- Highlight Notification Alert Bar Box for New Users -->
    <div class="welcome-alert-banner" id="welcomeGuide">
        👋 Welcome! Please click on the **Account icon** at the top left to deposit and withdraw money.
    </div>

    <!-- Header Navigation Bar -->
    <div class="app-header">
        <button class="account-trigger" onclick="toggleAccountMenu()">👤</button>
        <div class="wallet-badge">🪙 <span id="coins">Syncing...</span></div>
    </div>

    <!-- Dropdown Account Modal Drawer Context Menu -->
    <div class="account-drawer" id="accountMenu">
        <div class="drawer-user-info">ID: <span id="userHandleDisplay" style="color: white;">Loading...</span></div>
        <button class="drawer-btn btn-dep" onclick="routeTo('deposit.html')">➕ Deposit Money</button>
        <button class="drawer-btn btn-wd" onclick="routeTo('withdraw.html')">➖ Withdraw Money</button>
        <button class="drawer-btn btn-lo" onclick="triggerSignout()">🚪 Log Out Account</button>
    </div>

    <!-- Hero Card Profiler -->
    <div class="hero-card">
        <h1>MINI GAMES HUB PRO</h1>
        <p>Active Profile: <span id="sessionEmail" style="color: var(--text-light);">Loading...</span></p>
    </div>

    <div class="games-grid-title">Arena Game Grid</div>

    <!-- Grid Layout -->
    <div class="games-matrix-grid">
        <button class="game-card-btn bg-bigsmall" onclick="routeTo('big-small.html')">
            <span class="game-icon">🎲</span>
            <span class="game-title">Big Small</span>
            <span class="sub-desc">Predict range sums</span>
        </button>

        <button class="game-card-btn bg-mines" onclick="routeTo('mines.html')">
            <span class="game-icon">💣</span>
            <span class="game-title">Mines</span>
            <span class="sub-desc">Find safe diamonds</span>
        </button>

        <button class="game-card-btn bg-dragon" onclick="routeTo('drgn.html')">
            <span class="game-icon">🐉</span>
            <span class="game-title">Dragon Tower</span>
            <span class="sub-desc">Scale brick steps</span>
        </button>

        <button class="game-card-btn bg-crash" onclick="routeTo('av.html')">
            <span class="game-icon">✈️</span>
            <span class="game-title">Crash</span>
            <span class="sub-desc">Flight multiplier</span>
        </button>

        <button class="game-card-btn bg-plinko" onclick="routeTo('plinko.html')">
            <span class="game-icon">⚽</span>
            <span class="game-title">Plinko</span>
            <span class="sub-desc">Peg path drops</span>
        </button>

        <button class="game-card-btn bg-soon span-full" disabled>
            <span class="game-title">🚀 More Modules Pending</span>
            <span class="sub-desc">Constructing new engines...</span>
        </button>
    </div>
</div>

<script>
const DATABASE_URL = "https://script.google.com/macros/s/AKfycbx-M5MGczqP_X9SHWvUGmO0HlEVhIyFRakyjtHrKGi9rW_m-83TcwP6rn2mDrzDnCOv/exec";

let rawStorageUser = localStorage.getItem("currentUser") || "Guest";
let dynamicUserHandle = rawStorageUser.trim();

if(dynamicUserHandle.includes("@")) {
    dynamicUserHandle = dynamicUserHandle.split("@")[0];
}

document.getElementById("sessionEmail").innerText = dynamicUserHandle;
document.getElementById("userHandleDisplay").innerText = dynamicUserHandle;

// Core balance syncing engine with strict cache-busting architecture
function forceSyncWalletData() {
    fetch(`${DATABASE_URL}?username=${encodeURIComponent(dynamicUserHandle)}&nocache=${Date.now()}`)
    .then(response => response.json())
    .then(data => {
        if(data && data.balance !== undefined) {
            let extractedBalanceValue = parseFloat(data.balance);
            document.getElementById("coins").innerText = extractedBalanceValue.toFixed(2);
            
            // Onboarding display rule handler: show notice banner if account is completely fresh or has no coins
            if (extractedBalanceValue === 0) {
                document.getElementById("welcomeGuide").style.display = "block";
            } else {
                document.getElementById("welcomeGuide").style.display = "none";
            }
        }
    })
    .catch(error => console.error("Sync error:", error));
}

function toggleAccountMenu() {
    let menuElement = document.getElementById("accountMenu");
    menuElement.style.display = menuElement.style.display === "block" ? "none" : "block";
}

function routeTo(targetFile) {
    window.location.href = targetFile;
}

function triggerSignout() {
    localStorage.removeItem("currentUser");
    window.location.href = "login.html";
}

// PERMANENT FIX FOR BALANCE BUG: Force updates on visibility changes and back actions
window.addEventListener("pageshow", function(event) {
    forceSyncWalletData();
});

document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") {
        forceSyncWalletData();
    }
});

// BACKGROUND SYNC ENGINE INTERVAL LOOP:
// Checks for out-of-sync backend sheet alterations every 3 seconds while active
setInterval(() => {
    if (document.visibilityState === "visible") {
        forceSyncWalletData();
    }
}, 3000);


// Animated Background Matrix Logic
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

for (let i = 0; i < 45; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2.5 + 0.5,
        alpha: Math.random() * 0.5 + 0.1,
        speed: Math.random() * 0.15 + 0.05
    });
}

function animateBackgroundMesh() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#060b19');
    grad.addColorStop(1, '#0c152b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.y -= p.speed;
        if (p.y < -10) {
            p.y = canvas.height + 10;
            p.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(96, 165, 250, ${p.alpha})`;
        ctx.fill();
    }
    requestAnimationFrame(animateBackgroundMesh);
}
animateBackgroundMesh();
</script>
</body>
</html>
