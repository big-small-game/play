<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Games Hub</title>

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#ff6b6b,#6c5ce7,#00cec9);
min-height:100vh;
color:white;
text-align:center;
}

.header{
padding:20px;
}

.card{
background:rgba(255,255,255,0.15);
margin:20px auto;
padding:20px;
width:90%;
max-width:500px;
border-radius:20px;
backdrop-filter:blur(10px);
}

.game-btn{
display:block;
width:90%;
margin:15px auto;
padding:18px;
border:none;
border-radius:15px;
font-size:20px;
cursor:pointer;
font-weight:bold;
}

.guess{background:#f39c12;color:white;}
.memory{background:#00b894;color:white;}
.rps{background:#6c5ce7;color:white;}
.reaction{background:#e84393;color:white;}
.quiz{background:#0984e3;color:white;}

.logout{
background:white;
color:black;
padding:10px 20px;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h1>🎮 MINI GAMES HUB</h1>

<div class="card">

<p>
Logged In:
<span id="email"></span>
</p>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

</div>

<div class="card">

<h2>Choose A Game</h2>

<button class="game-btn guess"
onclick="location.href='guess.html'">
🎯 Number Guess Challenge </button>

<button class="game-btn memory"
onclick="location.href='memory.html'">
🧠 Memory Game </button>

<button class="game-btn rps"
onclick="location.href='rps.html'">
✊ Rock Paper Scissors </button>

<button class="game-btn reaction"
onclick="location.href='reaction.html'">
⚡ Reaction Time Test </button>

<button class="game-btn quiz"
onclick="location.href='quiz.html'">
📚 Quiz Arena </button>

</div>

<script>

let user =
localStorage.getItem("currentUser");

document.getElementById("email")
.innerHTML =
user || "Guest";

function logout(){

localStorage.removeItem("currentUser");

window.location.href =
"login.html";

}

</script>

</body>
</html>
