
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Games Hub Pro</title>
<style>
body{
margin:0;
font-family:Segoe UI,sans-serif;
background:linear-gradient(-45deg,#ff6b6b,#6c5ce7,#00cec9,#fdcb6e);
background-size:400% 400%;
animation:bg 12s ease infinite;
color:white;
min-height:100vh;
text-align:center;
}
@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(12px);
border-radius:20px;
padding:20px;
margin:20px auto;
width:90%;
max-width:600px;
box-shadow:0 0 25px rgba(255,255,255,.2);
}
.coin-box,.account-btn{
position:fixed;
top:20px;
padding:12px 18px;
border-radius:15px;
background:rgba(255,255,255,.2);
backdrop-filter:blur(10px);
}
.coin-box{
position:fixed;
top:10px;
right:10px;
font-size:14px;
padding:10px;
z-index:1000;
}

.account-btn{
position:fixed;
top:10px;
left:10px;
font-size:14px;
padding:10px;
z-index:1000;
}
@media(max-width:600px){

h1{
font-size:24px;
margin-top:70px;
}

.card{
width:95%;
padding:15px;
}

.game-btn{
font-size:16px;
padding:15px;
}

.account-menu{
display:none;
position:absolute;
top:55px;
left:0;
width:230px;
background:rgba(20,20,20,0.95);
padding:15px;
border-radius:15px;
text-align:left;
box-shadow:0 4px 20px rgba(0,0,0,0.5);
z-index:99999;
}
.account-box{
position:fixed;
top:15px;
left:15px;
z-index:99999;
}
.modal-content{
width:90%;
margin:25% auto;
}

}
.account-menu{
display:none;
position:fixed;
top:70px;
left:20px;
background:rgba(0,0,0,.8);
padding:15px;
border-radius:15px;
width:220px;
}
@media(max-width:600px){

.game-btn{
display:block;
width:95%;
margin:15px auto;
padding:22px;
border:none;
border-radius:20px;
font-size:22px;
font-weight:bold;
cursor:pointer;
min-height:75px;
transition:.3s;
}

.game-btn:hover{
transform:translateY(-5px) scale(1.03);
}

.big-small{
background:linear-gradient(45deg,#ffb300,#ff6f00);
color:white;
box-shadow:0 0 20px rgba(255,179,0,.5);
}

.guess{
background:linear-gradient(45deg,#00c853,#00e676);
color:white;
box-shadow:0 0 20px rgba(0,200,83,.5);
}

.memory{
background:linear-gradient(45deg,#00b8d4,#18ffff);
color:white;
box-shadow:0 0 20px rgba(0,184,212,.5);
}

.rps{
background:linear-gradient(45deg,#7c4dff,#b388ff);
color:white;
box-shadow:0 0 20px rgba(124,77,255,.5);
}

.reaction{
background:linear-gradient(45deg,#ff1744,#ff4081);
color:white;
box-shadow:0 0 20px rgba(255,23,68,.5);
}

.quiz{
background:linear-gradient(45deg,#2979ff,#00b0ff);
color:white;
box-shadow:0 0 20px rgba(41,121,255,.5);
}

.soon{
background:linear-gradient(45deg,#616161,#9e9e9e);
color:white;
box-shadow:0 0 20px rgba(158,158,158,.5);
}

.deposit-btn{
background:#00c853;
color:white;
border:none;
padding:14px;
border-radius:12px;
width:100%;
font-size:18px;
margin-top:10px;
}

.withdraw-btn{
background:#ff9100;
color:white;
border:none;
padding:14px;
border-radius:12px;
width:100%;
font-size:18px;
margin-top:10px;
}

.logout-btn{
background:#ff1744;
color:white;
border:none;
padding:14px;
border-radius:12px;
width:100%;
font-size:18px;
margin-top:10px;
}

}
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
}
.modal-content{
background:white;
color:black;
max-width:350px;
margin:10% auto;
padding:20px;
border-radius:15px;
}
input{
width:95%;
padding:10px;
margin:8px 0;
}
</style>
</head>
<body>

<button class="account-btn" onclick="toggleMenu()">👤 Account</button>

<div class="account-menu" id="menu">
<p><b>User:</b> <span id="user"></span></p>
<button class="deposit-btn" onclick="openDeposit()">
➕ Deposit
</button>

<button class="withdraw-btn" onclick="openWithdraw()">
➖ Withdraw
</button>

<button class="logout-btn" onclick="logout()">
🚪 Logout
</button>
</div>

<div class="coin-box">🪙 Balance: <span id="coins">0</span></div>

<div class="card">
<h1>🎮 MINI GAMES HUB PRO</h1>
<p>Logged In: <span id="email"></span></p>
</div>

<div class="card">
<button class="game-btn big-small"
onclick="location.href='big-small.html'">
🎲 Big Small Game
</button>

<button class="game-btn guess"
onclick="location.href='guess.html'">
🎯 Number Guess
</button>

<button class="game-btn memory"
onclick="location.href='memory.html'">
🧠 Memory Game
</button>

<button class="game-btn rps"
onclick="location.href='rps.html'">
✊ Rock Paper Scissors
</button>

<button class="game-btn reaction"
onclick="location.href='reaction.html'">
⚡ Reaction Test
</button>

<button class="game-btn quiz"
onclick="location.href='quiz.html'">
📚 Quiz Arena
</button>

<button class="game-btn soon">
🚀 More Games Coming Soon
</button>
</div>

<div class="modal" id="depositModal">
<div class="modal-content">
<h3>💰 Deposit</h3>

<p class="pay-info">
Pay To:
<b>yourupi@upi</b>
</p>

<input id="depAmount" placeholder="Amount">
<input id="depId" placeholder="Payment ID">
<button onclick="submitDeposit()">Submit</button>
<button onclick="closeModals()">Close</button>
</div>
</div>

<div class="modal" id="withdrawModal">
<div class="modal-content">
<h3>Withdraw</h3>
<input id="withAmount" placeholder="Amount">
<input id="withId" placeholder="Withdraw ID">
<button onclick="submitWithdraw()">Submit</button>
<button onclick="closeModals()">Close</button>
</div>
</div>

<script>
let user=localStorage.getItem("currentUser")||"Guest";
document.getElementById("email").innerText=user;
document.getElementById("user").innerText=user;

function toggleMenu(){
let m=document.getElementById("menu");
m.style.display=m.style.display==="block"?"none":"block";
}
function openDeposit(){document.getElementById("depositModal").style.display="block";}
function openWithdraw(){document.getElementById("withdrawModal").style.display="block";}
function closeModals(){
document.getElementById("depositModal").style.display="none";
document.getElementById("withdrawModal").style.display="none";
}

function submitDeposit(){

fetch("https://script.google.com/macros/s/AKfycbxdewVWmLbZ5Z6iVrnm01ARLX1z51eUVDunoz6tbkEqam2v2XKrD2SWIr-CSuF0HFRg/exec",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:user,
amount:document.getElementById("depAmount").value,
paymentId:document.getElementById("depId").value
})
})
.then(r=>r.text())
.then(data=>{
console.log("Server Response:",data);
alert("Deposit submitted");
})
.catch(err=>{
console.error("Deposit Error:",err);
alert("Deposit failed: " + err);
});

}

function submitWithdraw(){
fetch("https://script.google.com/macros/s/AKfycbzWEe-nOLyOZlwk8t76jgULfhPfXZdtDPqtaWi4dJuEIP5HMJW8GQJM7N7HPK5x63NzfQ/exec",{
method:"POST",
body:JSON.stringify({
username:user,
amount:document.getElementById("withAmount").value,
withdrawId:document.getElementById("withId").value
})
}).then(r => r.text())
.then(data => {
console.log(data);
alert("Withdraw submitted");
})
.catch(err => {
console.error(err);
alert("Withdraw failed");
});
}
function logout(){

localStorage.removeItem("currentUser");

window.location.href="login.html";

}
</script>
</body>
</html>
